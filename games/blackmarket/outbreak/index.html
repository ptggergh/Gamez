const TYPES=[['Shambler','#7b9c78',32,39,8,1],['Runner','#b4a976',21,73,7,1.3],['Brute','#8b6e79',110,23,17,2],['Screamer','#b2a4ae',24,41,7,1.1],['Crawler','#9b835b',19,36,5,.8],['Spitter','#88b9a5',28,35,9,1.3],['Soldier','#667c74',55,40,11,1.4],['Tyrant','#b36263',370,35,26,3]];

const LOOT={House:['food','water','cloth','wood','bat','bandage'],Apartment:['food','water','cloth','bandage'],Grocery:['food','water','seeds'],Pharmacy:['medicine','bandage','medkit'],Hardware:['wood','nails','scrap','axe','plank'], 'Pawn Shop':['pistol','ammo','knife','armor'], 'Gas Station':['fuel','food','water'],Police:['ammo','pistol','armor','medkit'],Warehouse:['scrap','wood','wire','nails'],Clinic:['medkit','bandage','medicine']};
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),modal=document.getElementById('modal'),content=document.getElementById('content');let W=innerWidth,H=innerHeight,dpr=1;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b,c,d)=>Math.hypot(a-c,b-d),rand=(a,b)=>a+Math.random()*(b-a);function hash(s){let h=2166136261;for(let c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function rng(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}function pick(r,arr){return arr[Math.floor(r()*arr.length)]}function money(n){return Math.round(n).toLocaleString()}
let state=null,world=null,buildings=[],containers=[],zombies=[],survivors=[],structures=[],particles=[],shots=[],keys={},mouse={x:0,y:0,down:false},camera={x:0,y:0,zoom:1},paused=true,view='menu',buildMode=null,last=performance.now(),accum=0,saveClock=0,uiClock=0,noise=null,feed=[],audio=null,meta=readMeta();function readMeta(){try{return JSON.parse(localStorage.getItem(CONFIG.metaKey))||{points:0,bonus:0,record:0}}catch{return{points:0,bonus:0,record:0}}}function saveMeta(){localStorage.setItem(CONFIG.metaKey,JSON.stringify(meta))}
function tile(x,y){if(!world||x<0||y<0||x>=80||y>=80)return null;return world[y*80+x]}function setTile(x,y,t){if(x>=0&&y>=0&&x<80&&y<80)world[y*80+x]=t}function blocked(x,y){let t=tile(Math.floor(x/32),Math.floor(y/32));return !t||t===3||t===4||t===6||structures.some(s=>s.hp>0&&s.solid&&Math.abs(s.x-x)<25&&Math.abs(s.y-y)<25)}function collision(x,y,r=9){return blocked(x-r,y-r)||blocked(x+r,y-r)||blocked(x-r,y+r)||blocked(x+r,y+r)}
function generate(seed){let r=rng(hash(seed));world=Array(6400).fill(0);buildings=[];containers=[];structures=[];zombies=[];survivors=[];let roads=[17,18,39,40,61,62];for(let y=0;y<80;y++)for(let x=0;x<80;x++){let t=0;if(x<4||y<4||x>75||y>75)t=r()<.67?5:0;else if(roads.includes(x)||roads.includes(y))t=1;else if(x%22===0||y%22===0)t=2;else if(r()<.035)t=5;setTile(x,y,t)}
let specs=[];for(let by=5;by<73;by+=11)for(let bx=5;bx<73;bx+=11){if(roads.some(v=>Math.abs(v-bx)<5||Math.abs(v-by)<5))continue;if(r()<.16)continue;let w=6+Math.floor(r()*3),h=5+Math.floor(r()*3),type=pick(r,BTYPE);if(bx>48&&by>48)type=pick(r,['Warehouse','Hardware','Gas Station']);if(bx<25&&by<30)type=pick(r,['House','Apartment','Grocery']);specs.push({x:bx,y:by,w,h,type,doorX:bx+Math.floor(w/2),doorY:by+h-1});}
for(let b of specs){let valid=true;for(let y=b.y-1;y<=b.y+b.h;y++)for(let x=b.x-1;x<=b.x+b.w;x++)if(tile(x,y)===1)valid=false;if(!valid)continue;buildings.push(b);for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++){let edge=x===b.x||y===b.y||x===b.x+b.w-1||y===b.y+b.h-1;setTile(x,y,edge?3:7)}setTile(b.doorX,b.doorY,8);for(let i=0;i<3+Math.floor(r()*3);i++){let x=b.x+1+Math.floor(r()*(b.w-2)),y=b.y+1+Math.floor(r()*(b.h-2));containers.push({x:x*32+16,y:y*32+16,used:false,type:b.type,kind:pick(r,['Shelf','Cabinet','Crate','Locker','Fridge'])})}}
for(let i=0;i<12;i++){let x=6+Math.floor(r()*68),y=6+Math.floor(r()*68);if(tile(x,y)===0){containers.push({x:x*32+16,y:y*32+16,used:false,type:'House',kind:'Abandoned Bag'})}}
for(let i=0;i<80;i++){let x=rand(130,2430),y=rand(130,2430);if(!collision(x,y)&&dist(x,y,40*32,40*32)>260)spawnZombie(x,y,Math.floor(r()*Math.min(3,1+Math.floor(i/25))))}
for(let i=0;i<7;i++){let x=rand(150,2400),y=rand(150,2400);if(!collision(x,y))survivors.push({x,y,name:pick(r,['Mara','Alex','Noah','Eden','Kai','Jules','Riley','Sam']),role:'Wanderer',recruited:false,hp:70,phase:r()*6})}}
function spawnZombie(x,y,type=0){let d=TYPES[type];zombies.push({x,y,type,hp:d[2],max:d[2],speed:d[3],damage:d[4],radius:10*d[5],phase:rand(0,7),wander:rand(0,7),dx:0,dy:0,attack:0,pathClock:0})}
function makeState(seed,name,background,trait){return{seed,name:name||'Survivor',background,trait,x:40*32+16,y:40*32+16,hp:100,hunger:95,thirst:95,stamina:100,fatigue:0,infection:0,bleed:0,day:1,time:8*60,elapsed:0,kills:0,crafted:0,looted:0,built:0,inventory:{water:2,food:2,bandage:2,bat:1,wood:3,...(meta.bonus?{medkit:1,backpack:1}:{})},weapon:'bat',ammo:0,mag:0,attack:0,hit:0,flashlight:true,weather:'Clear',shelter:null,claimed:false,achievements:[],rescue:false,hot:0,zoom:1}}
function newGame(seed,name,bg,trait){generate(seed);state=makeState(seed,name,bg,trait);let t=tile(40,40);if(t===3||t===4||t===6){state.x=39*32+16;state.y=39*32+16}for(let y=36;y<45;y++)for(let x=36;x<45;x++)if(tile(x,y)===5)setTile(x,y,0);zombies=zombies.filter(z=>dist(z.x,z.y,state.x,state.y)>290);camera.x=state.x;camera.y=state.y;paused=false;view='game';closeModal();notify('Find supplies. The sun sets at 20:00.');save()}
function inventoryWeight(){return Object.entries(state.inventory).reduce((n,[id,q])=>n+(ITEM[id]?.weight||0)*q,0)}function capacity(){return 24+(state.inventory.backpack?18:0)}function addItem(id,n){let w=(ITEM[id]?.weight||1)*n;if(inventoryWeight()+w>capacity()){notify('Backpack full — cannot carry more.','bad');return false}state.inventory[id]=(state.inventory[id]||0)+n;return true}function consume(id,n=1){if((state.inventory[id]||0)<n)return false;state.inventory[id]-=n;if(!state.inventory[id])delete state.inventory[id];return true}function canAfford(cost){return Object.entries(cost).every(([id,n])=>(state.inventory[id]||0)>=n)}function pay(cost){if(!canAfford(cost))return false;for(let[id,n]of Object.entries(cost))consume(id,n);return true}function useItem(id){if(!consume(id))return;let d=ITEM[id];if(d.effect==='infection'){state.infection=0;notify('Infection treated.')}else if(d.effect){state[d.effect]=clamp(state[d.effect]+d.power,0,100);notify('Used '+d.name)}else{addItem(id,1);notify('Select a usable item.')}updatePanels()}
function notify(msg,bad=false){feed.unshift({msg,bad,time:5});feed=feed.slice(0,5);document.getElementById('feed').innerHTML=feed.map(f=>`<div class="notice" style="border-color:${f.bad?'#ed8279':'#b6e78b'}">${esc(f.msg)}</div>`).join('')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){if(!state||state.hp<=0)return;try{localStorage.setItem(CONFIG.saveKey,JSON.stringify({version:1,state,world,buildings,containers,zombies:zombies.slice(0,120),survivors,structures}));}catch(e){notify('Save storage full.','bad')}}function load(){try{let s=JSON.parse(localStorage.getItem(CONFIG.saveKey));if(!s||s.version!==1||!s.state||!Array.isArray(s.world)||s.world.length!==6400)throw Error();({state,world,buildings,containers,zombies,survivors,structures}=s);camera.x=state.x;camera.y=state.y;paused=false;view='game';closeModal();notify('Saved world restored.');return true}catch{notify('No compatible save found.','bad');return false}}
function screenToWorld(x,y){return{x:(x-W/2)/camera.zoom+camera.x,y:(y-H/2)/camera.zoom+camera.y}}function worldToScreen(x,y){return{x:(x-camera.x)*camera.zoom+W/2,y:(y-camera.y)*camera.zoom+H/2}}
function nearest(list,range){let best=null,d=range;for(let o of list){let dd=dist(state.x,state.y,o.x,o.y);if(dd<d){best=o;d=dd}}return best}
function interact(){if(!state||paused)return;let c=nearest(containers.filter(c=>!c.used),64);let s=nearest(survivors.filter(s=>!s.recruited),58);let door=null,dd=58;for(let b of buildings){let x=b.doorX*32+16,y=b.doorY*32+16,d=dist(state.x,state.y,x,y);if(d<dd){door=b;dd=d}}let bed=nearest(structures.filter(s=>s.type==='bed'),52);let candidates=[[c,c?dist(state.x,state.y,c.x,c.y):999,'loot'],[s,s?dist(state.x,state.y,s.x,s.y):999,'survivor'],[door,dd,'door'],[bed,bed?dist(state.x,state.y,bed.x,bed.y):999,'bed']].sort((a,b)=>a[1]-b[1]);let [obj,d,kind]=candidates[0];if(!obj||d>64){notify('Nothing nearby to interact with.');return}if(kind==='loot'){obj.used=true;state.looted++;let r=rng(hash(state.seed+':'+obj.x+':'+obj.y));let loot=LOOT[obj.type]||LOOT.House;let found=[];for(let i=0;i<1+Math.floor(r()*3);i++){let id=pick(r,loot),n=id==='ammo'?4+Math.floor(r()*9):1+Math.floor(r()*2);if(addItem(id,n))found.push(`${n} ${ITEM[id].name}`)}notify(found.length?'Found: '+found.join(', '):'Container empty / bag full');sound(340,.08);achievement('First Scavenge',state.looted>=1)}else if(kind==='survivor'){obj.recruited=true;obj.role='Guard';notify(`${obj.name} joined your group! Open Base to assign a role.`);achievement('Not Alone',true)}else if(kind==='door'){let t=tile(obj.doorX,obj.doorY);setTile(obj.doorX,obj.doorY,t===8?9:8);notify(t===8?'Door opened.':'Door closed.');sound(180,.1)}else if(kind==='bed'){state.fatigue=Math.max(0,state.fatigue-50);state.time+=180;state.hunger-=7;state.thirst-=9;notify('Rested for 3 in-game hours.')}}
function achievement(id,ok){if(ok&&!state.achievements.includes(id)){state.achievements.push(id);notify('🏅 ACHIEVEMENT: '+id);sound(660,.25)}}
function attack(){if(!state||paused||state.attack>0)return;let id=state.weapon,d=ITEM[id]||ITEM.bat;if(id!=='fists'&&!state.inventory[id]){state.weapon='fists';d={damage:9,reach:40,cool:.42}}if(state.stamina<8)return;state.stamina-=d.ranged?5:9;state.attack=d.cool;let aim=screenToWorld(mouse.x,mouse.y),angle=Math.atan2(aim.y-state.y,aim.x-state.x);state.lastAngle=angle;let hit=false;if(d.ranged){if(!consume('ammo')){notify('Out of ammo! Find ammunition.','bad');return}noise={x:state.x,y:state.y,t:4,r:440};shots.push({x:state.x,y:state.y,angle,life:.12});for(let z of zombies){let dis=dist(state.x,state.y,z.x,z.y),a=Math.atan2(z.y-state.y,z.x-state.x),delta=Math.atan2(Math.sin(a-angle),Math.cos(a-angle));if(dis<d.reach&&Math.abs(delta)<.11){z.hp-=d.damage;hit=true;break}}sound(140,.12)}else{noise={x:state.x,y:state.y,t:1,r:115};for(let z of zombies){let dis=dist(state.x,state.y,z.x,z.y),a=Math.atan2(z.y-state.y,z.x-state.x),delta=Math.atan2(Math.sin(a-angle),Math.cos(a-angle));if(dis<d.reach&&Math.abs(delta)<.85){z.hp-=d.damage;z.x+=Math.cos(a)*13;z.y+=Math.sin(a)*13;hit=true}}sound(hit?120:260,.07)}if(hit){for(let i=0;i<6;i++)particles.push({x:state.x+Math.cos(angle)*35,y:state.y+Math.sin(angle)*35,vx:rand(-80,80),vy:rand(-80,80),life:.3,color:'#bb6d66'})}}

function update(dt){if(!state||paused)return;state.elapsed+=dt;state.time+=dt*2;state.attack=Math.max(0,state.attack-dt);state.hit=Math.max(0,state.hit-dt);let newDay=false;if(state.time>=1440){state.time-=1440;state.day++;newDay=true;state.weather=['Clear','Rain','Fog','Storm','Heatwave'][Math.floor(rand(0,5))];notify('DAY '+state.day+' — You survived another night.');save();achievement('Week One',state.day>=8);if(state.day>=30&&!state.rescue){state.rescue=true;showRescue()}}let night=state.time<360||state.time>=1200;if(Math.floor(state.time)===1170&&Math.floor(state.time-dt*2)!==1170)notify('Nightfall approaches. Find shelter!','bad');let mx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),my=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0),m=Math.hypot(mx,my)||1,sprint=keys.Shift&&state.stamina>10&&!(keys.c||keys.Control),crouch=keys.c||keys.Control,speed=(sprint?176:crouch?62:108)*(state.fatigue>80?.7:1)*(inventoryWeight()>capacity()*.9?.85:1);let vx=mx/m*speed*dt,vy=my/m*speed*dt;if(vx||vy){if(!collision(state.x+vx,state.y,10))state.x+=vx;if(!collision(state.x,state.y+vy,10))state.y+=vy;if(sprint)state.stamina=Math.max(0,state.stamina-14*dt);if(sprint&&Math.random()<dt*2)noise={x:state.x,y:state.y,t:.6,r:115}}else state.stamina=Math.min(100,state.stamina+15*dt);if(!sprint)state.stamina=Math.min(100,state.stamina+11*dt);state.hunger=Math.max(0,state.hunger-dt*(sprint?.095:.047));state.thirst=Math.max(0,state.thirst-dt*(sprint?.15:.075));state.fatigue=Math.min(100,state.fatigue+dt*.03);if(state.hunger===0||state.thirst===0)state.hp-=dt*1.5;if(state.bleed>0)state.hp-=dt*.4;if(state.infection>0)state.hp-=dt*.15;if(state.hp<=0){die();return}if(noise){noise.t-=dt;if(noise.t<=0)noise=null}let playerCellX=Math.floor(state.x/32),playerCellY=Math.floor(state.y/32);let chaseRange=night?265:190;if(crouch)chaseRange*=.55;for(let z of zombies){if(z.hp<=0)continue;z.attack-=dt;z.phase+=dt*5;let d=dist(z.x,z.y,state.x,state.y),heard=noise&&dist(z.x,z.y,noise.x function drawMenuBackdrop(){for(let i=0;i<65;i++){let x=(i*131)%W,y=(i*89)%H;ctx.fillStyle=i%3?'#193029':'#2c3d34';ctx.fillRect(x,y,32,32)}ctx.fillStyle='#0611159a';ctx.fillRect(0,0,W,H)}function drawPerson(x,y,color,phase,angle=0,player=false){let walk=Math.sin(phase)*3;ctx.fillStyle='#15241f';ctx.beginPath();ctx.ellipse(x,y+10,12,5,0,0,7);ctx.fill();ctx.fillStyle=player?'#2e393d':'#343b39';ctx.fillRect(x-7,y+2,5,10+walk);ctx.fillRect(x+2,y+2,5,10-walk);ctx.fillStyle=color;ctx.fillRect(x-8,y-9,16,15);ctx.fillStyle=player?'#e0b28d':'#bc9c82';ctx.fillRect(x-5,y-15,10,9);ctx.fillStyle='#26302c';ctx.fillRect(x-5,y-16,10,3);ctx.strokeStyle=player?'#e7b96f':'#a9b8a5';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(angle)*15,y+Math.sin(angle)*15);ctx.stroke()}function drawZombie(z){let [name,color]=TYPES[z.type],x=z.x,y=z.y,scale=z.type===2?1.55:z.type===7?2.1:z.type===4?.65:1;ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);let sway=Math.sin(z.phase)*2;ctx.fillStyle='#162a25';ctx.beginPath();ctx.ellipse(0,10,11,5,0,0,7);ctx.fill();ctx.fillStyle='#343e39';ctx.fillRect(-7,2,5,10+sway);ctx.fillRect(2,2,5,10-sway);ctx.fillStyle=color;ctx.fillRect(-8,-9,16,15);ctx.fillStyle='#b4ad95';ctx.fillRect(-5,-15,10,8);ctx.fillStyle='#df6c6b';ctx.fillRect(-4,-12,2,2);ctx.fillRect(2,-12,2,2);if(z.type===3){ctx.fillStyle='#cfb5b0';ctx.fillRect(-6,-7,12,4)}if(z.type===6){ctx.fillStyle='#354e54';ctx.fillRect(-9,-9,18,8)}ctx.restore();if(z.hp<z.max){ctx.fillStyle='#4e2228';ctx.fillRect(x-12,y-25*scale,24,3);ctx.fillStyle='#c57972';ctx.fillRect(x-12,y-25*scale,24*clamp(z.hp/z.max,0,1),3)}}
function drawMini(){let size=140,x=W-size-16,y=115;ctx.fillStyle='#071216d9';ctx.fillRect(x-5,y-5,size+10,size+10);ctx.strokeStyle='#59736d';ctx.strokeRect(x-5,y-5,size+10,size+10);let step=size/80;for(let yy=0;yy<80;yy+=2)for(let xx=0;xx<80;xx+=2){let t=tile(xx,yy);ctx.fillStyle=t===1?'#6d7b7d':t===3?'#a5a68d':t===5?'#3f7754':'#2e5944';ctx.fillRect(x+xx*step,y+yy*step,step*2,step*2)}ctx.fillStyle='#ffdf8b';ctx.beginPath();ctx.arc(x+state.x/32*step,y+state.y/32*step,3,0,7);ctx.fill();ctx.fillStyle='#e2ece5';ctx.font='10px sans-serif';ctx.fillText('TOWN MAP · M',x+4,y+size+17)}function drawCrosshair(){if(paused)return;ctx.strokeStyle='#d9e8c9';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(mouse.x-8,mouse.y);ctx.lineTo(mouse.x-3,mouse.y);ctx.moveTo(mouse.x+3,mouse.y);ctx.lineTo(mouse.x+8,mouse.y);ctx.moveTo(mouse.x,mouse.y-8);ctx.lineTo(mouse.x,mouse.y-3);ctx.moveTo(mouse.x,mouse.y+3);ctx.lineTo(mouse.x,mouse.y+8);ctx.stroke()}
function updateHud(){if(!state)return;let arr=[['HEALTH',state.hp],['HUNGER',state.hunger],['THIRST',state.thirst],['STAMINA',state.stamina],['FATIGUE',100-state.fatigue]];document.getElementById('stats').innerHTML=arr.map(([name,n])=>`<div class="stat"><b>${name}</b><div class="track"><div class="fill" style="width:${clamp(n,0,100)}%"></div></div><span>${Math.round(n)}</span></div>`).join('')+(state.infection?'<span class="badge">⚠ INFECTION</span>':'')+(state.bleed?'<span class="badge">⚠ BLEEDING</span>':'');let h=Math.floor(state.time/60),m=Math.floor(state.time%60);document.getElementById('clock').textContent=`DAY ${state.day} · ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;document.getElementById('weather').textContent=state.weather.toUpperCase();document.getElementById('loc').textContent=`${state.name.toUpperCase()} · ${Math.round(inventoryWeight())}/${capacity()} KG`;document.getElementById('kills').textContent=state.kills+' infected eliminated';let hot=['bat','axe','crowbar','knife','pistol','bandage','food','water','medkit'];document.getElementById('hotbar').innerHTML=hot.map((id,i)=>`<div class="slot ${state.weapon===id?'active':''}">${i+1}<br>${ITEM[id].icon} ${(state.inventory[id]||0)||'—'}</div>`).join('')}
function showModal(html){modal.classList.add('show');content.innerHTML=html;paused=true}function closeModal(){modal.classList.remove('show');view='game'}function showMenu(){view='menu';paused=true;showModal(`<div class="tag">PROCEDURAL SURVIVAL · SINGLE-FILE EDITION</div><h1>OUTBREAK</h1><p>LAST LIGHT // The city is silent. It won't stay that way.</p><div class="grid"><div class="card"><strong>80 × 80</strong><p>Procedural town, interiors, loot and roaming infected.</p></div><div class="card"><strong>DAY 30</strong><p>Reach extraction or keep surviving indefinitely.</p></div><div class="card"><strong>${meta.record||0} DAYS</strong><p>Your personal survival record.</p></div></div><div class="row"><label>World seed <input id="seed" value="${Math.floor(rand(100000,999999))}" maxlength="24"></label><button onclick="document.getElementById('seed').value=Math.floor(Math.random()*99999999)">Random seed</button></div><div class="row"><label>Character <input id="name" value="Survivor" maxlength="20"></label><label>Background <select id="background"><option>Scavenger</option><option>Medic</option><option>Mechanic</option><option>Runner</option></select></label><label>Trait <select id="trait"><option>Steady</option><option>Fast Learner</option><option>Heavy Eater</option><option>Light Sleeper</option></select></label></div><div class="menuButtons"><button class="accent" onclick="startFromMenu()">NEW GAME</button><button onclick="load()">CONTINUE</button><button onclick="showHelp()">HOW TO PLAY</button><button onclick="showMeta()">SURVIVOR UPGRADES</button></div><p class="small">Auto-saves every minute. Your world seed recreates the same town layout. All graphics are generated by canvas.</p>`)}function startFromMenu(){newGame(document.getElementById('seed').value||'123',document.getElementById('name').value,document.getElementById('background').value,document.getElementById('trait').value)}function showHelp(){showModal(`<header><h2>FIELD GUIDE</h2><button onclick="${state?'show function updatePanels(){if(!modal.classList.contains('show'))return;if(view==='inventory')showInventory();else if(view==='craft')showCraft();else if(view==='build')showBuild();else if(view==='base')showBase()}
function showInventory(){view='inventory';let items=Object.entries(state.inventory).filter(([id,n])=>n>0);showModal(`<header><h2>BACKPACK <span class="small">${inventoryWeight().toFixed(1)} / ${capacity()} kg</span></h2><button onclick="closeModal();paused=false">Close · I</button></header><p>Click a consumable to use it, or equip a weapon. Your inventory persists between sessions.</p><div class="grid">${items.map(([id,n])=>`<div class="card"><strong>${ITEM[id].icon} ${ITEM[id].name} ×${n}</strong><p>${ITEM[id].weight} kg each ${state.weapon===id?'· EQUIPPED':''}</p>${ITEM[id].kind==='use'?`<button onclick="useItem('${id}')">Use</button>`:ITEM[id].weapon?`<button onclick="state.weapon='${id}';showInventory()">Equip</button>`:''} <button onclick="dropItem('${id}')">Drop 1</button></div>`).join('')}</div>`)}function dropItem(id){consume(id);notify('Dropped '+ITEM[id].name);showInventory()}
function showCraft(){view='craft';showModal(`<header><h2>CRAFTING</h2><button onclick="closeModal();paused=false">Close · K</button></header><p>Gather resources by searching containers. Recipes turn scavenged materials into survival equipment.</p><div class="grid">${RECIPES.map(([id,cost,n])=>`<div class="card"><strong>${ITEM[id].icon} ${ITEM[id].name} ×${n}</strong><p>${Object.entries(cost).map(([i,v])=>`${ITEM[i].name} ${v}/${state.inventory[i]||0}`).join(' · ')}</p><button ${canAfford(cost)?'':'disabled'} onclick="craft('${id}')">Craft</button></div>`).join('')}</div>`)}function showBuild(){view='build';showModal(`<header><h2>BUILD & FORTIFY</h2><button onclick="closeModal();paused=false">Close · B</button></header><p>Choose a structure, then click an empty tile near your character to place it. Press B to cancel placement.</p><div class="grid">${BUILD.map(([id,name,cost,hp])=>`<div class="card"><strong>${name}</strong><p>${Object.entries(cost).map(([i,v])=>`${ITEM[i].name} ${v}/${state.inventory[i]||0}`).join(' · ')}</p><button ${canAfford(cost)?'':'disabled'} onclick="buildMode='${id}';closeModal();paused=false;notify('Click nearby ground to place ${name}.')">Place</button></div>`).join('')}</div>`)}function showBase(){view='base';showModal(`<header><h2>YOUR SURVIVORS</h2><button onclick="closeModal();paused=false">Close · V</button></header><p>Recruit people you meet by pressing E nearby. Guards help defend you.</p><div class="grid">${survivors.filter(s=>s.recruited).map((s,i)=>`<div class="card"><strong>${esc(s.name)}</strong><p>${s.role} · ${Math.round(s.hp)} health</p><button onclick="survivors.filter(x=>x.recruited)[${i}].role='Guard';showBase()">Guard</button> <button onclick="survivors.filter(x=>x.recruited)[${i}].role='Follower';showBase()">Follow</button></div>`).join('')||'<p>No survivors recruited yet. Explore town to find people.</p>'}</div>`)}function showMap(){view='map';let map=document.createElement('canvas');map.width=480;map.height=480;let g=map.getContext('2d');for(let y=0;y<80;y++)for(let x=0;x<80;x++){let t=tile(x,y);g.fillStyle=t===1?'#667579':t===3?'#c3b998':t===5?'#244c34':t===7?'#6e776a':'#36654a';g.fillRect(x*6,y*6,6,6)}g.fillStyle='#f9d883';g.beginPath();g.arc(state.x/32*6,state.y/32*6,5,0,7);g.fill();showModal(`<header><h2>TOWN MAP · ${esc(state.seed)}</h2><button onclick="closeModal();paused=false">Close · M</button></header><p>Roads are gray, buildings are tan, forests are dark green. Yellow dot is your position.</p><img alt="Procedurally generated town map" style="display:block;max-width:100%;image-rendering:pixelated;border:1px solid #526b63" src="${map.toDataURL()}">`)}
function sound(freq=220,duration=.08){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let osc=audio.createOscillator(),gain=audio.createGain();osc.type='triangle';osc.frequency.setValueAtTime(freq,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(Math.max(50,freq*.55),audio.currentTime+duration);gain.gain.setValueAtTime(.045,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch{}}
function toggle(key){if(!state)return;if(modal.classList.contains('show')){if(key==='Escape'||key==='i'||key==='k'||key==='b'||key==='m'||key==='v'){closeModal();paused=false}return}if(key==='Escape')showPause();else if(key==='i')showInventory();else if(key==='k')showCraft();else if(key==='b'){if(buildMode){buildMode=null;notify('Build placement canceled.')}else showBuild()}else if(key==='v')showBase();else if(key==='m')showMap();else if(key==='e')interact();else if(key==='f'){state.flashlight=!state.flashlight;notify('Flashlight '+(state.flashlight?'on':'off'))}else if('123456789'.includes(key)){let id=['bat','axe','crowbar','knife','pistol','bandage','food','water','medkit'][Number(key)-1];if(ITEM[id].kind==='use')useItem(id);else if(state.inventory[id]){state.weapon=id;notify('Equipped '+ITEM[id].name)}}}
addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;keys[e.key]=true;keys[e.key.toLowerCase()]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.key))e.preventDefault();if(e.repeat)return;toggle(e.key.length===1?e.key.toLowerCase():e.key)});addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});addEventListener('blur',()=>{keys={};if(state&&!paused)showPause()});canvas.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});canvas.addEventListener('mousedown',e=>{if(e.button!==0||paused)return;mouse.x=e.clientX;mouse.y=e.clientY;if(buildMode){let p=screenToWorld(mouse.x,mouse.y);buildAt(p.x,p.y)}else attack()});canvas.addEventListener('wheel',e=>{if(!state)return;e.preventDefault();camera.zoom=clamp(camera.zoom+(e.deltaY<0?.1:-.1),.65,2.2)},{passive:false});canvas.addEventListener('contextmenu',e=>e.preventDefault());function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;accum+=dt;while(accum>=1/60){update(1/60);accum-=1/60}draw();requestAnimationFrame(loop)}showMenu();requestAnimationFrame(loop);
</script></body></html>
