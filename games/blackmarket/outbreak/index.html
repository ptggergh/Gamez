// V3 OUTSKIRTS REPAIR: connected highways, accessible woodland, and denser regional landmarks.
function repairOuterWorld(seed){
 const n=CONFIG.world,p=WORLD_PAD,r=rng(hash(seed+':district-repair-v3'));
 const inOld=(x,y)=>x>=p&&x<p+256&&y>=p&&y<p+256;

 // At the seam, connect to the original road grid at tile 224 (old tile 128).

  {side:'north',axis:224,start:2,end:p+3},
  {side:'south',axis:224,start:p+252,end:n-4},
  {side:'west',axis:224,start:2,end:p+3},
  {side:'east',axis:224,start:p+252,end:n-4}

  const x=c.side==='north'||c.side==='south'?c.axis+d:v;

 }

 for(let y=10;y<n-10;y++)for(let x=10;x<n-10;x++){
  if(inOld(x,y))continue;

  if(z==='forest'){

   if(road)setTile(x,y,11);

 }

 // Leave existing buildings and the original neighborhood untouched.
 for(let by=16;by<83;by+=12)for(let bx=116;bx<332;bx+=13){
  if(r()<.17)continue;
  const w=7+Math.floor(r()*3),h=7+Math.floor(r()*2),doorX=bx+(w>>1),doorY=by+h-1;

osen':''}" title="${desc}" onclick="pickChoice(this,'trait')"><span class="choiceIcon">${icon}</span><b>${id}</b><small>${desc}</small></button>`).join('')}</div><input type="hidden" id="trait" value="Steady"><div class="menuButtons"><button class="accent big" onclick="startFromMenu()">▶ BEGIN SURVIVAL</button><button onclick="load()">↪ CONTINUE</button><button onclick="showHelp()">? FIELD GUIDE</button><button onclick="showMeta()">★ LEGACY</button></div><p class="small">Mouse aim + left click attack · WASD move · E open doors/search · 1–9 equip/use · I inventory. Progress saves automatically.</p>`)}
function pickChoice(el,type){let grid=el.parentElement;grid.querySelectorAll('.choice').forEach(x=>x.classList.remove('chosen'));el.classList.add('chosen');document.getElementById(type).value=el.querySelector('b').textContent}
function startFromMenu(){newGame(document.getElementById('seed').value||'123',document.getElementById('name').value,document.getElementById('background').value,document.getElementById('trait').value)}function showHelp(){showModal(`<header><h2>FIELD GUIDE</h2><button onclick="${state?'showPause()':'showMenu()'}">Back</button></header><p><b>IMPORTANT: Press E at a building door to enter its multi-floor interior. Walking through a doorway only enters the ground-level outdoor building.</b> Inside, press E near UP / DOWN stairs to switch floors. Search furniture inside buildings for supplies. Prepare a shelter before night. Recruit survivors, craft equipment and build defenses. Reach Day 30 for rescue.</p><div class="keys">${[['WASD','Move'],['Shift','Sprint'],['C','Crouch'],['Mouse','Aim'],['Left Click','Attack / place structure'],['E','Search / interact / door'],['I','Inventory'],['K','Crafting'],['B','Build menu'],['V','Survivors'],['M','Full map'],['F','Flashlight'],['R','Reload (ammo is consumed per shot)'],['1–9','Equip / quick use'],['Mouse wheel','Camera zoom'],['Esc','Pause / close menu']].map(([k,v])=>`<div><b>${k}</b> — ${v}</div>`).join('')}</div><p class="small">Tip: Walk up to brown furniture and press E. Green bars show survival needs; fatigue fills over time. The game pauses while menus are open.</p>`)}function showMeta(){showModal(`<header><h2>SURVIVOR LEGACY</h2><button onclick="showMenu()">Back</button></header><p>You have <b>${meta.points}</b> survivor points. Upgrades carry into new runs.</p><div class="card"><strong>Prepared Survivor · 15 points</strong><p>Start each run with a medkit and a backpack. ${meta.bonus?'UNLOCKED':''}</p><button ${meta.points<15||meta.bonus?'disabled':''} onclick="meta.points-=15;meta.bonus=1;saveMeta();showMeta()">Unlock</button></div>`)}function showCodes(){if(!state)return;view='codes';showModal(`<header><h2>ACCESS CODES</h2><button onclick="showPause()">Back</button></header><p class="small">Developer tools are intended for testing. Changes can affect your save.</p><label class="field">CODE<input id="devcode" type="password" inputmode="numeric" placeholder="Enter code" autocomplete="off" onkeydown="if(event.key==='Enter')unlockAdmin()"></label><div class="menuButtons"><button class="accent" onclick="unlockAdmin()">UNLOCK</button></div><p id="codeError" class="small"></p>`)}
let adminUnlocked=false;
function unlockAdmin(){if(document.getElementById('devcode')?.value==='99901'){adminUnlocked=true;showAdmin()}else document.getElementById('codeError').textContent='Invalid code.'}
function adminDo(action,value){if(!adminUnlocked||!state)return;let n=Number(value),safe=Number.isFinite(n)?n:0;switch(action){case'cash':break;case'heal':state.hp=100;state.hunger=100;state.thirst=100;state.stamina=100;state.fatigue=0;state.infection=0;state.bleed=0;break;case'day':state.day=clamp(Math.round(safe),1,999);break;case'time':state.time=clamp(Math.round(safe),0,1439);break;case'kills':state.kills=clamp(Math.round(safe),0,999999);break;case'points':meta.points=clamp(Math.round(safe),0,999999);saveMeta();break;case'give':{let id=document.getElementById('adminItem').value;state.inventory[id]=(state.inventory[id]||0)+clamp(Math.round(safe),1,999);break}case'weapon':{let id=document.getElementById('adminWeapon').value;state.inventory[id]=Math.max(1,state.inventory[id]||0);state.weapon=id;break}case'horde':{let a=rand(0,6.28),d=350;spawnHorde(state.x+Math.cos(a)*d,state.y+Math.sin(a)*d,clamp(Math.round(safe),1,80),state.day);break}case'clear':zombies=zombies.filter(z=>dist(z.x,z.y,state.x,state.y)>1100);break;case'clearall':zombies=[];break;case'checkpoint':{let cp=checkpoints[0];if(cp){let pos=findSafeNear(cp.x,cp.y,230);state.x=pos.x;state.y=pos.y}break}case'center':{let mid=CONFIG.world*16;let pos=findSafeNear(mid,mid,130);state.x=pos.x;state.y=pos.y;break}case'spawnwreck':wrecks.push({x:state.x+65,y:state.y+65,used:false,angle:0,kind:'Wrecked Car'});break;case'god':state.godMode=!state.godMode;break;case'speed':state.devSpeed=state.devSpeed===2?1:2;break;case'fog':state.weather='Fog';break;case'clearweather':state.weather='Clear';break;case'save':save();break;case'backup':{let raw=localStorage.getItem(CONFIG.saveKey);if(raw){let blob=new Blob([raw],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='outbreak-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}break}case'achievements':state.achievements=[...new Set([...state.achievements,'First Kill','First Scavenge','Week One','Not Alone','Maker','Tyrant Down'])];break;case'build':{let id=document.getElementById('adminBuild').value;let p=findSafeNear(state.x+65,state.y+50,80);structures.push({x:p.x,y:p.y,type:id,hp:300,solid:id==='wall'||id==='barricade'});break}case'recruit':survivors.push({x:state.x+38,y:state.y+38,name:'Test Survivor',role:'Guard',recruited:true,hp:100,phase:0});break;case'killplayer':state.hp=0;break;}notify('DEV: '+action);if(action==='killplayer'){closeModal();paused=false;die();return}showAdmin()}
function findSafeNear(x,y,r=180){for(let i=0;i<220;i++){let a=i*2.399,d=i===0?0:Math.sqrt(i/220)*r,px=clamp(x+Math.cos(a)*d,42,CONFIG.world*32-42),py=clamp(y+Math.sin(a)*d,42,CONFIG.world*32-42);if(validSpawn(px,py))return{x:px,y:py}}return{x:state.x,y:state.y}}
function showAdmin(){if(!adminUnlocked)return showCodes();view='admin';let itemOptions=Object.keys(ITEM).map(id=>`<option value="${esc(id)}">${esc(ITEM[id].name)}</option>`).join('');let buildOptions=BUILD.map(b=>`<option value="${esc(b[0])}">${esc(b[1])}</option>`).join('');showModal(`<header><h2>◈ DEVELOPER CONSOLE <span class="small">OUTBREAK / TEST BUILD</span></h2><button onclick="showPause()">Close</button></header><p class="small">Unlocked for this session. Tools may change difficulty, progression, and saves.</p><div class="adminGrid"><section class="card"><h3>CHARACTER</h3><button onclick="adminDo('heal')">Restore all needs & health</button><button onclick="adminDo('god')">Invulnerability: ${state.godMode?'ON':'OFF'}</button><button onclick="adminDo('speed')">Movement ×${state.devSpeed||1}</button><button onclick="adminDo('killplayer')">Test death screen</button></section><section class="card"><h3>PROGRESSION</h3><label>Day <input id="aDay" type="number" value="${state.day}"></label><button onclick="adminDo('day',document.getElementById('aDay').value)">Set day</button><label>Time (0–1439) <input id="aTime" type="number" value="${Math.floor(state.time)}"></label><button onclick="adminDo('time',document.getElementById('aTime').value)">Set time</button><label>Kills <input id="aKills" type="number" value="${state.kills}"></label><button onclick="adminDo('kills',document.getElementById('aKills').value)">Set kills</button><label>Legacy points <input id="aPoints" type="number" value="${meta.points}"></label><button onclick="adminDo('points',document.getElementById('aPoints').value)">Set points</button><button onclick="adminDo('achievements')">Unlock core achievements</button></section><section class="card"><h3>INVENTORY / BASE</h3><select id="adminItem">${itemOptions}</select><input id="aCount" type="number" min="1" max="999" value="20"><button onclick="adminDo('give',document.getElementById('aCount').value)">Give items</button><select id="adminWeapon">${itemOptions}</select><button onclick="adminDo('weapon')">Equip selected item</button><select id="adminBuild">${buildOptions}</select><button onclick="adminDo('build')">Place structure nearby</button><button onclick="adminDo('recruit')">Recruit test survivor</button></section><section class="card"><h3>WORLD / AI</h3><input id="aHorde" type="number" min="1" max="80" value="20"><button onclick="adminDo('horde',document.getElementById('aHorde').value)">Spawn test horde</button><button onclick="adminDo('clear')">Clear nearby zombies</button><button onclick="adminDo('clearall')">Clear all zombies</button><button onclick="adminDo('checkpoint')">Teleport to checkpoint</button><button onclick="adminDo('center')">Teleport to center</button><button onclick="adminDo('spawnwreck')">Spawn lootable wreck</button><button onclick="adminDo('fog')">Set fog</button><button onclick="adminDo('clearweather')">Clear weather</button></section><section class="card"><h3>SAVE / DEBUG</h3><div class="small">World: ${CONFIG.world}² · Zombies: ${zombies.length} · Wrecks: ${wrecks.length} · Checkpoints: ${checkpoints.length}<br>Position: ${Math.round(state.x)}, ${Math.round(state.y)} · HP: ${Math.round(state.hp)}</div><button onclick="adminDo('save')">Force save</button><button onclick="adminDo('backup')">Export save JSON</button></section></div><div class="menuButtons"><button class="accent" onclick="closeModal();paused=false">Resume game</button><button onclick="showPause()">Pause menu</button></div>`)}
function showPause(){if(!state)return showMenu();showModal(`<div class="tag">PAUSED · DAY ${state.day}</div><h1>OUTBREAK</h1><p>${esc(state.name)} · ${state.kills} kills · ${state.looted} containers searched</p><div class="menuButtons"><button class="accent" onclick="closeModal();paused=false">RESUME</button><button onclick="save();notify('Game saved.');closeModal();paused=false">SAVE GAME</button><button onclick="showHelp()">HOW TO PLAY</button><button onclick="showMenu()">MAIN MENU</button><button class="codeButton" onclick="showCodes()">codes</button></div>`)}
function updatePanels(){if(!modal.classList.contains('show'))return;if(view==='inventory')showInventory();else if(view==='craft')showCraft();else if(view==='build')showBuild();else if(view==='base')showBase()}
let bagFilter='all';
function bagCategory(id){let d=ITEM[id];if(d.weapon)return 'weapons';if(d.kind==='use')return 'supplies';if(['armor','backpack'].includes(id))return 'gear';return 'materials'}
function bagDescription(id){let d=ITEM[id];if(d.weapon)return `${d.ranged?'Ranged weapon':'Melee weapon'} • ${d.damage} damage • ${d.ranged?'Uses pistol ammo':Math.round(d.reach)+' range'}`;if(d.kind==='use')return `Restores ${d.power||1} ${d.effect==='health'?'health':d.effect==='hunger'?'hunger':d.effect==='thirst'?'thirst':'infection status'}`;if(id==='backpack')return 'Adds 18 kg of carrying capacity while owned.';if(id==='armor')return 'Protective vest: reduces incoming damage while carried.';return 'Crafting and survival material.'}
function setBagFilter(f){bagFilter=f;showInventory()}
function showInventory(){view='inventory';let items=Object.entries(state.inventory).filter(([id,n])=>n>0&&ITEM[id]&&(bagFilter==='all'||bagCategory(id)===bagFilter));let weight=inventoryWeight(),cap=capacity(),pct=Math.min(100,weight/cap*100);showModal(`<div class="bagScreen"><div class="bagHeading"><div><div class="bagSub">SURVIVOR EQUIPMENT / STORAGE</div><h2>🎒 YOUR BACKPACK</h2></div><button onclick="closeModal();paused=false">✕ CLOSE · I</button></div><div class="bagShell"><div class="bagHandle"></div><div class="bagPatch"><span>OUTBREAK // FIELD PACK</span><span>${weight.toFixed(1)} / ${cap} KG</span></div><div class="bagCapacity" title="Carrying capacity: ${weight.toFixed(1)} of ${cap} kilograms"><div class="bagCapacityFill ${pct>90?'over':''}" style="width:${pct}%"></div></div><div class="bagPocket"><div class="bagFilters">${[['all','ALL ITEMS'],['weapons','WEAPONS'],['supplies','SUPPLIES'],['gear','EQUIPMENT'],['materials','MATERIALS']].map(([id,name])=>`<button class="bagFilter ${bagFilter===id?'active':''}" onclick="setBagFilter('${id}')">${name}</button>`).join('')}</div><div class="bagGrid">${items.map(([id,n])=>`<div class="bagItem ${state.weapon===id?'equipped':''}" title="${esc(bagDescription(id))}"><div class="bagIcon">${ITEM[id].icon}</div><div class="bagItemName">${esc(ITEM[id].name)}</div><div class="bagQty">×${n} · ${(ITEM[id].weight*n).toFixed(1)} kg${state.weapon===id?' · EQUIPPED':''}</div><div class="bagItemActions">${ITEM[id].kind==='use'?`<button onclick="useItem('${id}')">USE</button>`:ITEM[id].weapon?`<button onclick="state.weapon='${id}';showInventory()">EQUIP</button>`:''}<button onclick="dropItem('${id}')">DROP 1</button></div></div>`).join('')||'<div class="bagEmpty">No items in this pocket.</div>'}</div></div><div class="bagFooter"><span>🧵 REINFORCED CANVAS · FIELD SURVIVAL KIT</span><span><kbd>I</kbd> Open / close · Hover items for details</span></div></div><p class="bagHelp">Select a category to sort your gear. Hover over an item to see its effects; use, equip, or drop it using the buttons.</p></div>`)}function dropItem(id){consume(id);notify('Dropped '+ITEM[id].name);showInventory()}
function showCraft(){view='craft';showModal(`<header><h2>CRAFTING</h2><button onclick="closeModal();paused=false">Close · K</button></header><p>Gather resources by searching containers. Recipes turn scavenged materials into survival equipment.</p><div class="grid">${RECIPES.map(([id,cost,n])=>`<div class="card"><strong>${ITEM[id].icon} ${ITEM[id].name} ×${n}</strong><p>${Object.entries(cost).map(([i,v])=>`${ITEM[i].name} ${v}/${state.inventory[i]||0}`).join(' · ')}</p><button ${canAfford(cost)?'':'disabled'} onclick="craft('${id}')">Craft</button></div>`).join('')}</div>`)}function showBuild(){view='build';showModal(`<header><h2>BUILD & FORTIFY</h2><button onclick="closeModal();paused=false">Close · B</button></header><p>Choose a structure, then click an empty tile near your character to place it. Press B to cancel placement.</p><div class="grid">${BUILD.map(([id,name,cost,hp])=>`<div class="card"><strong>${name}</strong><p>${Object.entries(cost).map(([i,v])=>`${ITEM[i].name} ${v}/${state.inventory[i]||0}`).join(' · ')}</p><button ${canAfford(cost)?'':'disabled'} onclick="buildMode='${id}';closeModal();paused=false;notify('Click nearby ground to place ${name}.')">Place</button></div>`).join('')}</div>`)}function showBase(){view='base';showModal(`<header><h2>YOUR SURVIVORS</h2><button onclick="closeModal();paused=false">Close · V</button></header><p>Recruit people you meet by pressing E nearby. Guards help defend you.</p><div class="grid">${survivors.filter(s=>s.recruited).map((s,i)=>`<div class="card"><strong>${esc(s.name)}</strong><p>${s.role} · ${Math.round(s.hp)} health</p><button onclick="survivors.filter(x=>x.recruited)[${i}].role='Guard';showBase()">Guard</button> <button onclick="survivors.filter(x=>x.recruited)[${i}].role='Follower';showBase()">Follow</button></div>`).join('')||'<p>No survivors recruited yet. Explore town to find people.</p>'}</div>`)}function showMap(){view='map';showModal('<header><h2>WORLD MAP // DISTRICTS</h2><button onclick="closeModal();paused=false">CLOSE</button></header><p>North: DOWNTOWN · East: INDUSTRIAL · West: FARMLAND · South: FOREST · Center: NEIGHBORHOODS · Gold: you</p><canvas id="fullMap" width="640" height="640" style="width:min(100%,640px);aspect-ratio:1;border:1px solid #50685c;border-radius:10px;image-rendering:pixelated"></canvas>');let c=document.getElementById('fullMap'),cx=c.getContext('2d'),n=CONFIG.world,scale=c.width/n;for(let y=0;y<n;y++)for(let x=0;x<n;x++){let t=tile(x,y);cx.fillStyle=t===1?'#8c9995':t===3?'#c3b6a1':t===5?'#234f37':t===7?'#8d8374':t===11?'#939c5d':'#375b47';cx.fillRect(x*scale,y*scale,scale+1,scale+1)}cx.fillStyle='#ffe09b';cx.beginPath();cx.arc(state.x/32*scale,state.y/32*scale,6,0,7);cx.fill();cx.font='bold 13px system-ui';cx.textAlign='center';cx.lineWidth=3;cx.strokeStyle='#07110fcc';for(const [label,x,y] of [['DOWNTOWN',224,47],['FARMLAND',45,224],['INDUSTRIAL',400,224],['FOREST',224,408],['NEIGHBORHOODS',224,224]]){cx.strokeText(label,x*scale,y*scale);cx.fillStyle='#f4e8c7';cx.fillText(label,x*scale,y*scale)}cx.textAlign='start'}
function sound(freq=220,duration=.08){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let osc=audio.createOscillator(),gain=audio.createGain();osc.type='triangle';osc.frequency.setValueAtTime(freq,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(Math.max(50,freq*.55),audio.currentTime+duration);gain.gain.setValueAtTime(.045,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch{}}
function toggle(key){if(!state)return;if(modal.classList.contains('show')){if(key==='Escape'||key==='i'||key==='k'||key==='b'||key==='m'||key==='v'){closeModal();paused=false}return}if(key==='Escape')showPause();else if(key==='i')showInventory();else if(key==='k')showCraft();else if(key==='b'){if(buildMode){buildMode=null;notify('Build placement canceled.')}else showBuild()}else if(key==='v')showBase();else if(key==='m')showMap();else if(key==='e')interact();else if(key==='f'){state.flashlight=!state.flashlight;notify('Flashlight '+(state.flashlight?'on':'off'))}else if('123456789'.includes(key))hotbarSelect(Number(key)-1)}
addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;keys[e.key]=true;keys[e.key.toLowerCase()]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.key))e.preventDefault();if(e.repeat)return;toggle(e.key.length===1?e.key.toLowerCase():e.key)});addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});addEventListener('blur',()=>{keys={};if(state&&!paused)showPause()});canvas.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});canvas.addEventListener('mousedown',e=>{if(e.button!==0||paused)return;mouse.x=e.clientX;mouse.y=e.clientY;if(buildMode){let p=screenToWorld(mouse.x,mouse.y);buildAt(p.x,p.y)}else if(interior)attackInterior();else attack()});canvas.addEventListener('wheel',e=>{if(!state)return;e.preventDefault();camera.zoom=clamp(camera.zoom+(e.deltaY<0?.1:-.1),.65,2.2)},{passive:false});canvas.addEventListener('contextmenu',e=>e.preventDefault());function updateLootTutorial(){
 const el=document.getElementById('lootTutorial');if(!el)return;
 if(!state||paused||view!=='game'||(state.lootTutorialOpens||0)>=5){el.style.display='none';return}
 let nearby=null;
 if(interior){const floor=state.interiors?.[interior.key]?.levels?.[interior.floor];if(floor){const item=floor.items.find(a=>!a.used&&Math.hypot(interior.x-a.x,interior.y-a.y)<3.2);if(item)nearby=item.kind||'Container'}}
 else {const target=nearest([...containers.filter(c=>!c.used),...wrecks.filter(w=>!w.used)],105);if(target)nearby=target.kind||'Container'}
 if(nearby){el.style.display='block';el.innerHTML='SEARCH '+esc(nearby)+' — Press <b>E</b><small>Interact with nearby containers · Tip '+Math.min(5,(state.lootTutorialOpens||0)+1)+' of 5</small>'}else el.style.display='none';
}
let lootTipClock=0;
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;accum+=dt;while(accum>=1/60){update(1/60);accum-=1/60}draw();if(now-lootTipClock>150){updateLootTutorial();lootTipClock=now}requestAnimationFrame(loop)}showMenu();requestAnimationFrame(loop);
</script></body></html>
