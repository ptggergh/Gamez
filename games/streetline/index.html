function dyno(){let c=car(),t=tuneOf(c),d=dynamics(c);const sliders=[['boost','BOOST / PSI',0,15,1,'Higher boost increases horsepower, but stresses worn engines.'],['final','FINAL DRIVE',2.6,5.3,.1,'Higher ratios accelerate faster; lower ratios raise top speed.'],['frontPressure','FRONT TIRE PRESSURE / PSI',22,44,1,'Too high or too low reduces cornering traction.'],['rearPressure','REAR TIRE PRESSURE / PSI',22,44,1,'Rear grip influences traction and stability.'],['camber','CAMBER / DEGREES',-5,2,.1,'Moderate negative camber helps grip. Extreme camber reduces it.'],['toe','TOE / DEGREES',-3,3,.1,'Excessive toe increases drag and instability.'],['brakeBias','FRONT BRAKE BIAS / %',45,75,1,'Brake distribution changes stopping performance.'],['stiffness','SUSPENSION STIFFNESS / %',0,100,1,'Stiffer suspension helps response, but too stiff reduces grip.'],['aero','AERO BALANCE / %',0,100,1,'More wing downforce increases grip but adds drag.'],['ecu','ECU RESPONSE / %',0,100,1,'Sharper ECU mapping improves engine response.'],['traction','TRACTION CONTROL / %',0,100,1,'More assistance reduces wheelspin when accelerating.']];return `<div class="layout"><section><div class="panel"><h2>DYNO · ESTIMATED ENGINE CURVES</h2><canvas id="chart" width="750" height="300"></canvas><div class="grid"><div class="card">ENGINE OUTPUT<br><strong class="value">${hp(c)} HP</strong></div><div class="card">PREDICTED TOP SPEED<br><strong class="value">${Math.round(d.top)} MPH</strong></div><div class="card">ACCELERATION INDEX<br><strong class="value">${d.accel.toFixed(2)}</strong></div><div class="card">CORNERING GRIP<br><strong class="value">${d.handling.toFixed(2)}×</strong></div><div class="card">BRAKE PERFORMANCE<br><strong class="value">${d.brake.toFixed(2)}×</strong></div><div class="card">WEIGHT<br><strong class="value">${fmt(weight(c))} LB</strong></div></div><button class="primary" onclick="runDyno()">RUN DYNO TEST</button><p class="muted">Estimated engine HP/torque vs RPM (not a measured function setTune(k,v){const c=car();c.tune=Object.assign({},tuneOf(c),{[k]:Number(v)});if(k==='frontPressure')c.tune.pressure=Number(v);state.skills.tuner++;save();render()}

function runDyno(){const c=car();if(c.tune.boost>10&&c.components.engine<60){c.components.engine=clamp(c.components.engine-5,0,100);toast('Warning: boost stressed your worn engine')}else toast('Dyno complete · '+hp(c)+' HP');save();drawDyno()}// Estimated engine curves use the same peak horsepower as the race model.
// Chassis settings do not change engine horsepower or torque on a stationary dyno.
function engineCurve(c,rpm){
 const t=tuneOf(c),m=model(c),eng=engineMetrics(c),redline=eng.redline,peak=hp(c),normalized=clamp(rpm/redline,0,1);
 // Smooth broad torque plateau with a realistic low-RPM drop and high-RPM falloff.
 const shape=(.46+.54*(1-Math.exp(-rpm/1350)))*
   (1-.34*Math.pow(Math.max(0,(rpm-4600)/2200),1.55));
 const response=1+(.5-t.ecu/100)*.025; // ECU response is primarily transient, not peak power.
 const spoolFactor=eng.forced===0?1:(.38+.62/(1+Math.exp(-(rpm-eng.spool)/580)));const raw=shape*response*spoolFactor;
 const peakRPM=Math.min(redline-550,6100);
 const peakRaw=(.46+.54*(1-Math.exp(-peakRPM/1350)))*(1-.34*Math.pow(Math.max(0,(peakRPM-4600)/2200),1.55))*response*(eng.forced===0?1:(.38+.62/(1+Math.exp(-(peakRPM-eng.spool)/580))));
 const power=peak*(rpm/peakRPM)*(raw/peakRaw);
 const torque=rpm>0?power*5252/rpm:0;
 return {rpm,hp:Math.max(0,power),torque:Math.max(0,torque)};
}
function drawDyno(){
 const can=$('chart');if(!can)return;
 const c=car(),ctx=can.getContext('2d'),w=can.width,h=can.height;
 const left=70,right=w-28,top=38,bottom=h-48;
 const data=Array.from({length:69},(_,i)=>engineCurve(c,800+i*100));
 const maxHp=Math.max(...data.map(d=>d.hp));
 const maxTorque=Math.max(...data.map(d=>d.torque));
 const axisMax=Math.ceil(Math.max(maxHp,maxTorque)*1.15/50)*50;
 const xp=rpm=>left+(rpm-800)/6800*(right-left);
 const yp=v=>bottom-v/axisMax*(bottom-top);
 ctx.fillStyle='#09121b';ctx.fillRect(0,0,w,h);
 ctx.font='12px system-ui';ctx.textBaseline='middle';
 for(let i=0;i<=5;i++){
   const val=axisMax*i/5,y=yp(val);
   ctx.strokeStyle='#263645';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();
   ctx.fillStyle='#a5b7c5';ctx.textAlign='right';ctx.fillText(Math.round(val),left-9,y);
 }
 for(let rpm=1000;rpm<=7000;rpm+=1000){
   const x=xp(rpm);ctx.strokeStyle='#1e303d';ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke();
   ctx.fillStyle='#a5b7c5';ctx.textAlign='center';ctx.fillText((rpm/1000)+'k',x,bottom+17);
 }
 for(const [key,color] of [['hp','#ff9b42'],['torque','#4bdcf0']]){
   ctx.beginPath();ctx.lineWidth=3;ctx.strokeStyle=color;
   data.forEach((d,i)=>{const x=xp(d.rpm),y=yp(d[key]);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();
 }
 const hpPeak=data.reduce((a,b)=>b.hp>a.hp?b:a),torquePeak=data.reduce((a,b)=>b.torque>a.torque?b:a);
 ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.font='bold 13px system-ui';
 ctx.fillStyle='#ff9b42';ctx.fillText('HP '+Math.round(hpPeak.hp)+' @ '+hpPeak.rpm+' RPM',left,20);
 ctx.fillStyle='#4bdcf0';ctx.fillText('Torque '+Math.round(torquePeak.torque)+' lb-ft @ '+torquePeak.rpm+' RPM',left+235,20);

 case 'import':{const f=$('adm-import')?.files?.[0];if(!f)throw Error('Choose a JSON file first');if(f.size>2000000)throw Error('Save file is too large');f.text().then(t=>{try{const obj=JSON.parse(t);if(!obj||obj.version!==1||!Array.isArray(obj.cars)||!obj.cars.length||!obj.cars.every(c=>c&&MODELS[c.model]))throw Error('Not a valid STREETLINE save');if(!confirm('Replace current save with imported file?'))return;const backup=JSON.stringify(state);state=obj;try{validateSave();save();render();toast('Save imported')}catch(e){state=JSON.parse(backup);throw e}}catch(e){alert('Import failed: '+e.message)}});return}
 case 'reset':if(!confirm('DELETE ALL STREETLINE PROGRESS? Export your save first.'))return;if(!confirm('Confirm reset: this cannot be undone without a backup.'))return;state=initial();refreshMarket();msg='All progress reset';break;
 case 'diagnose':{const errors=[];if(!state.cars.length)errors.push('No cars');if(!state.cars.some(c=>c.id===state.active))errors.push('Active car missing');if(state.cars.some(c=>!MODELS[c.model]))errors.push('Unknown car model');if(state.cars.some(c=>Object.values(c.components).some(v=>!Number.isFinite(v)||v<0||v>100)))errors.push('Invalid component condition');if(!Number.isFinite(state.cash)||!Number.isFinite(state.rep))errors.push('Invalid money/REP');adminLog(errors.length?'CHECK FAILED: '+errors.join('; '):'PASS: car IDs, active vehicle, condition, cash and REP');return}
 case 'stress':{const models=new Set();for(let i=0;i<1000;i++){const max=availableModelCount();const m=MODELS[Math.floor(rnd(0,max))];models.add(m.id)}adminLog('1000 marketplace selection samples OK · '+models.size+' distinct models · '+availableModelCount()+' eligible');return}
 case 'inspect':adminDownload(state,'streetline-debug-state.json');adminLog('State JSON downloaded');return;
 case 'log-clear':adminLogEntries.length=0;$('admin-log').textContent='Log cleared';return;
 default:throw Error('Unknown action: '+action)
 }
 adminSync(msg);
 }catch(e){adminLog('ERROR: '+e.message);toast('Admin: '+e.message);console.error(e)}}

// Recover from incomplete/old saves rather than leaving the page blank.
function validateSave(){
 if(!state||typeof state!=='object'||!Array.isArray(state.cars)||!state.cars.length){state=initial();return}
 const fresh=initial();
 for(const k of ['stats','skills','settings'])state[k]={...fresh[k],...(state[k]&&typeof state[k]==='object'?state[k]:{})};
 for(const k of ['ledger','achievements'])if(!Array.isArray(state[k]))state[k]=[];
 if(!Array.isArray(state.market))state.market=[];
 state.cash=Number.isFinite(state.cash)?Math.max(0,state.cash):2000;
 state.rep=Number.isFinite(state.rep)?Math.max(0,state.rep):0;
 state.day=Number.isFinite(state.day)?Math.max(1,state.day):1;
 state.garage=Number.isInteger(state.garage)?clamp(state.garage,0,3):0;
 state.cars=state.cars.filter(c=>c&&(MODELS[c.model]||c.adminPrototype===true&&c.model===-1)).map(c=>{
  c.parts=Array.isArray(c.parts)?c.parts.filter(id=>CONFIG.parts.some(p=>p.id===id)):[];
  c.tune={boost:0,final:3.7,pressure:32,...(c.tune||{})};
  c.components={...fresh.cars[0].components,...(c.components||{})};
  c.color=/^#[0-9a-f]{6}$/i.test(c.color||'')?c.color:'#c34e43';
  c.condition=clamp(Number(c.condition)||40,1,100);
  return c;
 });
 if(!state.cars.length){state=initial();return}
 if(!state.cars.some(c=>c.id===state.active))state.active=state.cars[0].id;
 state.market=state.market.filter(l=>l&&l.car&&MODELS[l.car.model]&&Number.isFinite(l.price));
 if(!state.market.length)refreshMarket();
}
function showStartupError(error){
 console.error('STREETLINE startup error:',error);
 const el=document.getElementById('view');
 if(el)el.innerHTML='<div class="panel" style="max-width:800px;margin:32px auto"><h2 style="color:#ff9b42">STREETLINE COULD NOT START</h2><p>Something prevented the interface from loading. Your save has not been deleted.</p><pre id="startupDetails" style="white-space:pre-wrap;color:#ffc4a4"></pre><button id="retryGame">TRY AGAIN</button> <button id="recoverGame">BACK UP SAVE &amp; RESET</button></div>';
 const details=document.getElementById('startupDetails');if(details)details.textContent=String(error?.stack||error);
 document.getElementById('retryGame')?.addEventListener('click',()=>location.reload());
 document.getElementById('recoverGame')?.addEventListener('click',()=>{
  const raw=localStorage.getItem('streetline-save-v1');
  if(raw){const blob=new Blob([raw],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='streetline-save-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  if(confirm('Backup downloaded. Reset STREETLINE save and reload?')){localStorage.removeItem('streetline-save-v1');location.reload()}
 });
}
window.addEventListener('error',e=>{if(!document.getElementById('view')?.children.length)showStartupError(e.error||e.message)});
try{validateSave();render();save()}catch(error){showStartupError(error)}

function bizPartState(j,id){if(j.fixed.includes(id))return 'repaired';if(!j.tests.some(t=>BIZ_SYSTEMS.find(s=>s.id===id)?.tests.includes(t)))return 'unknown';if(!j.issues.includes(id))return 'clear';return (j.id+BIZ_SYSTEMS.findIndex(s=>s.id===id))%3===0?'minor':'critical'}
function bizPartColor(st){return {critical:'#ff5252',minor:'#ffca50',repaired:'#50d8aa',clear:'#77b5d0',unknown:'#69899e'}[st]}
function bizTechPart(j,id,markup){const st=bizPartState(j,id),color=bizPartColor(st);return `<g class="tech-part ${st}" tabindex="0" role="button" aria-label="Inspect ${BIZ_SYSTEMS.find(x=>x.id===id)?.name||id}" onclick="bizSelectPart('${id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();bizSelectPart('${id}')}" style="--part:${color}" stroke="${color}" stroke-width="2" stroke-linejoin="round">${markup}<title>${id.toUpperCase()} · ${st==='unknown'?'NOT TESTED':st.toUpperCase()}</title></g>`}

function bizPartDescription(j,id){if(!id||!BIZ_PART_DETAILS[id])return '<strong>INSPECTION READY</strong><br>Select a labeled component on the drawing. Run a diagnostic test to reveal faults and repair instructions.';const [name,desc,fault]=BIZ_PART_DETAILS[id],st=bizPartState(j,id),sys=BIZ_SYSTEMS.find(x=>x.id===id),tests=BIZ_TESTS.filter(x=>sys.tests.includes(x[0])).map(x=>x[1]).join(' / ');let result=st==='unknown'?`<strong>NOT DIAGNOSED.</strong> Run: ${tests}.`:st==='critical'?`<strong style="color:#ff7474">MAJOR FAULT DETECTED.</strong> ${fault} Replace ${sys.part} using the repair button below.`:st==='minor'?`<strong style="color:#ffd878">MINOR FAULT DETECTED.</strong> ${fault} Replace ${sys.part} using the repair button below.`:st==='repaired'?'<strong style="color:#67efbd">REPAIR COMPLETE.</strong> The diagnosed fault has been resolved.':'<strong style="color:#a5e6ff">TESTED HEALTHY.</strong> No fault identified here.';return `<strong>${name.toUpperCase()}</strong><br>${desc}<br>${result}`}
