
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STREETLINE</title><style>
:root{--bg:#0a0d13;--panel:#151c26;--edge:#2b3949;--txt:#e8eef6;--muted:#8d9cac;--hot:#ff9b42;--cyan:#48d8f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,Segoe UI,sans-serif}button,input,select{font:inherit}button{background:#263445;border:1px solid #405268;color:#f3f7ff;padding:10px 14px;border-radius:9px;cursor:pointer}button:hover{border-color:var(--hot);background:#33465b}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#a64f23;border-color:#ff9b42}.shell{max-width:1420px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:1000;letter-spacing:3px;font-size:25px;color:var(--hot)}.stats{display:flex;gap:18px;flex-wrap:wrap}.stats b{color:#fff}.stats span{color:var(--muted)}nav{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}nav button.active{background:#a64f23;border-color:var(--hot)}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:14px}.panel{background:linear-gradient(145deg,#192331,#111720);border:1px solid var(--edge);border-radius:14px;padding:17px;margin-bottom:14px;box-shadow:0 14px 40px #0004}h1,h2,h3{margin:0 0 13px}h2{font-size:19px}h3{font-size:15px;color:#ffd2ac}.muted{color:var(--muted)}.hero{width:100%;height:330px;background:#0b1119;border-radius:12px;display:block}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:9px 0}.between{justify-content:space-between}.card{background:#0e1620;border:1px solid #2c3c4d;border-radius:10px;padding:12px;margin:9px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.chip{display:inline-block;border:1px solid #456079;border-radius:6px;padding:3px 7px;color:#b4cde0;font-size:12px}.value{color:var(--hot);font-weight:800}.bar{height:8px;border-radius:9px;background:#29313d;overflow:hidden;margin:6px 0}.bar i{display:block;background:linear-gradient(90deg,#ef8a3c,#ffd17e);height:100%}input[type=range]{width:100%;accent-color:#ff9b42}input[type=color]{height:36px;width:65px;background:none;border:0}input,select{background:#0d1520;border:1px solid #34465a;color:#fff;padding:8px;border-radius:7px}#toast{position:fixed;right:20px;bottom:20px;background:#2c3c4b;border:1px solid #ff9b42;border-radius:10px;padding:14px 18px;opacity:0;transition:.3s;pointer-events:none;z-index:8}#toast.show{opacity:1}.raceHud{display:none;position:fixed;inset:0;background:#060b11;z-index:10}.raceHud canvas{width:100%;height:100%;display:block}.raceOverlay{position:absolute;top:12px;left:12px;background:#0b1420cf;padding:13px;border-radius:12px;max-width:350px}.raceBottom{position:absolute;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}.raceBottom>*{background:#0b1420df;border:1px solid #394e64;border-radius:12px;padding:15px}.speed{font-size:37px;font-weight:900;color:#fff}.accent{color:var(--hot)}.tiny{font-size:12px}.list{max-height:500px;overflow:auto}.danger{border-color:#a74747}#chart{width:100%;height:280px;background:#090f17;border-radius:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}.hero{height:260px}.stats{gap:8px}}
</style></head><body><div class="shell"><div class="top"><div class="brand">STREETLINE <span class="tiny muted">// GARAGE CITY</span></div><div class="stats" id="stats"></div></div><nav id="nav"></nav><div id="view"></div></div><div id="toast"></div><div id="race" class="raceHud"><canvas id="raceCanvas"></canvas><div class="raceOverlay" id="raceInfo"></div><div class="raceBottom"><div><span class="speed" id="speed">0</span> MPH<br><span id="gear">GEAR 1</span> · <span id="rpm">1500</span> RPM</div><div><span class="accent" id="raceProgress">0%</span><br><span class="tiny">W/↑ accelerate · A/D steer · S brake · SPACE handbrake · SHIFT boost · ESC pause</span></div></div></div><script>
'use strict';
// STREETLINE 0.1: single-file playable foundation. All cars, art, and sounds generated in code.
const CONFIG={version:1,startCash:2000,marketRefresh:3,repairRate:7,garageTiers:[{name:'One-Car Lockup',slots:1,cost:0},{name:'Two-Bay Workshop',slots:3,cost:4500},{name:'Performance Garage',slots:6,cost:18000},{name:'Legendary Garage',slots:12,cost:75000}],parts:[{id:'intake',name:'Cold Air Intake',cost:320,hp:12},{id:'exhaust',name:'Sport Exhaust',cost:460,hp:17},{id:'ecu',name:'ECU Calibration',cost:750,hp:26},{id:'turbo',name:'Turbo Kit',cost:2600,hp:90},{id:'intercooler',name:'Intercooler',cost:850,hp:19},{id:'brakes',name:'Sport Brake Kit',cost:690,grip:7},{id:'tires',name:'Performance Tires',cost:580,grip:11},{id:'suspension',name:'Coilover Suspension',cost:960,grip:9},{id:'nitrous',name:'Nitrous System',cost:1250,hp:24},{id:'weight',name:'Weight Reduction',cost:980,weight:-110},{id:'wing',name:'Rear Wing',cost:620,grip:4}],events:[{name:'Harbor Sprint',distance:1700,prize:520,rep:40,difficulty:0.82},{name:'Downtown Dash',distance:2200,prize:850,rep:70,difficulty:1.04},{name:'Industrial Circuit',distance:2900,prize:1450,rep:110,difficulty:1.22},{name:'Midnight Run',distance:3500,prize:2800,rep:180,difficulty:1.47}]};
const NAMES=['Ruston 88','Kestrel C1','Vexi Mini','Halden S2','Torren LX','Astrax R','Vento GT','Morva 6','Kronos XR','Falken V8','Ardent S','Juno Turbo','Crestline 4','Sable Coupe','Verge RS','Obsidian GT','Dartline X','Voltair E','Brava Rally','Pulsar T','Kairo 7','Marrow R','Talon S','Axion AWD','Corsa 9','Vortex GT','Arclight Z','Helix 6','Stellar R','Phantom X','Vanta GT','Aether S','Onyx XR','Stratos V','Neon R','Comet GT','Nexus V','Monarch V12','Apex X','Titania R','Wraith 01','Specter 02','Eclipse 03'];
const CATS=['Beater','Economy','Hatchback','Sedan','Coupe','Sports','Muscle','Tuner','Off-road','Supercar','Hypercar'];
const COLORS=['#c34e43','#4c88b9','#f5c44f','#8bc3ae','#8b80bb','#b9c0c8','#e57e42'];
const MODELS=NAMES.map((name,i)=>({id:i,name,category:i<3?'Beater':CATS[Math.min(10,Math.floor(i/4))],hp:Math.round(75+i*13+(i%4)*12),weight:Math.round(2050+i*28),grip:Math.round(50+i*.7),price:Math.round(1200*Math.pow(1.12,i)),drive:i%5===0?'AWD':i%3===0?'FWD':'RWD',body:i%5,legend:i>=40}));
const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString('en-US'),money=n=>'$'+fmt(n),rnd=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));let uid=0;function makeCar(model,quality=.75){const condition=Math.round(clamp(quality*100+rnd(-12,12),18,100));return {id:'SL-'+Date.now().toString(36)+'-'+(++uid),model:model.id,miles:Math.round(rnd(28000,160000)),condition,components:Object.fromEntries(['engine','transmission','clutch','suspension','brakes','tires','body'].map(k=>[k,clamp(condition+Math.round(rnd(-17,17)),5,100)])),color:COLORS[Math.floor(rnd(0,COLORS.length))],paint:'Gloss',wing:false,lowered:false,parts:[],purchased:0,spent:0,tune:{boost:0,final:3.7,pressure:32},history:[]}}
function initial(){let car=makeCar(MODELS[0],.42);car.purchased=500;return {version:1,cash:2000,rep:0,day:1,garage:0,cars:[car],active:car.id,market:[],lastRefresh:0,stats:{wins:0,losses:0,flips:0,earned:0},skills:{mechanic:0,driver:0,negotiator:0,tuner:0},achievements:[],settings:{sound:false},ledger:[]}}
let state;try{state=JSON.parse(localStorage.getItem('streetline-save-v1'));if(!state||state.version!==1||!Array.isArray(state.cars))throw 0}catch{state=initial()}let screen='Garage',selectedListing=0,selectedCar=0,raceState=null,keys={},soundCtx=null;const car=()=>state.cars.find(c=>c.id===state.active)||state.cars[0],model=c=>MODELS[c.model],hp=c=>Math.round(model(c).hp+c.parts.reduce((a,p)=>a+(CONFIG.parts.find(x=>x.id===p)?.hp||0),0)+c.tune.boost*2),grip=c=>model(c).grip+c.parts.reduce((a,p)=>a+(CONFIG.parts.find(x=>x.id===p)?.grip||0),0),weight=c=>model(c).weight+c.parts.reduce((a,p)=>a+(CONFIG.parts.find(x=>x.id===p)?.weight||0),0),value=c=>Math.round(model(c).price*(.28+.72*c.condition/100)+c.parts.reduce((a,p)=>a+(CONFIG.parts.find(x=>x.id===p)?.cost||0)*.5,0)),rating=c=>{let s=hp(c)/weight(c)*1000+grip(c)*.4;return s>370?'X':s>290?'S':s>220?'A':s>160?'B':s>115?'C':'D'};function save(){try{localStorage.setItem('streetline-save-v1',JSON.stringify(state))}catch{toast('Save storage unavailable')}}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),2900)}function charge(n){if(state.cash<n){toast('Not enough cash');return false}state.cash-=n;return true}function advance(d=1){state.day+=d;if(state.day-state.lastRefresh>=CONFIG.marketRefresh)refreshMarket()}function refreshMarket(){state.market=Array.from({length:8},()=>{const max=clamp(7+Math.floor(state.rep/180),7,MODELS.length);const m=MODELS[Math.floor(rnd(0,max))],c=makeCar(m,rnd(.35,.95));return {car:c,price:Math.round(value(c)*rnd(.72,1.18)),seller:['Honest','Desperate','Collector','Shady'][Math.floor(rnd(0,4))],inspected:false}});state.lastRefresh=state.day;save()}if(!state.market?.length)refreshMarket();function updateTopBar(){const c=car();$('stats').innerHTML=`<div><span>CASH</span> <b>${money(state.cash)}</b></div><div><span>REP</span> <b>${fmt(state.rep)}</b></div><div><span>DAY</span> <b>${state.day}</b></div><div><span>CAR</span> <b>${c?model(c).name:'None'}</b></div>`;const tabs=['Garage','Marketplace','Parts Shop','Workshop','Dyno','Race Hub','Customization','Profile'];$('nav').innerHTML=tabs.map(t=>`<button class="${t===screen?'active':''}" onclick="go('${t}')">${t}</button>`).join('')}
function go(t){screen=t;render()}function render(){updateTopBar();let views={Garage:garage,Marketplace:marketplace,'Parts Shop':partsShop,Workshop:workshop,Dyno:dyno,'Race Hub':raceHub,Customization:customization,Profile:profile};$('view').innerHTML=views[screen]();drawScenes()}function carCanvas(c,w=700,h=330){return `<canvas class="hero" width="${w}" height="${h}" data-car="${c.id}"></canvas>`}function carArt(ctx,c,x,y,s=1){const m=model(c);ctx.save();ctx.translate(x,y);ctx.scale(s,s);const shade=c.color;ctx.shadowColor='#000';ctx.shadowBlur=16;ctx.fillStyle='#05070b';ctx.beginPath();ctx.ellipse(0,53,198,21,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;for(const wx of [-118,119]){ctx.fillStyle='#080c10';ctx.fillRect(wx-29,7,58,72);ctx.fillStyle='#242d38';ctx.beginPath();ctx.arc(wx,48,31,0,7);ctx.fill();ctx.fillStyle='#0d1117';ctx.beginPath();ctx.arc(wx,48,22,0,7);ctx.fill();ctx.strokeStyle='#a7b3bd';ctx.lineWidth=3;for(let i=0;i<8;i++){let a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(wx+Math.cos(a)*6,48+Math.sin(a)*6);ctx.lineTo(wx+Math.cos(a)*19,48+Math.sin(a)*19);ctx.stroke()}ctx.fillStyle='#8895a2';ctx.beginPath();ctx.arc(wx,48,5,0,7);ctx.fill()}ctx.fillStyle=shade;ctx.beginPath();ctx.moveTo(-195,25);ctx.lineTo(-178,-11);ctx.lineTo(-91,-24);ctx.lineTo(-45,-72);ctx.lineTo(71,-72);ctx.lineTo(135,-26);ctx.lineTo(191,-12);ctx.lineTo(201,26);ctx.lineTo(187,42);ctx.lineTo(-188,42);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffffff44';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#101e2a';ctx.beginPath();ctx.moveTo(-75,-25);ctx.lineTo(-34,-64);ctx.lineTo(61,-64);ctx.lineTo(114,-25);ctx.closePath();ctx.fill();ctx.strokeStyle='#b9c9d2';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.moveTo(17,-64);ctx.lineTo(18,-25);ctx.stroke();ctx.fillStyle='#101419';ctx.fillRect(-173,25,344,6);ctx.fillStyle='#ffe4a0';ctx.fillRect(184,-4,13,12);ctx.fillStyle='#e22d2d';ctx.fillRect(-196,1,10,17);if(c.wing||c.parts.includes('wing')){ctx.fillStyle='#111820';ctx.fillRect(-164,-34,9,25);ctx.fillRect(-192,-42,66,9)}if(c.lowered)ctx.fillStyle='#ff8b3a';ctx.restore()}
function drawScenes(){document.querySelectorAll('[data-car]').forEach(canvas=>{const c=state.cars.find(x=>x.id===canvas.dataset.car)||state.market.find(x=>x.car.id===canvas.dataset.car)?.car;if(!c)return;const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#192b3d');g.addColorStop(1,'#0c1119');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.strokeStyle='#294051';for(let i=0;i<w;i+=70){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,h);ctx.stroke()}ctx.fillStyle='#121820';ctx.fillRect(0,h*.74,w,h*.26);ctx.fillStyle='#283847';ctx.fillRect(0,h*.75,w,5);ctx.save();ctx.translate(w/2,h*.53);ctx.scale(Math.min(w/550,h/240),Math.min(w/550,h/240));carArt(ctx,c,0,0,1);ctx.restore();ctx.fillStyle='#e1a269';ctx.font='bold 18px system-ui';ctx.fillText(model(c).name.toUpperCase(),22,30);ctx.font='12px system-ui';ctx.fillStyle='#b2c5d4';ctx.fillText(`${hp(c)} HP  ·  ${model(c).drive}  ·  CLASS ${rating(c)}`,22,51)})}
function carStats(c){return `<div class="grid"><div class="card">POWER<br><strong class="value">${hp(c)} HP</strong></div><div class="card">GRIP<br><strong class="value">${grip(c)}</strong></div><div class="card">WEIGHT<br><strong class="value">${fmt(weight(c))} LB</strong></div><div class="card">CLASS<br><strong class="value">${rating(c)}</strong></div></div><p class="muted">${fmt(c.miles)} miles · ${c.condition}% condition · ${model(c).drive}</p><div class="bar"><i style="width:${c.condition}%"></i></div>`}
function garage(){let c=car();return `<div class="layout"><section><div class="panel"><h2>YOUR GARAGE <span class="chip">${CONFIG.garageTiers[state.garage].name}</span></h2>${carCanvas(c)}${carStats(c)}<div class="row"><button class="primary" onclick="go('Workshop')">WORK ON CAR</button><button onclick="go('Race Hub')">RACE</button><button onclick="go('Customization')">CUSTOMIZE</button></div></div></section><aside><div class="panel"><h2>YOUR CARS · ${state.cars.length}/${CONFIG.garageTiers[state.garage].slots}</h2>${state.cars.map(c=>`<div class="card"><div class="row between"><strong>${model(c).name}</strong><span class="chip">${rating(c)}</span></div><span class="muted">${c.condition}% · ${money(value(c))}</span><div class="row"><button onclick="activate('${c.id}')" ${c.id===state.active?'disabled':''}>${c.id===state.active?'ACTIVE':'DRIVE'}</button><button onclick="sell('${c.id}')" ${state.cars.length<2?'disabled':''}>SELL</button></div></div>`).join('')}<h3>GARAGE EXPANSION</h3>${state.garage<3?`<p>${CONFIG.garageTiers[state.garage+1].name} — ${money(CONFIG.garageTiers[state.garage+1].cost)}</p><button onclick="upgradeGarage()">UPGRADE GARAGE</button>`:'<p>Maximum garage unlocked.</p>'}</div><div class="panel"><h3>QUICK CASH</h3><p class="muted">Delivery jobs keep you moving even if you run out of money.</p><button onclick="delivery()">DELIVERY JOB · +$180</button></div></aside></div>`}
function activate(id){state.active=id;save();render()}function sell(id){let c=state.cars.find(x=>x.id===id);if(!c||state.cars.length<2)return;let payout=Math.round(value(c)*.82);if(!confirm(`Sell ${model(c).name} for ${money(payout)}?`))return;state.cash+=payout;state.stats.flips++;state.ledger.push({name:model(c).name,profit:payout-c.purchased-c.spent});state.cars=state.cars.filter(x=>x.id!==id);if(state.active===id)state.active=state.cars[0].id;save();render();toast('Car sold for '+money(payout))}function upgradeGarage(){let t=CONFIG.garageTiers[state.garage+1];if(!t||!charge(t.cost))return;state.garage++;save();render()}function delivery(){state.cash+=180;advance();save();render();toast('Delivery complete: +$180')}
function marketplace(){return `<div class="layout"><section><div class="panel"><div class="row between"><h2>USED CAR MARKET</h2><span class="muted">Refreshes every ${CONFIG.marketRefresh} days</span></div><div class="grid">${state.market.map((l,i)=>`<div class="card"><div class="row between"><strong>${model(l.car).name}</strong><span class="chip">${rating(l.car)}</span></div><div class="muted">${fmt(l.car.miles)} mi · ${l.car.condition}% · ${l.seller} seller</div><h3>${money(l.price)}</h3><button onclick="selectedListing=${i};render()">VIEW LISTING</button></div>`).join('')}</div><div class="row"><button onclick="advance(3);render()">WAIT 3 DAYS · REFRESH MARKET</button></div></div></section><aside><div class="panel">${(()=>{let l=state.market[selectedListing]||state.market[0];return `<h2>${model(l.car).name}</h2>${carCanvas(l.car,650,310)}${carStats(l.car)}<p class="muted">Seller: ${l.seller} · ${l.inspected?'Inspection completed':'Hidden issues possible'}</p><h2>${money(l.price)}</h2><div class="row"><button class="primary" onclick="buyListing()">BUY CAR</button><button onclick="inspectListing()">INSPECT · $75</button><button onclick="haggle()">HAGGLE</button></div>`})()}</div></aside></div>`}
function buyListing(){let l=state.market[selectedListing];if(!l)return;if(state.cars.length>=CONFIG.garageTiers[state.garage].slots){toast('Upgrade garage to store another car');return}if(!charge(l.price))return;l.car.purchased=l.price;state.cars.push(l.car);state.active=l.car.id;state.market.splice(selectedListing,1);selectedListing=0;save();render();toast('Purchased '+model(l.car).name)}function inspectListing(){let l=state.market[selectedListing];if(!l||l.inspected||!charge(75))return;l.inspected=true;save();render();toast('Inspection: engine '+l.car.components.engine+'%, clutch '+l.car.components.clutch+'%')}function haggle(){let l=state.market[selectedListing];if(!l)return;if(Math.random()<.5+state.skills.negotiator*.02){l.price=Math.round(l.price*.92);state.skills.negotiator++;toast('Seller accepted lower price')}else{l.price=Math.round(l.price*1.02);toast('Seller refused your offer')}save();render()}
function partsShop(){let c=car();return `<div class="panel"><h2>PERFORMANCE PARTS <span class="muted tiny">Parts install immediately in this version</span></h2><div class="grid">${CONFIG.parts.map(p=>`<div class="card"><h3>${p.name}</h3><p class="muted">${p.hp?'+'+p.hp+' HP ':''}${p.grip?'+'+p.grip+' grip ':''}${p.weight?p.weight+' lb':''}</p><strong>${money(p.cost)}</strong><div class="row"><button onclick="install('${p.id}')" ${c.parts.includes(p.id)?'disabled':''}>${c.parts.includes(p.id)?'INSTALLED':'BUY + INSTALL'}</button></div></div>`).join('')}</div></div>`}function install(id){let p=CONFIG.parts.find(x=>x.id===id),c=car();if(!p||c.parts.includes(id)||!charge(p.cost))return;c.parts.push(id);c.spent+=p.cost;state.skills.mechanic++;save();render();toast(p.name+' installed')}
function workshop(){let c=car();return `<div class="layout"><div class="panel"><h2>WORKSHOP · DIAGNOSTICS</h2>${carCanvas(c)}<p class="muted">Component health directly affects reliability and performance.</p>${Object.entries(c.components).map(([k,v])=>`<div class="card"><div class="row between"><strong>${k.toUpperCase()}</strong><span>${Math.round(v)}%</span></div><div class="bar"><i style="width:${v}%"></i></div><button onclick="repair('${k}')">REPAIR · ${money(Math.ceil((100-v)*CONFIG.repairRate))}</button></div>`).join('')}</div><aside><div class="panel"><h2>RESTORATION</h2><p>Overall condition: <strong>${c.condition}%</strong></p><button class="primary" onclick="fullRestore()">FULL RESTORATION · ${money(Math.ceil((100-c.condition)*45))}</button><p class="muted">Restoration improves resale value and helps keep your car dependable.</p></div></aside></div>`}function repair(k){let c=car(),v=c.components[k],cost=Math.ceil((100-v)*CONFIG.repairRate);if(!charge(cost))return;c.components[k]=100;c.condition=Math.round(Object.values(c.components).reduce((a,b)=>a+b,0)/Object.keys(c.components).length);c.spent+=cost;state.skills.mechanic++;advance();save();render();toast(k+' repaired')}function fullRestore(){let c=car(),cost=Math.ceil((100-c.condition)*45);if(!charge(cost))return;Object.keys(c.components).forEach(k=>c.components[k]=100);c.condition=100;c.spent+=cost;advance(2);save();render();toast('Full restoration completed')}
function dyno(){let c=car();return `<div class="layout"><section><div class="panel"><h2>DYNO · POWER & TORQUE</h2><canvas id="chart" width="750" height="300"></canvas><div class="grid"><div class="card">PEAK OUTPUT<br><strong class="value">${hp(c)} HP</strong></div><div class="card">DRIVETRAIN<br><strong class="value">${model(c).drive}</strong></div><div class="card">WEIGHT<br><strong class="value">${fmt(weight(c))} LB</strong></div></div><button class="primary" onclick="runDyno()">RUN DYNO TEST</button></div></section><aside><div class="panel"><h2>TUNING</h2><label>Boost tune · <strong id="boostValue">${c.tune.boost}</strong></label><input type="range" min="0" max="15" value="${c.tune.boost}" oninput="$('boostValue').textContent=this.value" onchange="setTune('boost',this.value)"><label>Final drive · <strong id="finalValue">${c.tune.final}</strong></label><input type="range" min="2.8" max="5.0" step=".1" value="${c.tune.final}" oninput="$('finalValue').textContent=this.value" onchange="setTune('final',this.value)"><label>Tire pressure · <strong id="pressureValue">${c.tune.pressure}</strong> PSI</label><input type="range" min="24" max="42" value="${c.tune.pressure}" oninput="$('pressureValue').textContent=this.value" onchange="setTune('pressure',this.value)"><p class="muted">Higher boost adds power but can increase wear. Lower gearing improves acceleration at the cost of top speed.</p></div></aside></div>`}function setTune(k,v){car().tune[k]=Number(v);state.skills.tuner++;save();render()}function runDyno(){const c=car();if(c.tune.boost>10&&c.components.engine<60){c.components.engine=clamp(c.components.engine-5,0,100);toast('Warning: boost stressed your worn engine')}else toast('Dyno complete · '+hp(c)+' HP');save();drawDyno()}function drawDyno(){let can=$('chart');if(!can)return;let ctx=can.getContext('2d'),w=can.width,h=can.height;ctx.fillStyle='#09121b';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#283747';ctx.lineWidth=1;for(let x=50;x<w;x+=70){ctx.beginPath();ctx.moveTo(x,20);ctx.lineTo(x,h-35);ctx.stroke()}for(let y=30;y<h-30;y+=40){ctx.beginPath();ctx.moveTo(45,y);ctx.lineTo(w-20,y);ctx.stroke()}for(let t=0;t<2;t++){ctx.strokeStyle=t?'#4bdcf0':'#ff9b42';ctx.lineWidth=4;ctx.beginPath();for(let i=0;i<=100;i++){let x=50+i*(w-75)/100;let v=t?Math.pow(Math.sin(i/100*Math.PI),.75):Math.pow(Math.sin(i/100*Math.PI*.88),1.4);let y=h-40-v*(h-85)*(t?.82:1);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}ctx.fillStyle='#b9c8d5';ctx.font='13px system-ui';ctx.fillText('RPM →',w-75,h-12);ctx.fillStyle='#ff9b42';ctx.fillText('HORSEPOWER',60,20);ctx.fillStyle='#4bdcf0';ctx.fillText('TORQUE',195,20)}
function raceHub(){return `<div class="layout"><section><div class="panel"><h2>RACE HUB</h2><p class="muted">Drive against an AI rival on a procedurally rendered night highway. Winning earns cash and reputation.</p><div class="grid">${CONFIG.events.map((e,i)=>`<div class="card"><h3>${e.name}</h3><p class="muted">${fmt(e.distance)} ft · Difficulty ${Math.round(e.difficulty*100)}%</p><div class="row between"><strong class="value">${money(e.prize)}</strong><span class="chip">+${e.rep} REP</span></div><button class="primary" onclick="startRace(${i})">ENTER RACE</button></div>`).join('')}</div></div></section><aside><div class="panel"><h2>YOUR RACE BUILD</h2>${carCanvas(car(),650,310)}${carStats(car())}<p class="muted">Drive with WASD or arrow keys. Hold Shift for boost. Avoid roadside barriers and beat the rival to the finish.</p></div></aside></div>`}
function customization(){let c=car();return `<div class="layout"><section><div class="panel"><h2>CUSTOMIZATION STUDIO</h2>${carCanvas(c)}<div class="grid"><div class="card"><h3>PAINT COLOR</h3><input type="color" value="${c.color}" onchange="custom('color',this.value)"></div><div class="card"><h3>PAINT FINISH</h3><select onchange="custom('paint',this.value)">${['Gloss','Matte','Metallic','Pearl'].map(x=>`<option ${x===c.paint?'selected':''}>${x}</option>`).join('')}</select></div><div class="card"><h3>REAR WING</h3><button onclick="custom('wing',${!c.wing})">${c.wing?'REMOVE':'INSTALL'} WING</button></div><div class="card"><h3>STANCE</h3><button onclick="custom('lowered',${!c.lowered})">${c.lowered?'RAISE':'LOWER'} CAR</button></div></div></div></section><aside><div class="panel"><h2>YOUR BUILD</h2>${carStats(c)}<p class="muted">All visual changes are saved and reflected in the garage.</p></div></aside></div>`}function custom(k,v){car()[k]=v;save();render()}
function profile(){return `<div class="layout"><section><div class="panel"><h2>DRIVER PROFILE</h2><div class="grid">${Object.entries(state.stats).map(([k,v])=>`<div class="card">${k.toUpperCase()}<h2 class="value">${fmt(v)}</h2></div>`).join('')}</div><h3>SKILLS</h3>${Object.entries(state.skills).map(([k,v])=>`<div class="card">${k.toUpperCase()} · LEVEL ${Math.floor(v/5)+1}<div class="bar"><i style="width:${(v%5)*20}%"></i></div></div>`).join('')}<h3>FLIP LEDGER</h3>${state.ledger.length?state.ledger.map(l=>`<p>${l.name} · <strong>${money(l.profit)}</strong></p>`).join(''):'<p class="muted">No cars sold yet.</p>'}</div></section><aside><div class="panel"><h2>SAVE & SETTINGS</h2><div class="row"><button onclick="save();toast('Saved')">SAVE GAME</button><button onclick="exportSave()">EXPORT SAVE</button><button onclick="importSave()">IMPORT SAVE</button><button class="danger" onclick="resetSave()">RESET</button></div><label><input type="checkbox" ${state.settings.sound?'checked':''} onchange="state.settings.sound=this.checked;save()"> Procedural engine audio</label><p class="muted">Progress autosaves after purchases, repairs, tuning, races, and other actions.</p></div><div class="panel"><h2>ACHIEVEMENTS</h2><p class="muted">${state.achievements.length} unlocked</p>${state.achievements.map(a=>`<div class="card">🏆 ${a}</div>`).join('')||'<p>Win your first race to start your collection.</p>'}</div></aside></div>`}function exportSave(){prompt('Copy your save data:',btoa(unescape(encodeURIComponent(JSON.stringify(state)))))}function importSave(){let s=prompt('Paste exported save data:');if(!s)return;try{let o=JSON.parse(decodeURIComponent(escape(atob(s))));if(o.version!==1||!Array.isArray(o.cars)||!o.cars.length)throw 0;state=o;save();render();toast('Save imported')}catch{toast('Invalid save data')}}function resetSave(){if(confirm('Delete all STREETLINE progress?')){state=initial();refreshMarket();save();render()}}
function achievement(a){if(!state.achievements.includes(a)){state.achievements.push(a);toast('ACHIEVEMENT · '+a)}}
// Real-time highway race: steering, acceleration, braking, collisions, rival, boost, finish.
function startRace(i){if(raceState)return;const c=car(),event=CONFIG.events[i];raceState={i,event,x:0,speed:0,distance:0,enemy:0,enemyX:0.3,damage:0,boost:100,elapsed:0,paused:false,finished:false,roadside:[],last:performance.now()};$('race').style.display='block';for(let j=0;j<18;j++)raceState.roadside.push({z:j*220+150,x:(j%2?1:-1)*rnd(.75,1.4)});requestAnimationFrame(loop)}function finishRace(win){let r=raceState;if(!r||r.finished)return;r.finished=true;const c=car(),wear=clamp(1+r.damage*.1,1,14);c.components.tires=clamp(c.components.tires-wear,0,100);c.components.engine=clamp(c.components.engine-wear*.35,0,100);c.condition=Math.round(Object.values(c.components).reduce((a,b)=>a+b,0)/Object.keys(c.components).length);c.miles+=Math.round(r.event.distance/5280);if(win){state.cash+=r.event.prize;state.rep+=r.event.rep;state.stats.wins++;state.stats.earned+=r.event.prize;state.skills.driver++;achievement('First Victory')}else state.stats.losses++;advance();save();$('race').style.display='none';raceState=null;render();alert(`${win?'VICTORY!':'DEFEAT'}\n${r.event.name}\n${win?'Prize: '+money(r.event.prize)+' · +'+r.event.rep+' reputation':'Better luck next time.'}\nVehicle wear applied.`)}
function loop(now){let r=raceState;if(!r||r.finished)return;let dt=clamp((now-r.last)/1000,0,.05);r.last=now;if(!r.paused){r.elapsed+=dt;const c=car(),power=hp(c),condition=clamp(c.components.engine/100,.25,1),max=clamp(70+power*.11,85,215);let gas=keys.w||keys.ArrowUp,brake=keys.s||keys.ArrowDown,steer=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0);let boost=keys.Shift&&r.boost>0&&gas;r.speed=clamp(r.speed+(gas?(power/95)*condition*(boost?2.1:1):-.7)*dt*8-(brake?25*dt:0)-r.speed*.009*dt*8,0,max);if(boost)r.boost=clamp(r.boost-25*dt,0,100);else r.boost=clamp(r.boost+4*dt,0,100);r.x+=steer*dt*(.52+r.speed/115);if(Math.abs(r.x)>1.12){r.speed*=1-dt*2;r.damage+=dt*3;r.x=clamp(r.x,-1.4,1.4)}r.distance+=r.speed*1.467*dt;let enemySpeed=clamp((110+power*.025)*r.event.difficulty,72,185);r.enemy+=enemySpeed*1.467*dt;if(Math.abs(r.distance-r.enemy)<35&&Math.abs(r.x-r.enemyX)<.28&&r.elapsed>2){r.speed*=.985;r.damage+=dt*2}if(r.distance>=r.event.distance||r.enemy>=r.event.distance){finishRace(r.distance>=r.event.distance&&r.distance>=r.enemy);return}}drawRace(r);requestAnimationFrame(loop)}
function drawRace(r){let canvas=$('raceCanvas'),w=canvas.width=innerWidth*devicePixelRatio,h=canvas.height=innerHeight*devicePixelRatio,ctx=canvas.getContext('2d');ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);w=innerWidth;h=innerHeight;ctx.fillStyle='#0b1720';ctx.fillRect(0,0,w,h);let mid=w/2,roadW=Math.min(w*.73,720),left=mid-roadW/2;ctx.fillStyle='#15212a';ctx.fillRect(left-110,0,roadW+220,h);ctx.fillStyle='#29343e';ctx.fillRect(left,0,roadW,h);ctx.fillStyle='#d8b45c';ctx.fillRect(left+7,0,5,h);ctx.fillRect(left+roadW-12,0,5,h);let offset=r.distance%130;ctx.fillStyle='#c7cdd8';for(let y=-130+offset;y<h+130;y+=130){for(let lane=1;lane<3;lane++)ctx.fillRect(left+roadW*lane/3-3,y,6,65)}for(let i=0;i<25;i++){let y=((i*89+r.distance*.8)%(h+120))-60;let x=left-50-(i%3)*12;ctx.fillStyle=i%4?'#1d3c36':'#54717c';ctx.beginPath();ctx.arc(x,y,15+i%3*6,0,7);ctx.fill();ctx.beginPath();ctx.arc(left+roadW+50+(i%3)*12,y,15+i%3*6,0,7);ctx.fill()}function topCar(x,y,col,enemy=false){ctx.save();ctx.translate(x,y);ctx.shadowColor=col;ctx.shadowBlur=12;ctx.fillStyle='#06090e';ctx.fillRect(-22,-39,44,85);ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(-20,-42,40,82,9);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#0a1d2d';ctx.fillRect(-16,-20,32,28);ctx.fillRect(-16,19,32,11);ctx.fillStyle=enemy?'#f04e43':'#fce4a8';ctx.fillRect(-17,enemy?35:-39,12,6);ctx.fillRect(5,enemy?35:-39,12,6);ctx.fillStyle='#05090d';ctx.fillRect(-25,-22,6,21);ctx.fillRect(19,-22,6,21);ctx.fillRect(-25,16,6,21);ctx.fillRect(19,16,6,21);ctx.restore()}let playerY=h*.72,enemyY=playerY+(r.distance-r.enemy)*.5;if(enemyY>-90&&enemyY<h+90)topCar(mid+r.enemyX*roadW*.32,enemyY,'#df5551',true);topCar(mid+r.x*roadW*.32,playerY,car().color);ctx.fillStyle='#fff';ctx.font='13px system-ui';ctx.fillText('FINISH',left+25,30);$('raceInfo').innerHTML=`<strong class="accent">${r.event.name.toUpperCase()}</strong><br>YOU ${Math.floor(r.distance)} / ${r.event.distance} FT<br>RIVAL ${Math.floor(r.enemy)} FT<br>${r.paused?'<strong>PAUSED · ESC TO RESUME</strong>':''}`;$('speed').textContent=Math.round(r.speed);$('gear').textContent='GEAR '+clamp(Math.floor(r.speed/35)+1,1,6);$('rpm').textContent=Math.round(1600+(r.speed%35)/35*5600);$('raceProgress').textContent=Math.floor(clamp(r.distance/r.event.distance,0,1)*100)+'% · BOOST '+Math.round(r.boost)+'%'}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;keys[e.key.toLowerCase()]=true;if(e.key==='Escape'&&raceState){raceState.paused=!raceState.paused;toast(raceState.paused?'Race paused':'Race resumed')}});addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});addEventListener('blur',()=>{keys={};if(raceState)raceState.paused=true});function drawExtras(){if(screen==='Dyno')drawDyno()}
const oldDraw=drawScenes;drawScenes=function(){oldDraw();drawExtras()};
// Recover from incomplete/old saves rather than leaving the page blank.
function validateSave(){
 if(!state||typeof state!=='object'||!Array.isArray(state.cars)||!state.cars.length){state=initial();return}
 const fresh=initial();
 for(const k of ['stats','skills','settings'])state[k]={...fresh[k],...(state[k]&&typeof state[k]==='object'?state[k]:{})};
 for(const k of ['ledger','achievements'])if(!Array.isArray(state[k]))state[k]=[];
 if(!Array.isArray(state.market))state.market=[];
 state.cash=Number.isFinite(state.cash)?Math.max(0,state.cash):2000;
 state.rep=Number.isFinite(state.rep)?Math.max(0,state.rep):0;
 state.day=Number.isFinite(state.day)?Math.max(1,state.day):1;
 state.garage=Number.isInteger(state.garage)?clamp(state.garage,0,3):0;
 state.cars=state.cars.filter(c=>c&&MODELS[c.model]).map(c=>{
  c.parts=Array.isArray(c.parts)?c.parts.filter(id=>CONFIG.parts.some(p=>p.id===id)):[];
  c.tune={boost:0,final:3.7,pressure:32,...(c.tune||{})};
  c.components={...fresh.cars[0].components,...(c.components||{})};
  c.color=/^#[0-9a-f]{6}$/i.test(c.color||'')?c.color:'#c34e43';
  c.condition=clamp(Number(c.condition)||40,1,100);
  return c;
 });
 if(!state.cars.length){state=initial();return}
 if(!state.cars.some(c=>c.id===state.active))state.active=state.cars[0].id;
 state.market=state.market.filter(l=>l&&l.car&&MODELS[l.car.model]&&Number.isFinite(l.price));
 if(!state.market.length)refreshMarket();
}
function showStartupError(error){
 console.error('STREETLINE startup error:',error);
 const el=document.getElementById('view');
 if(el)el.innerHTML='<div class="panel" style="max-width:800px;margin:32px auto"><h2 style="color:#ff9b42">STREETLINE COULD NOT START</h2><p>Something prevented the interface from loading. Your save has not been deleted.</p><pre id="startupDetails" style="white-space:pre-wrap;color:#ffc4a4"></pre><button id="retryGame">TRY AGAIN</button> <button id="recoverGame">BACK UP SAVE &amp; RESET</button></div>';
 const details=document.getElementById('startupDetails');if(details)details.textContent=String(error?.stack||error);
 document.getElementById('retryGame')?.addEventListener('click',()=>location.reload());
 document.getElementById('recoverGame')?.addEventListener('click',()=>{
  const raw=localStorage.getItem('streetline-save-v1');
  if(raw){const blob=new Blob([raw],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='streetline-save-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  if(confirm('Backup downloaded. Reset STREETLINE save and reload?')){localStorage.removeItem('streetline-save-v1');location.reload()}
 });
}
window.addEventListener('error',e=>{if(!document.getElementById('view')?.children.length)showStartupError(e.error||e.message)});
try{validateSave();render();save()}catch(error){showStartupError(error)}

</script></body></html>
