<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garage Kings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-screen 3D garage with a workshop-manual side panel; racing and the shop take over the whole screen. */
:root{
  --bg:#0d0f12;
  --panel:#15181d;
  --panel2:#1c2027;
  --line:#2b313a;
  --fg:#ebe7df;
  --muted:#8d949e;
  --accent:#ff7a1a;      /* safety orange */
  --accent-ink:#1a0d02;
  --steel:#9fb3c8;
  --good:#3ddc84;
  --warn:#ffc53d;
  --bad:#ff4d4d;
  --cD:#9aa7b8; --cC:#3ddc84; --cB:#3fa9ff; --cA:#b07cff; --cS:#ff4d7a; --cX:#ffd23f;
  --f-display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none;}
button{font-family:inherit;}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;}
.screen{position:fixed;inset:0;}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.02em;}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;}

/* ---------- buttons ---------- */
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:9px 14px;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:background .12s,border-color .12s,transform .08s;}
.btn:hover{border-color:var(--steel);}
.btn:active{transform:translateY(1px);}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn.primary:hover{filter:brightness(1.08);}
.btn.danger{border-color:#5a2a2a;color:#ffb3b3;}
.btn.small{padding:5px 10px;font-size:13px;}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;}
.btn.big{font-family:var(--f-display);font-size:22px;letter-spacing:.06em;padding:12px 28px;text-transform:uppercase;}

/* ---------- title ---------- */
#title{display:flex;align-items:flex-end;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:0 9vh;background:linear-gradient(90deg,rgba(13,15,18,.92) 0%,rgba(13,15,18,.55) 45%,rgba(13,15,18,0) 75%);}
#title .wrap{max-width:560px;display:flex;flex-direction:column;gap:18px;}
#title .logo{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,11vw,136px);line-height:.82;text-transform:uppercase;letter-spacing:.01em;}
#title .logo span{color:var(--accent);display:block;}
#title .tag{color:var(--muted);font-size:17px;max-width:44ch;line-height:1.45;}
#title .row{display:flex;gap:12px;flex-wrap:wrap;}
#title .plate{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 8px;border-radius:4px;align-self:flex-start;letter-spacing:.1em;}

/* ---------- hub ---------- */
#hub{display:grid;grid-template-columns:auto 1fr minmax(360px,500px);grid-template-rows:auto 1fr;pointer-events:none;}
#hub > *{pointer-events:auto;}
#topbar{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(13,15,18,.95),rgba(13,15,18,.6));border-bottom:1px solid var(--line);}
#topbar .brand{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.02em;}
#topbar .brand b{color:var(--accent);}
#topbar .spacer{flex:1;}
.stat-chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;}
.stat-chip .v{font-family:var(--f-mono);font-weight:700;font-size:18px;}
.money .v{color:var(--good);}
.iconbtn{background:none;border:1px solid var(--line);color:var(--fg);width:36px;height:36px;border-radius:6px;cursor:pointer;font-size:16px;display:grid;place-items:center;}
.iconbtn:hover{border-color:var(--steel);}
#nav{display:flex;flex-direction:column;gap:4px;padding:14px 10px 14px max(10px,env(safe-area-inset-left,0px));background:rgba(13,15,18,.72);border-right:1px solid var(--line);width:184px;}
#nav button{all:unset;cursor:pointer;padding:10px 12px;white-space:nowrap;border-radius:6px;font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;}
#nav button .k{font-family:var(--f-mono);font-size:10px;border:1px solid var(--line);border-radius:3px;padding:1px 4px;color:var(--muted);}
#nav button:hover{color:var(--fg);background:var(--panel2);}
#nav button.on{color:var(--accent-ink);background:var(--accent);}
#nav button.on .k{border-color:rgba(0,0,0,.3);color:var(--accent-ink);}
#nav button:focus-visible{outline:2px solid var(--accent);}
#showcase{position:relative;pointer-events:none;}
#carTag{position:absolute;left:24px;bottom:22px;display:flex;flex-direction:column;gap:6px;pointer-events:none;text-shadow:0 2px 12px #000;}
#carTag .make{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;}
#carTag .model{font-family:var(--f-display);font-size:44px;font-weight:800;text-transform:uppercase;line-height:.9;}
#carTag .pi{display:flex;align-items:center;gap:8px;}
#panel{background:rgba(21,24,29,.94);border-left:1px solid var(--line);overflow-y:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) 40px 18px;display:flex;flex-direction:column;gap:16px;backdrop-filter:blur(6px);}
#panel h2{font-size:30px;text-transform:uppercase;font-weight:800;}
#panel .sub{color:var(--muted);font-size:14px;line-height:1.4;margin-top:2px;}
.section{display:flex;flex-direction:column;gap:10px;}
.section > .label{border-bottom:1px solid var(--line);padding-bottom:6px;}

.badge{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:4px;font-family:var(--f-display);font-weight:800;font-size:16px;color:#0d0f12;}
.cls-D{background:var(--cD);} .cls-C{background:var(--cC);} .cls-B{background:var(--cB);} .cls-A{background:var(--cA);} .cls-S{background:var(--cS);} .cls-X{background:var(--cX);}
.pi-num{font-family:var(--f-mono);font-weight:700;font-size:15px;}

.card{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;}
.card.sel{border-color:var(--accent);}
.card .top{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;}
.card .nm{font-family:var(--f-display);font-size:21px;font-weight:700;text-transform:uppercase;line-height:1;}
.card .yr{color:var(--muted);font-size:13px;}
.card .price{font-family:var(--f-mono);font-weight:700;color:var(--good);}
.card .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.card .specs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.spec{display:flex;flex-direction:column;gap:2px;}
.spec .v{font-family:var(--f-mono);font-size:13px;font-weight:700;}
.spec .label{font-size:9.5px;}
.bars{display:grid;grid-template-columns:110px 1fr 44px;gap:6px 10px;align-items:center;font-size:13px;}
.bar{height:8px;background:#0b0d10;border-radius:4px;overflow:hidden;border:1px solid var(--line);}
.bar i{display:block;height:100%;background:var(--steel);}
.bar.cond i{background:var(--good);}
.bar.cond.mid i{background:var(--warn);}
.bar.cond.low i{background:var(--bad);}
.bar .gain{background:var(--accent);display:inline-block;}
.condpills{display:flex;gap:4px;flex-wrap:wrap;}
.pill{font-size:11px;font-weight:600;padding:2px 6px;border-radius:3px;background:#0b0d10;border:1px solid var(--line);}
.pill.good{color:var(--good);} .pill.mid{color:var(--warn);} .pill.low{color:var(--bad);}
.note{font-size:13px;color:var(--muted);line-height:1.4;}
.warnbox{border:1px solid #5c4413;background:#21190a;color:#ffd98a;padding:8px 10px;border-radius:6px;font-size:13px;line-height:1.35;}

.upg{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel2);}
.upg .nm{font-weight:700;font-size:15px;}
.upg .desc{font-size:12.5px;color:var(--muted);grid-column:1/2;}
.pips{display:flex;gap:4px;}
.pips i{width:20px;height:6px;border-radius:2px;background:#0b0d10;border:1px solid var(--line);}
.pips i.on{background:var(--accent);border-color:var(--accent);}

.swatches{display:flex;flex-wrap:wrap;gap:6px;}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);}
.sw.on{border-color:var(--fg);}
.seg{display:flex;flex-wrap:wrap;gap:6px;}
.seg button{padding:6px 10px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer;font-weight:600;font-size:13px;}
.seg button.on{border-color:var(--accent);color:var(--accent);}

.tabs{display:flex;gap:4px;flex-wrap:wrap;}
.tabs button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;border-radius:5px;padding:4px 10px;font-family:var(--f-display);font-weight:800;font-size:18px;}
.tabs button.on{color:#0d0f12;}
.event{border:1px solid var(--line);border-radius:8px;background:var(--panel2);display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px;}
.event .nm{font-family:var(--f-display);font-size:21px;font-weight:700;text-transform:uppercase;line-height:1;}
.event .meta{font-size:12.5px;color:var(--muted);}
.event .prizes{display:flex;gap:10px;font-family:var(--f-mono);font-size:12.5px;}
.event .prizes b{color:var(--good);}
.event .go{grid-row:1/4;grid-column:2;align-self:center;}
.medal{font-family:var(--f-mono);font-size:11px;padding:1px 5px;border-radius:3px;border:1px solid var(--line);}
.medal.g{color:#ffd23f;border-color:#6e5a14;} .medal.s{color:#cfd6df;} .medal.b{color:#d89a63;}

.job{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:12px;display:flex;flex-direction:column;gap:6px;}
.job .who{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);}
.job .complaint{font-size:15px;font-weight:600;line-height:1.3;}
.job .complaint::before{content:"“";color:var(--accent);} .job .complaint::after{content:"”";color:var(--accent);}
.stars{color:var(--warn);letter-spacing:2px;}
.paytag{font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--good);border:1px solid #235c3c;border-radius:5px;padding:3px 8px;white-space:nowrap;}
.bar.rep{height:10px;} .bar.rep i{background:var(--warn);}
.ladder{display:flex;flex-direction:column;gap:3px;}
.rung{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:6px 10px;border-radius:6px;border:1px solid transparent;color:var(--muted);}
.rung .n{font-size:13px;text-align:center;}
.rung .nm2{display:flex;flex-direction:column;font-weight:600;font-size:14px;min-width:0;}
.rung .nm2 .note{font-weight:400;font-size:12px;}
.rung .p{font-size:13px;}
.rung.done{color:var(--fg);} .rung.done .p{color:var(--good);}
.rung.now{color:var(--fg);background:var(--panel2);border-color:var(--warn);} .rung.now .n{color:var(--warn);} .rung.now .p{color:var(--good);font-weight:700;}
.levelup{display:flex;flex-direction:column;gap:3px;border:1px solid #6e5a14;background:#211c0a;border-radius:8px;padding:10px 12px;}
.levelup b{font-family:var(--f-display);font-size:24px;text-transform:uppercase;color:var(--warn);line-height:1;}
.levelup span:last-child{font-size:14px;}

/* ---------- modal / toast ---------- */
#modal{display:grid;place-items:center;background:rgba(5,6,8,.72);z-index:50;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto;}
#modal .box h2{font-size:34px;text-transform:uppercase;font-weight:800;}
#modal .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
#toasts{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:80;pointer-events:none;align-items:center;}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);padding:9px 14px;border-radius:6px;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:tin .2s ease-out;}
.toast.good{border-left-color:var(--good);} .toast.bad{border-left-color:var(--bad);}
@keyframes tin{from{transform:translateY(-8px);opacity:0;}}
.results{display:flex;flex-direction:column;gap:4px;}
.results .r{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:6px 8px;border-radius:5px;background:var(--panel2);align-items:center;font-size:14px;}
.results .r.me{outline:1px solid var(--accent);}
.results .r .p{font-family:var(--f-display);font-weight:800;font-size:20px;}

/* ---------- race HUD ---------- */
#hud{pointer-events:none;font-family:var(--f-display);}
#hud .tl{position:absolute;left:max(18px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 8px #000;}
#hud .pos{font-size:64px;font-weight:800;line-height:.85;}
#hud .pos small{font-size:28px;color:var(--muted);}
#hud .lap{font-size:24px;font-weight:700;letter-spacing:.04em;}
#hud .time{font-family:var(--f-mono);font-size:16px;}
#hud .br{position:absolute;right:max(22px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;text-shadow:0 2px 8px #000;}
#hud .spd{font-size:84px;font-weight:800;line-height:.8;font-variant-numeric:tabular-nums;}
#hud .unit{font-size:16px;color:var(--muted);letter-spacing:.2em;}
#hud .gear{font-family:var(--f-mono);font-size:22px;font-weight:700;color:var(--accent);}
#hud .rpm{width:220px;height:8px;background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:6px;}
#hud .rpm i{display:block;height:100%;background:linear-gradient(90deg,var(--steel),var(--accent) 80%,var(--bad));}
#minimap{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));width:190px;height:190px;background:rgba(10,12,15,.55);border:1px solid var(--line);border-radius:8px;}
#hud .dmg{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:3px;font-family:var(--f-body);font-size:12px;background:rgba(10,12,15,.55);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:170px;}
#hud .dmg .row{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center;}
#hud .center{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-size:120px;font-weight:800;text-shadow:0 4px 30px #000;}
#hud .msg{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:30px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 10px #000;white-space:nowrap;}
#hud .help{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-family:var(--f-body);font-size:12.5px;color:var(--muted);background:rgba(10,12,15,.6);padding:5px 10px;border-radius:5px;white-space:nowrap;}
#hud .tach{position:absolute;left:50%;bottom:calc(60px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(520px,80vw);display:flex;flex-direction:column;gap:6px;align-items:center;}
#hud .tach .tbar{width:100%;height:22px;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden;}
#hud .tach .tbar i{position:absolute;left:0;top:0;bottom:0;background:var(--steel);}
#hud .tach .tbar .zone{position:absolute;top:0;bottom:0;background:rgba(61,220,132,.28);border-left:2px solid var(--good);border-right:2px solid var(--good);}
#hud .tach .lights{display:flex;gap:6px;}
#hud .tach .lights b{width:16px;height:16px;border-radius:50%;background:#222;border:1px solid #444;}
#hud .tach .lights b.g{background:var(--good);box-shadow:0 0 10px var(--good);} #hud .tach .lights b.y{background:var(--warn);box-shadow:0 0 10px var(--warn);} #hud .tach .lights b.r{background:var(--bad);box-shadow:0 0 10px var(--bad);}
#hud .tree{position:absolute;left:50%;top:12%;transform:translateX(-50%);display:flex;gap:10px;}
#hud .tree b{width:34px;height:34px;border-radius:50%;background:#1d1f22;border:2px solid #333;}
#hud .tree b.y{background:var(--warn);box-shadow:0 0 18px var(--warn);} #hud .tree b.g{background:var(--good);box-shadow:0 0 22px var(--good);} #hud .tree b.r{background:var(--bad);}
#hud .flash{position:absolute;inset:0;background:rgba(255,40,40,.0);transition:background .25s;}
#pause{display:grid;place-items:center;background:rgba(5,6,8,.7);z-index:40;}
#pause .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:10px;min-width:260px;}

/* ---------- repair shop ---------- */
#shop{background:radial-gradient(ellipse at 50% 30%,#1b1f25 0%,#0d0f12 70%);display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto 1fr;z-index:20;}
#shop .head{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);}
#shop .head .t{font-family:var(--f-display);font-size:26px;font-weight:800;text-transform:uppercase;}
#shop .head .timer{font-family:var(--f-mono);font-size:20px;font-weight:700;}
#shop .head .spacer{flex:1;}
#shop .stage{position:relative;display:grid;place-items:center;overflow:hidden;padding:12px;}
#shop .side{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
#shop svg{max-width:100%;max-height:100%;}
.zone{cursor:pointer;}
.zone rect,.zone circle,.zone ellipse{transition:fill .15s,stroke .15s;}
.zone:hover rect,.zone:hover circle,.zone:hover ellipse{stroke:var(--accent);stroke-width:3;}
.zone text{pointer-events:none;}
.workbench{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:640px;}
.workbench .title{font-family:var(--f-display);font-size:30px;font-weight:800;text-transform:uppercase;text-align:center;}
.workbench .hint{color:var(--muted);text-align:center;max-width:52ch;line-height:1.4;}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;}
.shelf button{border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:8px;padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;}
.shelf button:hover{border-color:var(--accent);}
.shelf button b{font-size:15px;}
.shelf button span{font-family:var(--f-mono);font-size:13px;color:var(--good);}
.torque{width:100%;max-width:520px;height:46px;position:relative;background:#0b0d10;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.torque .ok{position:absolute;top:0;bottom:0;background:rgba(61,220,132,.3);border-left:2px solid var(--good);border-right:2px solid var(--good);}
.torque .over{position:absolute;top:0;bottom:0;right:0;background:rgba(255,77,77,.18);}
.torque .needle{position:absolute;top:-4px;bottom:-4px;width:4px;transform:translateX(-50%);background:var(--fg);box-shadow:0 0 8px #fff;}
.meter{width:60px;height:240px;border:2px solid var(--line);border-radius:6px;background:#0b0d10;position:relative;overflow:hidden;}
.meter i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#6b4a12,#c79a2d);}
.meter .mk{position:absolute;left:-2px;right:-2px;height:0;border-top:2px dashed var(--fg);}
.meter .mk span{position:absolute;right:calc(100% + 8px);top:-9px;font-size:11px;font-family:var(--f-mono);color:var(--muted);white-space:nowrap;}
.zonelist{display:flex;flex-direction:column;gap:6px;}
.zonelist .z{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);font-size:14px;}
.zonelist .z.fault{border-color:#6b2a2a;}
.zonelist .z.fixed{border-color:#235c3c;}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;}
.kv .v{font-family:var(--f-mono);text-align:right;}

@media (max-width:900px){
  #hub{grid-template-columns:1fr;grid-template-rows:auto auto 34vh 1fr;}
  #nav{flex-direction:row;width:auto;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));}
  #nav button{font-size:16px;padding:6px 10px;white-space:nowrap;}
  #nav button .k{display:none;}
  #panel{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));}
  #carTag .model{font-size:30px;}
  #shop{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;}
  #shop .side{border-left:0;border-top:1px solid var(--line);max-height:38vh;}
  #topbar .brand{font-size:20px;}
  .stat-chip.hide-sm{display:none;}
  #minimap{width:120px;height:120px;}
  #hud .spd{font-size:56px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

<script>
'use strict';
/* =====================================================================
   GARAGE KINGS — data, stats, economy, save
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const uid = () => Math.random().toString(36).slice(2, 9);
const fmt$ = n => (n < 0 ? '-$' : '$') + Math.round(Math.abs(n)).toLocaleString('en-US');
const fmtTime = t => { if (!isFinite(t)) return '--:--.--'; const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- body styles drive the 3D model + aero ---------- */
const BODIES = {

  truck:    { L: 5.3,  W: 2.0,  top: 1.2,  nose: 0.95, tail: 1.15, cab: [-0.5, 1.2, 0.85, -0.45], roof: 1.92, wb: 3.3,  wr: 0.42, cda: 1.25, bed: true },
  suv:      { L: 4.7,  W: 1.9,  top: 1.12, nose: 0.85, tail: 1.1,  cab: [-2.25, 1.0, 0.25, -2.2], roof: 1.78, wb: 2.8,  wr: 0.39, cda: 0.9 }
};

/* ---------- car catalogue (real cars) ----------
   hp, kg, grip (~lateral g), brake (~decel g), price (new / reference value) */
const CARS = {
  civic99:   { make: 'Honda', name: 'Civic EX', year: 1999, body: 'hatch', hp: 127, kg: 1150, grip: 0.85, brake: 0.85, price: 4200, drive: 'FWD', redline: 7200, used: true },
  miata04:   { make: 'Mazda', name: 'MX-5 Miata', year: 2004, body: 'roadster', hp: 142, kg: 1070, grip: 0.92, brake: 0.9, price: 7500, drive: 'RWD', redline: 7000, used: true },
  gti02:     { make: 'Volkswagen', name: 'Golf GTI', year: 2002, body: 'hatch', hp: 180, kg: 1300, grip: 0.88, brake: 0.86, price: 6800, drive: 'FWD', redline: 6800, used: true },
  mustang98: { make: 'Ford', name: 'Mustang GT', year: 1998, body: 'muscle', hp: 225, kg: 1550, grip: 0.84, brake: 0.82, price: 8500, drive: 'RWD', redline: 6000, used: true },
  s2000_03:  { make: 'Honda', name: 'S2000', year: 2003, body: 'roadster', hp: 240, kg: 1270, grip: 0.95, brake: 0.92, price: 21000, drive: 'RWD', redline: 9000, used: true },
  wrx06:     { make: 'Subaru', name: 'Impreza WRX', year: 2006, body: 'sedan', hp: 230, kg: 1430, grip: 0.92, brake: 0.88, price: 11000, drive: 'AWD', redline: 7000, used: true },
  f150_08:   { make: 'Ford', name: 'F-150', year: 2008, body: 'truck', hp: 300, kg: 2200, grip: 0.78, brake: 0.78, price: 9000, drive: 'RWD', redline: 5800, used: true },
  e46m3:     { make: 'BMW', name: 'M3 (E46)', year: 2004, body: 'coupe', hp: 333, kg: 1570, grip: 0.97, brake: 0.95, price: 24000, drive: 'RWD', redline: 8000, used: true },
  supra97:   { make: 'Toyota', name: 'Supra Turbo', year: 1997, body: 'coupe', hp: 320, kg: 1560, grip: 0.93, brake: 0.92, price: 55000, drive: 'RWD', redline: 6800, used: true },
  gtr09:     { make: 'Nissan', name: 'GT-R', year: 2009, body: 'coupe', hp: 480, kg: 1740, grip: 1.05, brake: 1.0, price: 60000, drive: 'AWD', redline: 7000, used: true },

  civicsi:   { make: 'Honda', name: 'Civic Si', year: 2026, body: 'sedan', hp: 200, kg: 1330, grip: 0.95, brake: 0.95, price: 31000, drive: 'FWD', redline: 7000 },
  gr86:      { make: 'Toyota', name: 'GR86', year: 2026, body: 'coupe', hp: 228, kg: 1270, grip: 0.98, brake: 0.97, price: 32000, drive: 'RWD', redline: 7500 },
  mx5:       { make: 'Mazda', name: 'MX-5 Miata', year: 2026, body: 'roadster', hp: 181, kg: 1060, grip: 0.98, brake: 0.97, price: 30000, drive: 'RWD', redline: 7500 },
  golfgti:   { make: 'Volkswagen', name: 'Golf GTI', year: 2026, body: 'hatch', hp: 241, kg: 1450, grip: 0.96, brake: 0.95, price: 34000, drive: 'FWD', redline: 6800 },
  wrx:       { make: 'Subaru', name: 'WRX', year: 2026, body: 'sedan', hp: 271, kg: 1540, grip: 0.99, brake: 0.96, price: 36000, drive: 'AWD', redline: 6500 },
  mustang:   { make: 'Ford', name: 'Mustang GT', year: 2026, body: 'muscle', hp: 480, kg: 1750, grip: 1.0, brake: 1.0, price: 47000, drive: 'RWD', redline: 7500 },
  camaro:    { make: 'Chevrolet', name: 'Camaro SS', year: 2024, body: 'muscle', hp: 455, kg: 1720, grip: 1.0, brake: 1.0, price: 46000, drive: 'RWD', redline: 6500 },
  supra:     { make: 'Toyota', name: 'GR Supra', year: 2026, body: 'coupe', hp: 382, kg: 1540, grip: 1.02, brake: 1.02, price: 58000, drive: 'RWD', redline: 7000 },
  m3:        { make: 'BMW', name: 'M3 Competition', year: 2026, body: 'sedan', hp: 503, kg: 1730, grip: 1.05, brake: 1.05, price: 82000, drive: 'AWD', redline: 7200 },
  gtr:       { make: 'Nissan', name: 'GT-R Nismo', year: 2024, body: 'coupe', hp: 600, kg: 1730, grip: 1.12, brake: 1.1, price: 220000, drive: 'AWD', redline: 7100 },
  p911:      { make: 'Porsche', name: '911 Carrera S', year: 2026, body: 'fastback', hp: 473, kg: 1530, grip: 1.12, brake: 1.12, price: 140000, drive: 'RWD', redline: 7500 },
  z06:       { make: 'Chevrolet', name: 'Corvette Z06', year: 2026, body: 'super', hp: 670, kg: 1560, grip: 1.18, brake: 1.15, price: 115000, drive: 'RWD', redline: 8600 },
  huracan:   { make: 'Lamborghini', name: 'Huracán EVO', year: 2024, body: 'super', hp: 631, kg: 1420, grip: 1.18, brake: 1.16, price: 260000, drive: 'AWD', redline: 8500 },
  f296:      { make: 'Ferrari', name: '296 GTB', year: 2026, body: 'super', hp: 819, kg: 1470, grip: 1.2, brake: 1.18, price: 330000, drive: 'RWD', redline: 8500 },
  gt3rs:     { make: 'Porsche', name: '911 GT3 RS', year: 2026, body: 'fastback', hp: 518, kg: 1450, grip: 1.3, brake: 1.25, price: 245000, drive: 'RWD', redline: 9000 },
  chiron:    { make: 'Bugatti', name: 'Chiron Sport', year: 2022, body: 'hyper', hp: 1479, kg: 1995, grip: 1.25, brake: 1.25, price: 3200000, drive: 'AWD', redline: 6700 }
};
for (const k in CARS) CARS[k].key = k;

/* ---------- classes ---------- */
const CLASSES = [
  { id: 'D', max: 250, entry: 200,   prize: [1500, 800, 400],        diff: 0 },
  { id: 'C', max: 350, entry: 600,   prize: [4000, 2000, 1000],      diff: 1 },
  { id: 'B', max: 450, entry: 1500,  prize: [9000, 4500, 2200],      diff: 2 },
  { id: 'A', max: 550, entry: 4000,  prize: [22000, 11000, 5500],    diff: 3 },
  { id: 'S', max: 700, entry: 10000, prize: [55000, 27000, 13000],   diff: 4 },
  { id: 'X', max: 999, entry: 30000, prize: [150000, 75000, 35000],  diff: 5 }
];
const classOf = pi => CLASSES.find(c => pi <= c.max) || CLASSES[CLASSES.length - 1];

/* ---------- upgrades ---------- */
const UPGRADES = [
  { id: 'engine', name: 'Engine tune', desc: 'Intake, exhaust and ECU map. +8% power per level.', f: 1.0 },
  { id: 'turbo',  name: 'Forced induction', desc: 'Bigger turbo or supercharger. +12% power per level.', f: 1.6 },
  { id: 'trans',  name: 'Transmission', desc: 'Short-shift gearbox and LSD. Quicker shifts and launches.', f: 0.8 },
  { id: 'weight', name: 'Weight reduction', desc: 'Carbon panels, lighter seats. −5% weight per level.', f: 1.1 },
  { id: 'tires',  name: 'Tires', desc: 'Stickier compound. +0.05 g grip per level.', f: 0.7 },
  { id: 'susp',   name: 'Suspension', desc: 'Coilovers and sway bars. +0.03 g grip per level.', f: 0.8 },
  { id: 'brakes', name: 'Brakes', desc: 'Big brake kit. Stops harder, later braking.', f: 0.6 }
];
const LEVEL_NAMES = ['Stock', 'Street', 'Sport', 'Race'];
const LEVEL_MULT = [0, 1, 2.3, 4.8];
function upgradeCost(car, id, level) {
  const u = UPGRADES.find(x => x.id === id);
  const base = CARS[car.model];
  return Math.round((350 + Math.min(base.price, 400000) * 0.035) * u.f * LEVEL_MULT[level] / 10) * 10;
}

/* ---------- condition parts ---------- */
const PARTS = [
  { id: 'engine', name: 'Engine' },
  { id: 'trans',  name: 'Gearbox' },
  { id: 'susp',   name: 'Suspension' },
  { id: 'brakes', name: 'Brakes' },
  { id: 'tires',  name: 'Tires' },
  { id: 'body',   name: 'Body' }
];

/* ---------- stats ---------- */
function deriveStats(car, useCond = true) {
  const b = CARS[car.model], u = car.upgrades, c = car.cond;
  const cf = (k, lo) => useCond ? lo + (1 - lo) * (c[k] / 100) : 1;
  const hp = b.hp * (1 + 0.08 * u.engine) * (1 + 0.12 * u.turbo) * cf('engine', 0.55);
  const kg = b.kg * (1 - 0.05 * u.weight);
  const grip = (b.grip + 0.05 * u.tires + 0.03 * u.susp) * cf('tires', 0.72) * cf('susp', 0.85);
  const brake = (b.brake + 0.07 * u.brakes) * cf('brakes', 0.6);
  const accel = (1 + 0.04 * u.trans) * cf('trans', 0.7);
  const body = BODIES[b.body];
  const cda = body.cda * (car.custom.spoiler === 'gt' ? 1.05 : 1) * (useCond ? 1 + (100 - c.body) / 400 : 1);
  return { hp, kg, grip, brake, accel, trans: u.trans, cda, drive: b.drive, redline: b.redline, body: b.body };
}
function piOf(st) {
  const pw = st.hp / st.kg * 1000;
  return Math.round(clamp(pw * 0.9 + (st.grip - 0.8) * 400 + (st.brake - 0.8) * 100 + 60 + st.trans * 5 + (st.drive === 'AWD' ? 8 : 0), 100, 999));
}
const carPI = car => piOf(deriveStats(car, false));
const topSpeed = st => Math.pow(st.hp * 745.7 * 0.92 / (0.5 * 1.2 * st.cda), 1 / 3); // m/s
const avgCond = car => PARTS.reduce((s, p) => s + car.cond[p.id], 0) / PARTS.length;
const condClass = v => v >= 75 ? 'good' : v >= 45 ? 'mid' : 'low';
function carValue(car) {
  return Math.round((car.baseValue * (0.35 + 0.65 * avgCond(car) / 100) + car.spent * 0.4) / 50) * 50;
}
const carName = car => { const b = CARS[car.model]; return b.year + ' ' + b.make + ' ' + b.name; };

/* ---------- default customization ---------- */
const PAINTS = ['#c8102e', '#f2f2ee', '#111316', '#1f4fd1', '#ffcc00', '#ff7a1a', '#2e8b57', '#7d8590', '#5b2a86', '#00a6c8', '#8a1c1c', '#c0c7ce'];
const RIMS = ['#c9ced6', '#1a1c1f', '#d4a72c', '#7b818a', '#ffffff', '#c8102e'];
const SPOILERS = [{ id: 'none', name: 'None', cost: 0 }, { id: 'lip', name: 'Ducktail lip', cost: 600 }, { id: 'wing', name: 'Street wing', cost: 1400 }, { id: 'gt', name: 'GT wing', cost: 3200 }];
const STRIPES = [{ id: 'none', name: 'None', cost: 0 }, { id: 'center', name: 'Center stripe', cost: 450 }, { id: 'twin', name: 'Twin stripes', cost: 650 }, { id: 'side', name: 'Side stripe', cost: 500 }];

function newCar(model, opts = {}) {
  const b = CARS[model];
  return {
    id: uid(), model,
    upgrades: { engine: 0, turbo: 0, trans: 0, weight: 0, tires: 0, susp: 0, brakes: 0 },
    cond: opts.cond || { engine: 100, trans: 100, susp: 100, brakes: 100, tires: 100, body: 100 },
    custom: { paint: opts.paint || pick(PAINTS), rims: RIMS[0], spoiler: 'none', stripe: 'none', stripeColor: '#f2f2ee', number: randi(2, 99), tint: 0.5 },
    baseValue: opts.baseValue || Math.round(b.price * 0.82),
    spent: 0
  };
}
function randomCond(lo, hi) {
  const o = {};
  for (const p of PARTS) o[p.id] = randi(lo, hi);
  // one or two parts are usually really bad
  for (let i = 0; i < randi(0, 2); i++) o[pick(PARTS).id] = randi(12, 40);
  return o;
}

/* ---------- used market ---------- */
function makeListing(rep) {
  const usedKeys = Object.keys(CARS).filter(k => CARS[k].used);
  const newKeys = Object.keys(CARS).filter(k => !CARS[k].used && CARS[k].price < 400000 + rep * 25000);
  let model;
  if (Math.random() < 0.65) model = pick(usedKeys); else model = pick(newKeys);
  const b = CARS[model];
  const depr = b.used ? rand(0.85, 1.05) : rand(0.5, 0.72);
  const car = newCar(model, { cond: randomCond(30, 85), baseValue: Math.round(b.price * depr / 50) * 50 });
  const seller = pick(['Private seller', 'Auction lot', 'Estate sale', 'Repo yard', 'Online listing', 'Barn find']);
  const note = pick(['Runs and drives', 'Needs some work', 'Daily driven', 'Sat for a year', 'Minor fender bender', 'Smells a bit like gas', 'Mechanic special', 'Clean title']);
  return { id: uid(), car, price: Math.round(carValue(car) * rand(0.92, 1.08) / 50) * 50, seller, note };
}

/* ---------- save ---------- */
const SAVE_KEY = 'garageKings.save.v1';
let G = null; // game state
function freshState() {
  const starter = newCar('civic99', { cond: { engine: 72, trans: 78, susp: 58, brakes: 52, tires: 48, body: 64 }, baseValue: 4200, paint: '#7d8590' });
  starter.custom.number = 7;
  return {
    v: 1, money: 6000, rep: 0, repXP: 0,
    cars: [starter], activeId: starter.id, slots: 3,
    shop: { impact: false, scanner: false, torque: false, lift: false, supplier: false },
    market: [], jobs: [], records: {},
    stats: { races: 0, wins: 0, podiums: 0, jobs: 0, earned: 0, flipped: 0 },
    settings: { mute: false }, created: Date.now()
  };
}
function saveGame() {
  if (!G) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) { /* storage unavailable */ }
}
function loadGame() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (!s) return null;
    const d = JSON.parse(s);
    if (!d || d.v !== 1 || !Array.isArray(d.cars)) return null;
    const f = freshState();
    for (const k in f) if (d[k] === undefined) d[k] = f[k];
    for (const k in f.shop) if (d.shop[k] === undefined) d.shop[k] = false;
    return d;
  } catch (e) { return null; }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }

let _blob = null;
function blobTex() {
  if (_blob) return _blob;
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'); const gr = x.createRadialGradient(32, 32, 4, 32, 32, 32);

}
function disposeTree(o) {
  o.traverse(n => {
    if (n.geometry && !n.geometry.userData.keep) n.geometry.dispose();
    if (n.material) (Array.isArray(n.material) ? n.material : [n.material]).forEach(m => {
      if (Object.values(MAT).includes(m) || m.userData.keep) return;
      for (const k of ['map', 'emissiveMap']) if (m[k] && m[k] !== _blob && !(m[k].userData && m[k].userData.keep)) m[k].dispose();

/* ---------- audio (engine synth + blips) ---------- */
const Sound = {
  ctx: null, eng: null,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = G && G.settings.mute ? 0 : 0.5; this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  setMute(m) { if (this.master) this.master.gain.value = m ? 0 : 0.5; },
  startEngine() {
    if (!this.ctx || this.eng) return;
    const c = this.ctx;
    const o1 = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o1.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = 0;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(this.master); o1.start(); o2.start();
    this.eng = { o1, o2, f, g };
  },
  engine(rpmFrac, load) {
    if (!this.eng) return;
    const t = this.ctx.currentTime, hz = 40 + rpmFrac * 180;
    this.eng.o1.frequency.setTargetAtTime(hz, t, 0.03);
    this.eng.o2.frequency.setTargetAtTime(hz * 0.5, t, 0.03);
    this.eng.f.frequency.setTargetAtTime(500 + rpmFrac * 1600 + load * 600, t, 0.05);
    this.eng.g.gain.setTargetAtTime(0.06 + load * 0.08, t, 0.05);
  },
  stopEngine() { if (!this.eng) return; try { this.eng.o1.stop(); this.eng.o2.stop(); } catch (e) { } this.eng = null; },
  blip(freq = 600, dur = 0.08, type = 'square', vol = 0.15) {
    if (!this.ctx) return;
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(this.master); o.start(); o.stop(c.currentTime + dur + 0.02);
  },
  crash(v) {
    if (!this.ctx) return;
    const c = this.ctx, n = c.sampleRate * 0.25, buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = Math.min(0.6, 0.1 + v * 0.03);
    s.buffer = buf; s.connect(f); f.connect(g); g.connect(this.master); s.start();
  },
  cash() { this.blip(880, 0.07, 'triangle', 0.2); setTimeout(() => this.blip(1320, 0.12, 'triangle', 0.2), 70); }
};

function carDesign(model) {

  const def = (k, v) => { if (d[k] === undefined) d[k] = v; };

  def('hlW', round ? 0.2 : 0.36); def('hlH', round ? 0.2 : 0.12); def('hlX', round ? 0.68 : 0.62); def('hlY', d.nose - 0.06);
  def('tlW', 0.34); def('tlH', 0.11); def('tlX', 0.66); def('tlY', d.tail - 0.11);

/* Center-line top silhouette as (f, height) points. */
function designTop(d) {
  const n = d.nose, start = [[0, n - 0.12], [0.012, n - 0.03], [0.04, n]];
  switch (d.type) {

      return start.concat([[d.cowlF * 0.55, d.hood], [d.cowlF, d.cowlH], [d.tub[1] + 0.03, d.cowlH - 0.005], [0.95, d.deckH], [0.985, d.deckH - 0.05], [1, d.tail]]);

    case 'mid':
      return start.concat([[d.cowlF * 0.55, d.hood], [d.cowlF, d.cowlH], [d.roofF, d.H], [(d.roofF + d.roofR) / 2, d.H + 0.005], [d.roofR, d.H - 0.03], [d.deckF, d.deckH], [0.97, d.deckH - 0.02], [0.99, d.tail], [1, d.tail - 0.05]]);

/* =====================================================================
   CAR MODELS — every car is built from its real dimensions:
   a smooth lofted body (curved panels, wheel arches, fender bulges, glass
   cabin with pillars), decals shaped to the body for lights, grilles and
   vents, detailed wheels with brakes, mirrors, interiors, wings, exhausts.
   ===================================================================== */
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function smax(a, b, k) { const m = Math.max(a, b); return m + k * Math.log(Math.exp((a - m) / k) + Math.exp((b - m) / k)); }
function makePchip(pts) { // monotone cubic: smooth, never overshoots
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), n = xs.length, h = [], m = [], d = new Array(n);
  for (let i = 0; i < n - 1; i++) { h[i] = xs[i + 1] - xs[i]; m[i] = (ys[i + 1] - ys[i]) / h[i]; }
  d[0] = m[0]; d[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) {
    if (m[i - 1] * m[i] <= 0) d[i] = 0;
    else { const w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1]; d[i] = (w1 + w2) / (w1 / m[i - 1] + w2 / m[i]); }
  }
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const t = (x - xs[i]) / h[i], t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h[i] * d[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h[i] * d[i + 1];
  };
}

/* ---------- body shape: analytic description used for both the mesh and decal placement ---------- */
function makeShape(d) {
  const L = d.L, W2 = d.W2, top = makePchip(designTop(d));
  const zOf = f => L / 2 - f * L;
  const fRear = d.fAx + d.wb / L, zF = zOf(d.fAx), zR = zOf(fRear);
  const R = d.wr + (d.type === 'truck' ? 0.06 : 0.032);
  const trackX = W2 - d.tw / 2 - 0.012;
  const innerX = trackX - d.tw / 2 - 0.05;
  const cabin = d.type !== 'roadster';
  const cabF = d.cowlF, cabR = d.deckF ?? d.cowlF;
  const roofF = d.roofF ?? d.cowlF, roofR = d.roofR ?? d.cowlF;
  const flMax = Math.max(d.flare, d.flareR);
  const tuck = d.type === 'truck' ? 0.03 : 0.07, lean = d.type === 'truck' ? 0.012 : 0.028;
  const corner = (s, r, p) => s >= r ? 1 : Math.pow(Math.max(0, 1 - Math.pow(1 - s / r, p)), 1 / p);
  const hwAt = f => {
    const z = zOf(f);
    const base = (W2 - flMax) * (1 - 0.03 * (1 - sstep(0, 0.35, f)));
    const fl = d.flare * Math.exp(-(((z - zF) / 0.55) ** 2)) + d.flareR * Math.exp(-(((z - zR) / 0.6) ** 2));
    return (base + fl) * corner(f * L, d.rF, d.pF) * corner((1 - f) * L, d.rR, d.pR);
  };

  const fenderY = f => {
    const z = zOf(f), Rf = R + 0.45; let y = -9;
    for (const zc of [zF, zR]) { const dz = z - zc; if (Math.abs(dz) < Rf) y = Math.max(y, d.wr - 0.01 + R + 0.05 + d.fend - (Rf - Math.sqrt(Rf * Rf - dz * dz))); }
    return y;
  };
  const tubAt = f => {
    if (d.tub && f > d.tub[0] && f < d.tub[1]) return d.tub[2];
    if (d.type === 'truck' && f > d.deckF + 0.002 && f < 0.985) return d.bedD;
    return 0;
  };
  const zoneAt = f => !cabin || f <= cabF ? 'front' : f < roofF ? 'ws' : f < roofR ? 'roof' : f < cabR ? 'back' : 'rear';
  function st(f) {
    const hw = hwAt(f), t = top(f);
    const inCab = cabin && f > cabF && f < cabR;

    const S = smax(inCab ? Math.min(t, belt) : t, fenderY(f), 0.035);
    const gh = inCab && t > S + 0.004;
    const T = gh ? t : Math.min(t, S);
    const h = gh ? T - S : 0;
    const r = Math.min(0.036, hw * 0.3);

    const span = Math.max(0.05, S - r - sillRef);

    const xs = sideX(S - r);
    const gw = clamp(Math.min(hw * d.gwR, xs - r - 0.012), 0, 9);
    const k = sstep(0, 0.12, h);
    const rw = lerp(gw, Math.max(0, Math.min(hw * d.rwR, gw - 0.02)), k);
    const rc = Math.min(0.035, h * 0.25, Math.max(0, gw - rw));
    const tub = tubAt(f);
    const crown = gh ? 0.035 : tub ? 0 : d.crown;
    return { f, z: zOf(f), hw, S, T, h, gh, r, bY, sillY, sideX, xs, gw, rw, rc, tub, crown, zone: zoneAt(f), aY: archY(f), creaseY: sillRef + 0.72 * span };
  }

  const warpZ = (f, y) => {

    z += d.slopeR * (y - d.tail * 0.55) * (1 - sstep(0, 0.14, 1 - f));

    if (y < s.bY - 1e-4) return -1;
    if (y <= s.S - s.r) return s.sideX(y);
    if (y <= s.S) { const dy = y - (s.S - s.r); return s.xs - s.r + Math.sqrt(Math.max(0, s.r * s.r - dy * dy)); }
    if (s.gh && y <= s.T) { const u = (y - s.S) / (s.T - s.S); return s.gw - (s.gw - s.rw) * Math.pow(u, 1.2); }

  };

    x = Math.abs(x);
    if (x >= s.xs - s.r) { const dx = x - (s.xs - s.r); return s.S - s.r + Math.sqrt(Math.max(0, s.r * s.r - dx * dx)); }
    if (x >= s.gw) return s.S;
    if (s.tub) return s.S - s.tub;
    if (s.gh) {
      if (x >= s.rw) return lerp(s.S, s.T, (s.gw - x) / Math.max(1e-3, s.gw - s.rw));

    return s.T + (s.S - s.T) * Math.pow(x / e, 2.2) + s.crown * (1 - (x / e) ** 2);
  };

  // where a horizontal ray at (x, y) meets the nose / tail
  // search only the overhangs, so the wheel arches never confuse the search
  const fHiF = d.fAx - (R + 0.03) / L, fLoR = fRear + (R + 0.03) / L;
  const frontF = (x, y) => { const ins = f => halfAt(st(f), y) >= Math.abs(x); return ins(fHiF) ? bisect(ins, 0, fHiF) : null; };
  const rearF = (x, y) => { const ins = f => halfAt(st(f), y) >= Math.abs(x); if (!ins(fLoR)) return null; let lo = fLoR, hi = 1; for (let i = 0; i < 26; i++) { const m = (lo + hi) / 2; if (ins(m)) lo = m; else hi = m; } return lo; };
  return { d, L, W2, st, zOf, warpZ, halfAt, topY, frontF, rearF, fRear, zF, zR, R, trackX, innerX, roofF, roofR, cabF, cabR };
}

/* ---------- lofted body mesh ---------- */
const NSTATION = 140;
function sectionPoints(sh, s) {
  const d = sh.d, P = [];
  const push = (x, y, tag) => P.push([Math.max(0, x), y, tag]);
  const xb = s.sideX(s.bY);
  const ix = Math.min(sh.innerX, xb * 0.8);
  push(0, d.floor, 'under'); push(ix, d.floor, 'under'); push(ix, Math.max(s.bY, d.floor), 'under');

function condBar(v) { return `<div class="bar cond ${condClass(v) === 'good' ? '' : condClass(v)}"><i style="width:${v}%"></i></div>`; }
function condPills(car) {

function ensureJobs() { const n = (G.shop.lift ? 5 : 3) + boardBonus(); while (G.jobs.length < n) G.jobs.push(makeJob()); }

function jobEstimate(j) { const F = FAULTS[j.faults[0].fid]; return Math.round((F.labor * j.mult * payMult() + F.cost * 1.3) / 10) * 10; }

/* ---------- Races ---------- */
const TRACKS = [
  { id: 'harbor', name: 'Harbor Loop', laps: 2, theme: 'harbor' },
  { id: 'canyon', name: 'Canyon Run', laps: 2, theme: 'canyon' },
  { id: 'city', name: 'Downtown Circuit', laps: 2, theme: 'city' }
];
const EVENT_NAMES = {
  D: ['Rookie Cup', 'Weekend Warriors', 'Junkyard Derby'], C: ['Sport Compact Series', 'Tuner Showdown', 'Canyon Kings'],
  B: ['Muscle & Steel', 'Grand Touring Cup', 'Midnight Run'], A: ['Pro Series', 'Track Day Elite', 'Euro Classic'],
  S: ['Supercar Challenge', 'Exotic Invitational', 'Velocity Open'], X: ['Hypercar Masters', 'Kings of the Road', 'Final Crown']
};
function eventsFor(cls) {
  const ci = CLASSES.findIndex(c => c.id === cls.id);
  const evs = TRACKS.map((t, i) => ({
    id: cls.id + '-' + t.id, type: 'circuit', cls, track: t, name: EVENT_NAMES[cls.id][i],
    diff: [0.78, 0.86, 0.94][i], laps: t.laps + (ci >= 3 ? 1 : 0),
    entry: Math.round(cls.entry * [1, 1.25, 1.6][i] / 50) * 50,
    prize: cls.prize.map(p => Math.round(p * [1, 1.3, 1.75][i] / 50) * 50)
  }));
  evs.push({ id: cls.id + '-drag', type: 'drag', cls, name: cls.id + '-Class Drag Strip', diff: 0.9, entry: Math.round(cls.entry * 0.6 / 50) * 50, prize: [Math.round(cls.prize[0] * 0.7 / 50) * 50] });
  return evs;
}
function panelRaces() {
  const car = activeCar(), pi = carPI(car), myCls = classOf(pi);
  if (!raceClassTab) raceClassTab = myCls.id;
  const cls = CLASSES.find(c => c.id === raceClassTab);
  const eligible = pi <= cls.max;
  const evs = eventsFor(cls);
  const dmg = avgCond(car);
  return `<div><h2>Race</h2><p class="sub">Your ${esc(CARS[car.model].name)} is ${classBadge(pi)}. You can enter its class or any higher class. Higher classes pay more, but the cars there are faster.</p></div>
  <div class="tabs">${CLASSES.map(c => `<button class="${c.id === raceClassTab ? 'on' : ''}" ${c.id === raceClassTab ? `style="background:var(--c${c.id});border-color:var(--c${c.id})"` : ''} data-act="rclass" data-c="${c.id}">${c.id}</button>`).join('')}</div>
  <div class="note">${cls.id} class: PI up to ${cls.max}.${eligible ? '' : ` <b style="color:var(--bad)">Your car is too fast for this class. Remove upgrades or drive a different car.</b>`}</div>
  ${dmg < 70 ? `<div class="warnbox">Your car is at ${Math.round(dmg)}% condition and will be slow. Crashes cause more damage.</div>` : ''}
  ${evs.map(e => {
    const rec = G.records[e.id];
    const medal = rec ? (rec === 1 ? '<span class="medal g">1st</span>' : rec === 2 ? '<span class="medal s">2nd</span>' : rec === 3 ? '<span class="medal b">3rd</span>' : `<span class="medal">${rec}th</span>`) : '';
    return `<div class="event"><div class="nm">${esc(e.name)} ${medal}</div>
      <div class="meta">${e.type === 'drag' ? 'Quarter mile · 1 rival · manual shifting' : `${esc(e.track.name)} · ${e.laps} laps · 6 cars`} · Entry ${fmt$(e.entry)}</div>
      <div class="prizes">${e.prize.map((p, i) => `<span>${['1st', '2nd', '3rd'][i]} <b>${fmt$(p)}</b></span>`).join('')}</div>
      <div class="go"><button class="btn primary" data-act="race" data-id="${e.id}" ${(!eligible || G.money < e.entry) ? 'disabled' : ''}>Race</button></div></div>`;
  }).join('')}
  <div class="note">Circuit: W/S or arrows to drive, Space for handbrake, C to change camera. Drag: hold W, press Shift or E to shift up.</div>`;
}

/* ---------- actions ---------- */
function bindPanel(p) {
  $$('[data-act]', p).forEach(el => el.addEventListener('click', () => doAct(el.dataset.act, el)));
}
function spend(n) { if (G.money < n) { toast('Not enough cash', 'bad'); return false; } G.money -= n; return true; }
function doAct(act, el) {
  const car = activeCar(), d = el.dataset;
  switch (act) {
    case 'gotab': tab = d.tab; break;
    case 'select': G.activeId = d.id; raceClassTab = null; break;
    case 'sell': {
      const c = G.cars.find(x => x.id === d.id), v = carValue(c);
      confirmBox('Sell car?', `Sell your ${esc(carName(c))} for <b>${fmt$(v)}</b>? Its upgrades go with it.`, 'Sell', () => {
        G.cars = G.cars.filter(x => x.id !== c.id); earn(v);
        if (c.boughtFor && v > c.boughtFor) G.stats.flipped++;
        if (G.activeId === c.id) G.activeId = G.cars[0].id;
        Sound.cash(); toast(`Sold for ${fmt$(v)}`, 'good'); renderHubUI();
      }, true);
      return;
    }
    case 'slot': { const cost = 10000 * (G.slots - 2); if (!spend(cost)) return; G.slots++; toast('New bay built', 'good'); break; }
    case 'buynew': {
      if (G.cars.length >= G.slots) { toast('Garage full. Sell a car or build a bay.', 'bad'); return; }
      const b = CARS[d.key];
      confirmBox('Buy new car?', `Buy a new ${b.year} ${esc(b.make)} ${esc(b.name)} for <b>${fmt$(b.price)}</b>?`, 'Buy it', () => {
        if (!spend(b.price)) return;
        const c = newCar(d.key); c.boughtFor = b.price; G.cars.push(c); G.activeId = c.id; raceClassTab = null;
        Sound.cash(); toast('Welcome to your new ' + b.name, 'good'); tab = 'garage'; renderHubUI();
      });
      return;
    }
    case 'buyused': {
      if (G.cars.length >= G.slots) { toast('Garage full. Sell a car or build a bay.', 'bad'); return; }
      const l = G.market.find(x => x.id === d.id);
      if (!spend(l.price)) return;
      l.car.boughtFor = l.price; G.cars.push(l.car); G.activeId = l.car.id; raceClassTab = null;
      G.market = G.market.filter(x => x.id !== l.id);
      Sound.cash(); toast('Bought. Take it to the shop to fix it up.', 'good'); tab = 'garage'; break;
    }
    case 'refreshmarket': if (!spend(100)) return; G.market = []; ensureMarket(); toast('New listings'); break;
    case 'upg': {
      const lv = car.upgrades[d.u], cost = upgradeCost(car, d.u, lv + 1);
      if (!spend(cost)) return;
      car.upgrades[d.u]++; car.spent += cost; Sound.blip(700, 0.06); Sound.blip(1050, 0.1);
      toast(`${UPGRADES.find(u => u.id === d.u).name}: ${LEVEL_NAMES[lv + 1]} installed`, 'good'); break;
    }
    case 'downg': car.upgrades[d.u]--; toast('Level removed'); break;
    case 'paint': if (car.custom.paint === d.c) return; if (!spend(500)) return; car.custom.paint = d.c; break;
    case 'paintcustom': { const c = $('#paintPick').value; if (!spend(800)) return; car.custom.paint = c; break; }
    case 'rims': if (car.custom.rims === d.c) return; if (!spend(300)) return; car.custom.rims = d.c; break;
    case 'spoiler': { const s = SPOILERS.find(x => x.id === d.v); if (car.custom.spoiler === s.id) return; if (!spend(s.cost)) return; car.custom.spoiler = s.id; break; }
    case 'stripe': { const s = STRIPES.find(x => x.id === d.v); if (car.custom.stripe === s.id) return; if (!spend(s.cost)) return; car.custom.stripe = s.id; break; }
    case 'stripecol': car.custom.stripeColor = d.c; break;
    case 'tint': if (!spend(150)) return; car.custom.tint = +d.v; break;
    case 'number': car.custom.number = clamp(parseInt($('#numInput').value) || 0, 0, 99); break;
    case 'shopupg': { const u = SHOP_UPGRADES.find(x => x.id === d.u); if (!spend(u.cost)) return; G.shop[u.id] = true; Sound.cash(); toast(u.name + ' bought', 'good'); break; }
    case 'startjob': startJob(G.jobs.find(j => j.id === d.id)); return;
    case 'declinejob': G.jobs = G.jobs.filter(j => j.id !== d.id); ensureJobs(); break;
    case 'ownrepair': startOwnRepair(car); return;
    case 'rclass': raceClassTab = d.c; break;
    case 'race': {
      const e = eventsFor(CLASSES.find(c => c.id === raceClassTab)).find(x => x.id === d.id);
      if (!spend(e.entry)) return;
      startEvent(e); return;
    }
  }
  renderHubUI();
}

function laborMult(model) { return 1 + Math.min(CARS[model].price, 400000) / 120000; }
function partPrice(c) { return Math.round(c * (G.shop.supplier ? 0.8 : 1)); }
function makeJob() {
  const lv = Math.min(MAX_REP_LV, repLevel() + (G.shop.lift ? 1 : 0));
  const tier = REP_LEVELS[lv];
  // favor the top of the allowed range so higher levels really bring pricier cars
  let models = Object.keys(CARS).filter(k => CARS[k].price <= tier.cap && (CARS[k].body !== 'hyper' || tier.hyper));
  const prices = models.map(k => CARS[k].price).sort((a, b) => a - b);
  const floor = prices[Math.floor(prices.length * Math.min(0.8, lv * 0.08))];
  if (Math.random() < 0.75) models = models.filter(k => CARS[k].price >= floor);
  const model = pick(models);
  const ids = Object.keys(FAULTS);
  const main = pick(ids);
  const faults = [mkFault(main)];
  const extra = Math.random() < 0.25 + lv * 0.045 ? 1 + (lv >= 4 && Math.random() < 0.4 ? 1 : 0) : 0;
  for (let i = 0; i < extra; i++) {
    const f = pick(ids.filter(x => !faults.some(y => y.fid === x)));
    faults.push(mkFault(f));
  }
  const m = laborMult(model);
  const est = faults.slice(0, 1).reduce((s, f) => s + FAULTS[f.fid].labor * m + FAULTS[f.fid].cost * 1.3, 0);
  return { id: uid(), customer: pick(CUSTOMERS), model, faults, complaint: pick(FAULTS[main].complaints), mult: m, estimate: Math.round(est / 10) * 10 };
}
function mkFault(fid) {
  const F = FAULTS[fid];
  let zone = F.zone;
  if (zone === 'wheelF') zone = pick(['wheelFL', 'wheelFR']);
  if (zone === 'wheel') zone = pick(['wheelFL', 'wheelFR', 'wheelRL', 'wheelRR']);
  return { fid, zone, found: false, fixed: false };
}

/* ---------- workbench minigames ---------- */
function openWorkbench(f) {
  if (S.kind === 'own' && G.money < partPrice(f.cost)) { toast('Not enough cash for parts', 'bad'); return; }
  const steps = {
    bolts: ['remove', 'shelf', 'torque'], lugs: ['remove', 'shelf', 'torque'],
    oil: ['drain', 'shelf', 'fill'], battery: ['disconnect', 'shelf', 'connect'],
    bulb: ['twistout', 'shelf', 'twistin'], dents: ['hammer', 'shelf', 'paint']
  }[f.game];
  const n = f.n || 4;
  S.wb = { f, steps, si: 0, bolts: Array.from({ length: n }, () => (G.shop.impact ? 1 : 3)), torqueLeft: G.shop.impact ? 1 : Math.min(3, n), needle: 0, dir: 1, level: 1, holding: false, termOrder: [], dents: [] };
  if (f.game === 'dents') { // spread the dents out so none overlap
    const dents = [], want = randi(5, 8);
    for (let tries = 0; dents.length < want && tries < 400; tries++) { const c = { x: rand(60, 520), y: rand(50, 230), r: rand(14, 26), hits: 3 }; if (dents.every(o => Math.hypot(o.x - c.x, o.y - c.y) > o.r + c.r + 8)) dents.push(c); }
    S.wb.dents = dents;
  }
  if (f.game === 'oil') S.wb.level = 1;
  $('#shopQuit').textContent = 'Put it down';
  renderShop();

function renderWorkbench() {
  const W = S.wb, f = W.f, st = wbStep(), stage = $('#shopStage');
  let title = f.name.replace(/ \(\d+%\)/, ''), hint = '', body = '';
  const stepLbl = `<div class="label">Step ${W.si + 1} of ${W.steps.length}</div>`;

function finishJob() {
  const fixed = S.faults.filter(f => f.fixed);
  const pm = payMult();
  const labor = Math.round(fixed.reduce((s, f) => s + f.labor * S.job.mult, 0) * pm / 5) * 5;
  const parts = Math.round(fixed.reduce((s, f) => s + f.cost * 1.3, 0) / 5) * 5;
  const par = 25 + fixed.length * 35;
  const speed = clamp((par - S.t) / par, 0, 1);
  const tip = Math.round(labor * 0.35 * speed / 5) * 5;
  const total = labor + parts + tip;
  const extras = fixed.length - 1;
  const clean = S.penalties === 0;
  const rep = 2 + (speed > 0.3 ? 1 : 0) + extras + (clean ? 1 : 0);
  earn(total); const leveled = addRep(rep); G.stats.jobs++;
  const lvNow = repLevel(), L = REP_LEVELS[lvNow];
  G.jobs = G.jobs.filter(j => j.id !== S.job.id); ensureJobs();
  if (Math.random() < 0.5) { G.market.shift(); ensureMarket(); }
  saveGame();
  Sound.cash();
  const profit = total - S.partsSpent;
  modal(`<h2>Job done</h2><p class="note" style="font-size:15px">${esc(S.job.customer)} drives off happy${extras > 0 ? ' and thanks you for catching the extra problem' : ''}.</p>
    <div class="kv"><span>Labor (×${pm} shop level)</span><span class="v">${fmt$(labor)}</span><span>Parts billed (+30%)</span><span class="v">${fmt$(parts)}</span><span>Tip for speed (${Math.round(S.t)}s, par ${par}s)</span><span class="v">${fmt$(tip)}</span>

/* ---------- physics helpers ---------- */
function physStats(car) {
  const st = deriveStats(car, true);
  st.wb = BODIES[st.body].wb; st.vmax = topSpeed(st);

}
function tractionG(st) { return st.grip * (st.drive === 'AWD' ? 1.0 : st.drive === 'RWD' ? 0.82 : 0.74); }
function engineAccel(st, v) {
  const P = st.hp * 745.7 * st.accel * 0.92;

}
function dragAccel(st, v) { return 0.5 * 1.2 * st.cda * v * v / st.kg + 0.12; }

/* AI performance: real car, scaled to a target PI */
function aiCarFor(cls, diff) {
  const lo = cls.id === 'D' ? 0 : CLASSES[CLASSES.indexOf(cls) - 1].max;
  const target = Math.round(lo + (cls.max - lo) * clamp(diff + rand(-0.06, 0.04), 0.3, 0.99));
  const pool = Object.keys(CARS).filter(k => { const p = piOf(deriveStats(newCar(k), false)); return p <= cls.max + 40 && p >= lo - 160; });
  const model = pick(pool.length ? pool : ['civic99']);
  const car = newCar(model);
  car.custom.paint = pick(PAINTS); car.custom.rims = pick(RIMS); car.custom.number = randi(2, 99);
  car.custom.spoiler = cls.diff >= 2 && Math.random() < 0.5 ? pick(['wing', 'gt', 'lip']) : 'none';
  car.custom.stripe = Math.random() < 0.35 ? pick(['center', 'twin', 'side']) : 'none';
  car.custom.stripeColor = pick(['#f2f2ee', '#111316', '#ffcc00']);
  const st = deriveStats(car, false);
  const p0 = piOf(st);
  st.hp = Math.max(st.hp * 0.55, st.hp + (target - p0) / 0.9 * st.kg / 1000);
  st.wb = BODIES[st.body].wb; st.vmax = topSpeed(st);

/* ---------- circuit update ---------- */
function updatePlayer(dt) {

function hitDamage(impact, front) {

function updateAIs(dt) {

    const pl = (P.x - T.px[P.idx]) * T.rx(P.idx) + (P.z - T.pz[P.idx]) * T.rz(P.idx);
    others.push({ s: P.dist, lane: pl, v: Math.max(0, P.vf || 0) });

  } else {

  modal(`<h2>${title}</h2><div class="note" style="font-size:15px">${esc(e.name)} · ${e.cls.id} class</div>${table}
    <div class="kv"><span>Entry fee</span><span class="v" style="color:var(--bad)">−${fmt$(e.entry)}</span><span><b>Prize money</b></span><span class="v" style="color:var(--good)"><b>${fmt$(prize)}</b></span></div>

  const th = (keys.KeyW || keys.ArrowUp) ? 1 : 0;
  while (R.acc >= step) {
    R.acc -= step; R.t += step;
    if (!R.started) {
      // free rev while staged
      me.rpm += ((th ? 1.0 : 0.15) - me.rpm) * Math.min(1, step * (th ? 3 : 5));
      rv.rpm = 0.68 + Math.sin(R.t * 9) * 0.03;
      if (R.t >= R.green) {
        R.started = true; R.tGreen = R.t;
        const x = me.rpm;
        if (th) { me.react = 0; R.react = 0; launch(me, x); }
        rv.launchAt = R.t + R.rvReact;
      }
    } else {
      if (me.react == null && th) { me.react = R.t - R.tGreen; R.react = me.react; launch(me, me.rpm); }
      if (me.react != null) dragSim(me, step, th, true); else me.rpm += ((th ? 1 : 0.15) - me.rpm) * step * 4;
      if (rv.launchAt != null && R.t >= rv.launchAt) {
        if (!rv.launched) { rv.launched = true; launch(rv, rand(0.55, 0.85)); }
        if (rv.rpm >= R.rvShift && rv.gear < 5 && rv.shiftT <= 0) { rv.gear++; rv.shiftT = 0.25 - 0.04 * R.e.cls.diff * 0.2; R.rvShift = rand(0.88, 0.98); }
        dragSim(rv, step, 1, false);
      }
      for (const D of [me, rv]) if (D.done == null && D.x >= DRAG_LEN) { D.done = R.t - R.tGreen; D.trap = D.v; }
    }
  }
  // finish (or give up if you never launch)
  if (me.done == null && rv.done != null && R.t - R.tGreen > rv.done + 5 && !R.result) {
    R.endWait = 2; R.result = { et: null, elapsed: Infinity, react: me.react, trap: null };
  }
  if (me.done != null && !R.result) {
    R.endWait = 0;
    R.result = { et: me.done - (me.react || 0), elapsed: me.done, react: me.react, trap: me.trap };
  }
  if (R.result && !R.done) {
    R.endWait += dt;
    if (rv.done != null || R.endWait > 4) {
      const rvElapsed = rv.done != null ? rv.done : R.t - R.tGreen + (DRAG_LEN - rv.x) / Math.max(rv.v, 10);
      R.result.rivalEt = rvElapsed - R.rvReact;
      R.result.win = R.result.elapsed < rvElapsed;
      if (R.endWait > 1.2) finishRace(false);
    }
  }
  // lights
  const bulbsOn = R.started ? 'g' : R.t > R.green - 1.5 ? (R.t > R.green - 0.5 ? 'yyy' : R.t > R.green - 1.0 ? 'yy' : 'y') : '';
  const lights = $('#hudTree');
  const ys = bulbsOn === 'g' ? 3 : bulbsOn.length;
  lights.innerHTML = [0, 1, 2].map(i => `<b class="${i < ys ? (bulbsOn === 'g' ? '' : 'y') : ''}"></b>`).join('') + `<b class="${R.started ? 'g' : ''}"></b>`;
  for (const b of R.bulbs) b.m.material.color.set(R.started ? (b.i === 4 ? 0x3ddc84 : 0x222222) : (b.i >= 1 && b.i <= 3 && b.i <= ys ? 0xffc53d : 0x222222));
  // meshes
  R.mesh.position.z = me.x; R.amesh.position.z = rv.x;
  for (const w of R.mesh.userData.wheels) w.spin.rotation.x += me.v / R.mesh.userData.wr * dt;
  for (const w of R.amesh.userData.wheels) w.spin.rotation.x += rv.v / R.amesh.userData.wr * dt;
  R.mesh.rotation.x = me.spin > 0 ? -0.03 : (me.v > 0 && me.shiftT <= 0 && th ? -0.015 : 0);
  // camera
  const cm = R.camMode === 0 ? [7, 2.5] : [12, 5];
  raceCam.position.set(2.5 + (R.camMode ? -4 : 0), cm[1], me.x - cm[0]);
  raceCam.lookAt(2.5 - (R.camMode ? 2 : 0), 0.9, me.x + 6);
  raceCam.fov = 62 + Math.min(20, me.v * 0.2); raceCam.updateProjectionMatrix();
  R.sun.position.set(40, 80, me.x - 20); R.sun.target.position.set(0, 0, me.x);
  Sound.engine(clamp(me.rpm, 0, 1), th);
  R.msgT -= dt; if (R.msgT <= 0) $('#hudMsg').textContent = '';
  R.hudT -= dt;
  if (R.hudT <= 0) {
    R.hudT = 0.04;
    const ahead = me.x - rv.x;
    $('#hudTL').innerHTML = `<div class="lap">${R.started ? fmtTime(R.t - R.tGreen) : 'Staged'}</div><div class="time">${Math.round(me.x)} m / 402 m</div><div class="time" style="color:${ahead >= 0 ? 'var(--good)' : 'var(--bad)'}">${R.started ? (ahead >= 0 ? 'Ahead by ' : 'Behind by ') + Math.abs(ahead).toFixed(1) + ' m' : ''}</div>`;
    $('#hudBR').innerHTML = `<div class="gear">${me.shiftT > 0 ? '·' : me.gear + 1}</div><div class="spd">${Math.round(me.v * 2.237)}</div><div class="unit">MPH</div>`;
    const lo = me.gear === 0 && !R.started ? 0.6 : 0.9, hi = me.gear === 0 && !R.started ? 0.8 : 1.0;
    $('#hudTach').innerHTML = `<div class="lights">${[0.6, 0.7, 0.8, 0.88, 0.94, 0.98].map((t, i) => `<b class="${me.rpm >= t ? (i < 3 ? 'g' : i < 5 ? 'y' : 'r') : ''}"></b>`).join('')}</div>
      <div class="tbar"><div class="zone" style="left:${lo * 100}%;width:${(hi - lo) * 100}%"></div><i style="width:${clamp(me.rpm, 0, 1) * 100}%;${me.limiter ? 'background:var(--bad)' : ''}"></i></div>
      <div class="label">${!R.started ? 'Launch zone' : 'Shift zone'} · ${Math.round(me.rpm * CARS[R.car.model].redline)} rpm</div>`;
  }
  renderer.render(raceScene, raceCam);
}
function launch(D, x) {
  if (x > 0.86) { D.spin = 1.1; if (D === R.me) flashMsg('Wheelspin', 1); }
  else if (x < 0.45) { D.bog = 0.8; if (D === R.me) flashMsg('Bogged down', 1); }
  else if (D === R.me) flashMsg('Good launch', 1);
  D.launchFloor = clamp(x, 0.3, 0.85);
}

/* =====================================================================
   MAIN — screens, menu, loop
   ===================================================================== */
let mode = 'title';
function goHub() {
  mode = 'hub';
  $('#title').hidden = true; $('#hub').hidden = false; $('#shop').hidden = true;
  lastHubCarSig = '';
  renderHubUI();
}
function showTitle() {
  mode = 'title';
  $('#title').hidden = false; $('#hub').hidden = true;
  const saved = loadGame();
  const b = $('#titleBtns');
  b.innerHTML = (saved ? `<button class="btn big primary" id="tContinue">Continue</button>` : '') +
    `<button class="btn big ${saved ? '' : 'primary'}" id="tNew">New game</button>`;
  // showroom preview car
  const demo = saved ? (saved.cars.find(c => c.id === saved.activeId) || saved.cars[0]) : Object.assign(newCar('supra97'), {});
  if (!saved) Object.assign(demo.custom, { paint: '#ff7a1a', rims: '#1a1c1f', spoiler: 'gt', stripe: 'twin', stripeColor: '#111316', number: 8 });
  setHubCar(demo);
  if (saved) $('#tContinue').onclick = () => { G = saved; Sound.init(); Sound.setMute(G.settings.mute); goHub(); };
  $('#tNew').onclick = () => {
    const start = () => { G = freshState(); saveGame(); Sound.init(); tab = 'garage'; goHub(); welcome(); };
    if (saved) confirmBox('Start over?', 'This erases your saved garage, cars and money.', 'Start new game', start, true);
    else start();
  };
}
function welcome() {
  modal(`<h2>Your shop is open</h2>
    <p class="note" style="font-size:15px;line-height:1.5">You've got <b>${fmt$(G.money)}</b> and a tired 1999 Civic. Here's how to make money:</p>
    <div class="kv" style="font-size:14px;line-height:1.4">
      <span><b>Repair Shop</b>: take customer jobs, find the fault, fix it, get paid.</span><span></span>
      <span><b>Race</b>: pay an entry fee, finish on the podium to win prize money.</span><span></span>
      <span><b>Used Cars</b>: buy cheap wrecks, fix them yourself, sell for profit.</span><span></span>
      <span><b>Upgrades</b>: more power and grip move your car into faster classes with bigger prizes.</span><span></span>
    </div>
    <p class="note">Tip: your Civic is worn out. Fixing it in your own shop costs only parts.</p>
    <div class="actions"><button class="btn primary" id="mGo">Let's go</button></div>`, box => box.querySelector('#mGo').onclick = closeModal);
}
$('#btnMute').onclick = () => { Sound.init(); G.settings.mute = !G.settings.mute; Sound.setMute(G.settings.mute); renderTop(); saveGame(); };
$('#btnMenu').onclick = () => {
  modal(`<h2>Menu</h2>
    <div class="kv"><span>Circuit</span><span class="v">W/S throttle · A/D steer</span><span></span><span class="v">Space handbrake · C camera · R reset</span>
    <span>Drag</span><span class="v">Hold W · Shift or E to shift</span><span>Shop</span><span class="v">Click parts · Space to torque</span><span>Garage</span><span class="v">Keys 1–7 switch tabs</span></div>
    <p class="note">Your progress saves automatically in this browser.</p>
    <div class="actions"><button class="btn danger" id="mReset">Start a new game</button><button class="btn" id="mTitle">Title screen</button><button class="btn primary" id="mClose">Close</button></div>`, box => {
    box.querySelector('#mClose').onclick = closeModal;
    box.querySelector('#mTitle').onclick = () => { saveGame(); closeModal(); showTitle(); };
    box.querySelector('#mReset').onclick = () => confirmBox('Start over?', 'This erases your saved garage, cars and money.', 'Erase and restart', () => { G = freshState(); saveGame(); tab = 'garage'; goHub(); welcome(); }, true);
  });
};
window.addEventListener('keydown', e => {
  if (!$('#modal').hidden && e.code === 'Escape') { closeModal(); return; }
  if (mode === 'hub' && $('#modal').hidden && /^Digit[1-7]$/.test(e.code) && document.activeElement.tagName !== 'INPUT') {
    tab = TABS[+e.code.slice(5) - 1].id; renderHubUI();
  }
});
['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, () => { Sound.init(); if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume(); }, { passive: true }));
window.addEventListener('resize', resize);

let lastT = performance.now(), saveT = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  try {
    if (mode === 'title' || mode === 'hub') renderHub(dt);
    else if (mode === 'shop') shopTick(dt);
    else if (mode === 'race' && R) { if (R.type === 'circuit') circuitTick(dt); else dragTick(dt); }
  } catch (err) { console.error(err); }
  saveT += dt; if (saveT > 10 && G && mode !== 'race') { saveT = 0; saveGame(); }
  requestAnimationFrame(loop);
}
buildHub();
resize();
showTitle();
requestAnimationFrame(loop);
window.__GK = { get G() { return G; }, get R() { return R; }, get S() { return S; }, get mode() { return mode; } };

</script>
