    for (const ms of C.MILESTONES) {
      if (s.milestones[ms.id]) continue;
      if (!ms.test(s)) continue;
      s.milestones[ms.id] = true;
      structureDirty = true;

      if (ms.flags) Object.assign(s.flags, ms.flags);
      if (ms.stage && ms.stage > s.stage) {
        s.stage = ms.stage;
        const tab = C.TABS.find(t => t.stage === ms.stage && !t.flag);
        if (tab) emit('newtab', tab.id);
      }
      if (ms.newTab) emit('newtab', ms.newTab);
      if (ms.doc) unlockDoc(ms.doc);
      if (!quiet) {
        if (ms.log) ms.log.forEach(l => emit('log', { text: l[0], kind: l[1] }));
        if (ms.banner) emit('banner', ms.banner);
        if (C.BRIEFINGS[ms.id]) emit('briefing', C.BRIEFINGS[ms.id]);
        if (ms.ending) emit('ending');
      }
      recompute();
      emit('milestone', ms);
    }
    checkDepthMarks(quiet);
    scanUnlocks(quiet);
    checkDirectives(quiet);
  }

  /* ---------------------------------------------------------------- */
  /* Depth landmarks                                                  */
  /* ---------------------------------------------------------------- */

  function checkDepthMarks(quiet) {
    const marks = C.DEPTH_MARKS;
    while (s.depthMark < marks.length && s.depth >= marks[s.depthMark].at) {
      const mk = marks[s.depthMark];
      s.depthMark++;
      structureDirty = true;
      if (!quiet) emit('depthmark', mk);
    }
  }

  /** Where the player is between the last landmark and the next one. */
  function depthTarget() {
    const marks = C.DEPTH_MARKS;
    const i = Math.min(s.depthMark, marks.length);
    if (i >= marks.length) return null;
    const next = marks[i];
    const from = i > 0 ? marks[i - 1].at : 0;
    const span = Math.max(1, next.at - from);
    const remaining = Math.max(0, next.at - s.depth);
    return {
      mark: next,
      from: from,
      pct: Math.max(0, Math.min(1, (s.depth - from) / span)),
      remaining: remaining,
      eta: depthRate > 0 ? remaining / depthRate : Infinity
    };
  }

  /* ---------------------------------------------------------------- */
  /* Unlock announcements and directives                              */
  /* ---------------------------------------------------------------- */

  const ALL_ENTRIES = C.PRODUCERS.concat(C.UPGRADES, C.RESEARCH);

  /** Announce anything that has just become available for the first time.
      A handful at once is explained individually; a whole section opening
      at a stage gate is summarised, because the stage briefing and the NEW
      badges on the cards already carry the detail. */
  function scanUnlocks(quiet) {
    const batch = [];
    for (const e of ALL_ENTRIES) {
      if (s.seen[e.id] || !visible(e)) continue;
      s.seen[e.id] = true;
      structureDirty = true;
      if (quiet) continue;
      s.fresh[e.id] = true;
      batch.push(e);
    }
    if (!batch.length) return;
    if (batch.length <= 3) batch.forEach(e => emit('unlock', e));
    else emit('unlockBatch', batch);
  }

  function introFor(entry) {
    return C.INTROS[entry.id] || entry.desc;
  }

  function isFresh(id) { return !!s.fresh[id]; }

  function clearFresh(tabId) {
    let changed = false;
    for (const e of ALL_ENTRIES) {
      if (!s.fresh[e.id]) continue;
      const tab = e.tab || 'anomaly';           // research lives on the anomaly tab
      if (tabId && tab !== tabId) continue;
      delete s.fresh[e.id];
      changed = true;
    }
    if (changed) structureDirty = true;
    return changed;
  }

  function directive() { return C.DIRECTIVES[s.directive] || null; }

  function directiveProgress() {
    const d = directive();
    if (!d || !d.progress) return null;
    const [cur, max, unit] = d.progress(s);
    return { cur: Math.min(cur, max), max: max, unit: unit, pct: Math.max(0, Math.min(1, cur / max)) };
  }

  function checkDirectives(quiet) {
    let d;
    while ((d = C.DIRECTIVES[s.directive]) && d.test && d.test(s)) {
      s.directive++;
      structureDirty = true;
      if (!quiet) emit('directive', { done: d, next: C.DIRECTIVES[s.directive] || null });
    }
    /* If a later goal is already satisfied, every goal before it is moot.
       Without this a player who gets ahead of the list stays stuck on a
       goal they have long since passed. */
    for (let i = C.DIRECTIVES.length - 1; i > s.directive; i--) {
      const later = C.DIRECTIVES[i];
      if (!later.test || !later.test(s)) continue;
      const skipped = C.DIRECTIVES[s.directive];
      s.directive = i + 1;
      structureDirty = true;
      if (!quiet) emit('directive', { done: skipped, next: C.DIRECTIVES[s.directive] || null });
      break;
    }
  }

  /* ---------------------------------------------------------------- */
  /* Persistence                                                      */
  /* ---------------------------------------------------------------- */

  function serialize() {
    s.lastSeen = Date.now();
    return JSON.stringify(s);
  }

  /* Set once the save has been deliberately wiped. Without this, the
     page-unload handler writes the state straight back before the reload
     and the reset appears to do nothing. */
  let saveBlocked = false;

  function save() {
    if (saveBlocked) return false;
    try { localStorage.setItem(SAVE_KEY, serialize()); return true; }
    catch (e) { return false; }
  }

  function readSave() {
    try { return localStorage.getItem(SAVE_KEY); }
    catch (e) { return null; }
  }

  function hydrate(raw) {
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object') throw new Error('bad save');
    const base = freshState();
    s = Object.assign(base, data);
    /* defensive merge: a save written by an older content set must not
       lose the shapes the engine expects */
    s.res = Object.assign({}, data.res);
    s.earned = Object.assign({}, data.earned);
    s.prod = Object.assign({}, data.prod);
    s.upg = Object.assign({}, data.upg);
    s.flags = Object.assign({}, data.flags);
    s.milestones = Object.assign({}, data.milestones);
    s.seenTabs = Object.assign({ maintenance: true, system: true }, data.seenTabs);
    s.seen = Object.assign({}, data.seen);
    s.fresh = Object.assign({}, data.fresh);
    s.off = Object.assign({}, data.off);
    s.mode = MODE_BY_ID[data.mode] ? data.mode : 'standard';
    s.power = data.power || 0;
    s.powerT = data.powerT || 0;
    s.powerNext = data.powerNext || 0;
    s.market = typeof data.market === 'number' ? data.market : 1;
    s.marketT = data.marketT || 0;
    s.directive = typeof data.directive === 'number' ? data.directive : 0;
    s.depthMark = typeof data.depthMark === 'number' ? data.depthMark : 0;
    s.introDone = data.introDone !== false;
    s.stats = Object.assign(base.stats, data.stats);
    /* saves from before the shift timer existed: fall back to total time */
    if (typeof s.stats.active !== 'number') s.stats.active = s.stats.time || 0;
    s.docs = Array.isArray(data.docs) && data.docs.length ? data.docs.slice() : C.START_DOCS.slice();
    for (const k in s.res) if (!isFinite(s.res[k])) s.res[k] = 0;
    if (!isFinite(s.depth)) s.depth = 0;
    migrate();
    return true;
  }

  /** Automation used to be four one-off upgrades; it is now a machine you
      can buy more of. Anyone who already owned an upgrade keeps the
      automation as one free machine. */
  const DAEMON_TO_PRESSER = {
    u_daemon1: 'pressVent', u_daemon2: 'pressDig',
    u_daemon3: 'pressProbe', u_daemon4: 'pressTap'
  };

  function migrate() {
    for (const old in DAEMON_TO_PRESSER) {
      if (!s.upg[old]) continue;
      const pid = DAEMON_TO_PRESSER[old];
      if (!count(pid)) s.prod[pid] = 1;
      delete s.upg[old];
      delete s.seen[old];
      delete s.fresh[old];
    }
    /* flags the old upgrades set are no longer meaningful */
    ['autoVent', 'autoDig', 'autoProbe', 'autoTap'].forEach(f => delete s.flags[f]);
  }

  /** Throw the current run away and begin again, without a page reload. */
  function newGame(modeId) {
    s = freshState(modeId);
    saveBlocked = false;
    ratio = {};
    const grant = mode().startGrant;
    if (grant) for (const k in grant) { s.res[k] = grant[k]; s.earned[k] = grant[k]; }
    recompute();
    scanUnlocks(true);
    checkDirectives(true);
    save();
    emit('newgame');
    return s;
  }

  /** Is there a run worth offering to continue? */
  function hasProgress() {
    return !!(s && (s.stats.clicks > 0 || s.stats.time > 1 ||
      (s.earned.credits || 0) > 0 || s.stats.purchases > 0));
  }

  function wipe() {
    saveBlocked = true;
    try {
      localStorage.removeItem(SAVE_KEY);
      return localStorage.getItem(SAVE_KEY) === null;
    } catch (e) { return false; }
  }

  function exportSave() {
    try { return btoa(unescape(encodeURIComponent(serialize()))); }
    catch (e) { return serialize(); }
  }

  function importSave(text) {
    const trimmed = (text || '').trim();
    if (!trimmed) return 'Nothing to import.';
    let raw = trimmed;
    if (trimmed[0] !== '{') {
      try { raw = decodeURIComponent(escape(atob(trimmed))); }
      catch (e) { return 'That code is not a Deep Earth save.'; }
    }
    try {
      hydrate(raw);
      recompute();
      checkMilestones(true);
      structureDirty = true;
      save();
      return null;
    } catch (e) { return 'That code is not a Deep Earth save.'; }
  }

  /* ---------------------------------------------------------------- */
  /* Boot                                                             */
  /* ---------------------------------------------------------------- */

  function start() {
    const raw = readSave();
    let report = null;

    if (raw) {
      try {
        hydrate(raw);
        recompute();
        checkMilestones(true);
        report = catchUp();
      } catch (e) {
        s = freshState();
        recompute();
        emit('log', { text: 'Save state unreadable. A new session has been opened.', kind: 'warn' });
      }
    } else {
      s = freshState();
      recompute();
      /* the opening systems are introduced by the tutorial, not the log */
      scanUnlocks(true);
      checkDirectives(true);
      C.BOOT_LOG.forEach(l => emit('log', { text: l[0], kind: l[1] }));
    }
    recompute();
    return report;
  }

  function catchUp() {
    const elapsed = Math.max(0, (Date.now() - (s.lastSeen || Date.now())) / 1000);
    if (elapsed < 30) return null;

    const capped = Math.min(elapsed, m.offCap);
    const before = Object.assign({}, s.res);
    const depthBefore = s.depth;

    simulate(capped * m.offRate, 120);
    checkMilestones(true);

    const gains = {};
    for (const k in s.res) {
      const d = (s.res[k] || 0) - (before[k] || 0);
      if (d > 0.0001) gains[k] = d;
    }
    return {
      elapsed: elapsed,
      counted: capped,
      capped: elapsed > m.offCap,
      rate: m.offRate,
      gains: gains,
      depth: s.depth - depthBefore
    };
  }

  /* ---------------------------------------------------------------- */

  return {
    on, emit,
    start, save, wipe, newGame, hasProgress, exportSave, importSave, serialize,
    state, mult, flag, res, earned, count, owned,
    meets, visible, resourceVisible, actionForTab, latestAction, depthTarget,
    mode, modes: () => C.MODES, goal, upgradeCost, pressesLeft, marketFactor,
    powerOut: () => (s.power || 0) > 0,
    machinesOwned: () => C.PRODUCERS.reduce((t, p) => t + count(p.id), 0),
    recompute, tick, simulate, checkMilestones,
    directive, directiveProgress, isFresh, clearFresh, introFor,
    introDone: () => !!s.introDone,
    markIntroDone: () => { s.introDone = true; save(); },
    doAction, clickGain, clickDepth,
    buyProducer, buyUpgrade, producerCost, canAfford, maxAffordable,
    netRate, grossRate, drainRate, fullRate, pMult, effMult, abbr,
    pressCount, pressRate, isPresser: p => !!(p && p.autoAction),
    isOff, canToggle, toggleProducer,
    ratioOf: id => (ratio[id] == null ? 1 : ratio[id]),
    depthRate: () => depthRate,
    isConverter: p => !!p.use,
    convOutput: id => convOut[id] || {},
    byProducer: P, byAction: A, byUpgrade: U,
    takeStructureDirty: () => { const d = structureDirty; structureDirty = false; return d; },
    markStructureDirty: () => { structureDirty = true; }
  };
})();
</script>
<script>
/* ========================================================================
   ui.js — renders the terminal and keeps it in step with the engine.

   Each stage tab is self-contained: its own button, its own depth bar,
   its own machines and upgrades. The goal box, the resource bar and the
   section switcher sit outside the tabs because they always apply.

   Structure is rebuilt only when the set of visible things changes, so
   focus, scroll position and keyboard state survive the 8 Hz value refresh.
   ===================================================================== */

const UI = (() => {
  'use strict';

  const C = CONTENT;
  const E = ENGINE;

  let root = null;
  const el = {};                  // long-lived elements (shell)
  let pan = {};                   // elements inside the current panel
  let buyAmt = 1;
  let panelSig = '';
  let tickerSig = '';
  let cards = new Map();
  let chips = new Map();
  let sysRefs = [];
  let modalOpen = null;
  let researchOpen = false;

  /* ---------------------------------------------------------------- */
  /* Icons                                                            */
  /* ---------------------------------------------------------------- */

  const SPRITE = `
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-coin" viewBox="0 0 24 24">
        <path d="M12 3a9 9 0 100 18 9 9 0 000-18zm0 3.4a5.6 5.6 0 110 11.2 5.6 5.6 0 010-11.2z"/>
        <circle cx="12" cy="12" r="2.3"/>
      </symbol>
      <symbol id="i-scrap" viewBox="0 0 24 24">
        <path d="M3 18l4.2-9.4 3 5.1 3.1-3.4 2.1 4.2L21 12v6z"/>
      </symbol>
      <symbol id="i-ingot" viewBox="0 0 24 24">
        <path d="M4 17l3-7h10l3 7z"/><path d="M7.6 8.6h8.8l.8 1.4H6.8z"/>
      </symbol>
      <symbol id="i-plate" viewBox="0 0 24 24">
        <path d="M3 8.6L12 4.4l9 4.2-9 4.2z"/>
        <path d="M3.2 13.2L12 17.2l8.8-4-2.2-1-6.6 3-6.6-3z"/>
      </symbol>
      <symbol id="i-spark" viewBox="0 0 24 24">
        <path d="M12 2l2.3 6.9L21 11.2l-6.7 2.3L12 21l-2.3-7.5L3 11.2l6.7-2.3z"/>
      </symbol>
      <symbol id="i-shard" viewBox="0 0 24 24">
        <path d="M14.4 2L6 13.4h4.6L9.2 22l8.6-12.2h-4.6z"/>
      </symbol>
      <symbol id="i-flame" viewBox="0 0 24 24">
        <path d="M12 2.2c3.1 4.1 5.1 6.2 5.1 9.2a5.1 5.1 0 01-10.2 0c0-1.7.7-2.9 1.7-4.1.3 1 .9 1.7 1.6 2.1.4-2.7-.1-5.2 1.8-7.2z"/>
      </symbol>
      <symbol id="i-star" viewBox="0 0 24 24">
        <path d="M12 2l2.9 6.6 7.1.7-5.3 4.8 1.5 6.9L12 17.4 5.8 21l1.5-6.9L2 9.3l7.1-.7z"/>
      </symbol>
      <symbol id="i-depth" viewBox="0 0 24 24">
        <path d="M11 3h2v11.2l3.6-3.6L18 12l-6 6-6-6 1.4-1.4L11 14.2z"/>
      </symbol>
      <symbol id="i-mail" viewBox="0 0 24 24">
        <path d="M3 5.5h18v13H3zm1.7 1.6 7.3 5.3 7.3-5.3z"/>
      </symbol>
      <symbol id="i-press" viewBox="0 0 24 24">
        <path d="M10 2h4v7h-4z"/><path d="M5 11h14v3H5z"/><path d="M8 16h8v6H8z"/>
      </symbol>
    </svg>`;

  const RES = {};
  C.RESOURCES.forEach(r => { RES[r.id] = r; });

  function icon(def, size) {
    if (!def || !def.icon) return '';
    const s = size || 15;
    return `<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24"
      aria-hidden="true" style="color:${def.color}"><use href="#i-${def.icon}"></use></svg>`;
  }

  function resIcon(id, size) { return icon(RES[id], size); }

  /* ---------------------------------------------------------------- */
  /* Shell                                                           */
  /* ---------------------------------------------------------------- */

  const SHELL = SPRITE + `
    <canvas id="scene" aria-hidden="true"></canvas>
    <header class="statusbar">
      <div class="statusbar__id">
        <span class="facility">Facility <b>D-9</b> &middot; Deep Earth Holdings</span>
        <span class="stagebadge"><i class="led" aria-hidden="true"></i><span id="stageName">Maintenance</span></span>
        <span class="modetag" id="modeTag" hidden></span>
        <span class="shift" title="Time you have spent on this shift">
          Shift <b id="shiftTime">00:00:00</b></span>
        <button class="report" id="btnReport" type="button"
          title="Report a bug or send a suggestion">
          <svg class="ico" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"
            ><use href="#i-mail"></use></svg>Report a bug</button>
        <span class="depth">Depth <b id="depthVal">0 m</b></span>
      </div>
      <div class="ticker" id="ticker" aria-label="What you have"></div>
      <div class="modebar" id="modeBar" hidden></div>
    </header>
    <main class="shell">
      <section class="directive" id="directive" aria-live="polite">
        <div class="directive__k" id="dirK">Goal</div>
        <div class="directive__t" id="dirT"></div>
        <div class="directive__h" id="dirH"></div>
        <div class="directive__bar" id="dirBar" hidden><i id="dirFill" style="width:0%"></i></div>
        <div class="directive__p" id="dirP" hidden></div>
      </section>
      <nav class="tabbar" id="tabbar" role="tablist" aria-label="Sections"></nav>
      <section class="panel" id="panel" role="tabpanel" tabindex="0" aria-label="Section"></section>
      <div class="logwrap">
        <div class="logwrap__head"><i class="led" aria-hidden="true"></i> Messages</div>
        <ol class="log" id="log" aria-live="polite" aria-relevant="additions"></ol>
      </div>
    </main>
    <div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Main menu" hidden>
      <div class="menu__inner">
        <div class="menu__eyebrow">Deep Earth Holdings &middot; Site Terminal D-9</div>
        <h1 class="menu__title">The Deep Earth<br>Corporate Bunker</h1>
        <p class="menu__tag">You look after the air on three floors. The lift has buttons for forty.</p>
        <div class="menu__save" id="menuSave" hidden></div>
        <div class="menu__btns" id="menuBtns"></div>
        <p class="menu__foot">Your progress saves itself to this browser as you play.</p>
      </div>
    </div>`;

  function boot(mount) {
    root = mount;
    root.innerHTML = SHELL;
    ['scene', 'stageName', 'depthVal', 'shiftTime', 'modeTag', 'modeBar', 'btnReport',
      'ticker', 'tabbar', 'panel', 'log',
      'directive', 'dirK', 'dirT', 'dirH', 'dirBar', 'dirFill', 'dirP',
      'menu', 'menuSave', 'menuBtns']
      .forEach(id => { el[id] = document.getElementById(id); });

    bindKeys();
    el.btnReport.addEventListener('click', showReport);
    SCENE.start(el.scene);
    window.addEventListener('resize', measureTabs);
    setInterval(autoPulse, AUTO_PULSE_MS);

    E.on('log', e => pushLog(e.text, e.kind));
    E.on('banner', showBanner);
    E.on('ending', showEnding);
    E.on('action', onAction);
    E.on('buy', e => { flashCard(e.entry.id); if (researchOpen) renderResearch(); });
    E.on('toggle', e => {
      const uses = Object.keys(e.entry.use).map(k => E.abbr(k)).join(' and ');
      pushLog(e.entry.name + (e.off
        ? ' switched off. It will stop using ' + uses + '.'
        : ' switched back on.'), e.off ? 'warn' : 'ok');
    });
    E.on('newtab', id => { E.state().seenTabs[id] = false; panelSig = ''; });
    E.on('docs', () => { if (E.state().tab === 'archive') panelSig = ''; });
    E.on('unlock', announceUnlock);
    E.on('unlockBatch', announceBatch);
    E.on('directive', onDirective);
    E.on('depthmark', onDepthMark);
    E.on('briefing', b => setTimeout(() => showBriefing(b), 3400));

    rebuildTabs();
    render(true);
  }

  /* ---------------------------------------------------------------- */
  /* Status bar                                                       */
  /* ---------------------------------------------------------------- */

  function syncTicker() {
    const list = C.RESOURCES.filter(r => E.resourceVisible(r));
    const sig = list.map(r => r.id).join(',');
    if (sig !== tickerSig) {
      tickerSig = sig;
      chips = new Map();
      el.ticker.innerHTML = list.map(r =>
        `<div class="chip" data-chip="${r.id}" style="--sect:${C.SECTION_COLORS[r.section] || 'var(--text-strong)'}">
           <span class="chip__k">${icon(r, 13)}${r.name}</span>
           <span class="chip__v" data-v="${r.id}">0</span>
           <span class="chip__flow">
             <span class="flow made"><em>made</em><b data-made="${r.id}">0</b></span>
             <span class="flow used" data-usedwrap="${r.id}" hidden><em>used</em><b data-used="${r.id}">0</b></span>
             <span class="flow net" data-netwrap="${r.id}" hidden><em>total</em><b data-net="${r.id}">0</b></span>
           </span>
         </div>`).join('');
      list.forEach(r => chips.set(r.id, {
        node: el.ticker.querySelector(`[data-chip="${r.id}"]`),
        value: el.ticker.querySelector(`[data-v="${r.id}"]`),
        made: el.ticker.querySelector(`[data-made="${r.id}"]`),
        used: el.ticker.querySelector(`[data-used="${r.id}"]`),
        net: el.ticker.querySelector(`[data-net="${r.id}"]`),
        usedWrap: el.ticker.querySelector(`[data-usedwrap="${r.id}"]`),
        netWrap: el.ticker.querySelector(`[data-netwrap="${r.id}"]`)
      }));
    }

    for (const r of list) {
      const c = chips.get(r.id);
      if (!c) continue;
      const gross = E.grossRate(r.id);
      const drain = E.drainRate(r.id);
      const net = gross - drain;
      const consumed = drain > 1e-9;

      c.value.textContent = FMT.n(E.res(r.id));
      c.made.textContent = '+' + FMT.n(gross) + '/s';
      c.usedWrap.hidden = !consumed;
      c.netWrap.hidden = !consumed;
      if (consumed) {
        c.used.textContent = '−' + FMT.n(drain) + '/s';
        c.net.textContent = (net >= 0 ? '+' : '−') + FMT.n(Math.abs(net)) + '/s';
        c.net.className = net < -1e-9 ? 'negative' : '';
      }
      c.node.setAttribute('aria-label', r.name + ': ' + FMT.n(E.res(r.id)) + ' held, making ' +
        FMT.n(gross) + ' per second' +
        (consumed ? ', machines using ' + FMT.n(drain) + ' per second, total ' +
          (net >= 0 ? 'gain ' : 'loss ') + FMT.n(Math.abs(net)) + ' per second' : ''));
    }
  }

  /** The strip under the resources, showing whatever the chosen mode
      needs you to watch: presses left, the power, the market, machines. */
  function syncModeBar() {
    const md = E.mode();
    if (md.id === 'standard') {
      el.modeTag.hidden = true;
      el.modeBar.hidden = true;
      return;
    }
    el.modeTag.hidden = false;
    if (el.modeTag.textContent !== md.name) el.modeTag.textContent = md.name;

    const bits = [];
    if (md.pressCap) {
      const left = E.pressesLeft();
      bits.push(`<span class="mb ${left ? '' : 'mb--bad'}"><em>Presses left</em><b>${left}</b></span>`);
    }
    if (md.scored) {
      bits.push(`<span class="mb"><em>Machines built</em><b>${FMT.int(E.machinesOwned())}</b></span>`);
    }
    if (md.brownout) {
      const out = E.powerOut();
      bits.push(`<span class="mb ${out ? 'mb--bad' : 'mb--ok'}"><em>Power</em><b>${
        out ? 'OUT · ' + Math.ceil(E.state().power) + 's' : 'on'}</b></span>`);
    }
    if (md.volatile) {
      const f = E.marketFactor();
      const cls = f >= 1.25 ? 'mb--ok' : f <= 0.75 ? 'mb--bad' : '';
      bits.push(`<span class="mb ${cls}"><em>Scrap price</em><b>${Math.round(f * 100)}%</b></span>`);
    }
    if (md.decay) {
      bits.push(`<span class="mb"><em>Spoilage</em><b>−${(md.decay * 100).toFixed(2)}%/s</b></span>`);
    }
    const html = bits.join('');
    el.modeBar.hidden = !html;
    if (el.modeBar.innerHTML !== html) el.modeBar.innerHTML = html;
  }

  function depthReadout() {
    const s = E.state();
    if (s.flags.ended) return 'Everywhere';
    if (s.flags.cosmic) return 'Space';
    if (s.flags.coreBreached) return 'Centre of the planet';
    return FMT.depth(s.depth);
  }

  /* ---------------------------------------------------------------- */
  /* Goal box                                                         */
  /* ---------------------------------------------------------------- */

  function syncDirective() {
    const d = E.directive();
    if (!d) { el.directive.hidden = true; return; }
    el.directive.hidden = false;

    const idx = E.state().directive + 1;
    const label = 'Goal ' + (idx < 10 ? '0' + idx : idx) + ' of ' + C.DIRECTIVES.length;
    if (el.dirK.textContent !== label) el.dirK.textContent = label;
    if (el.dirT.textContent !== d.title) el.dirT.textContent = d.title;
    if (el.dirH.dataset.k !== d.title) { el.dirH.innerHTML = d.hint; el.dirH.dataset.k = d.title; }

    const p = E.directiveProgress();
    if (p) {
      el.dirBar.hidden = false;
      el.dirP.hidden = false;
      el.dirFill.style.width = (p.pct * 100).toFixed(1) + '%';
      const txt = FMT.n(p.cur) + ' / ' + FMT.n(p.max) + ' ' + p.unit;
      if (el.dirP.textContent !== txt) el.dirP.textContent = txt;
    } else {
      el.dirBar.hidden = true;
      el.dirP.hidden = true;
    }
  }

  function onDirective(e) {
    pushLog('Goal done — ' + e.done.title + '.', 'ok');
    if (e.next) pushLog('<b>Next goal:</b> ' + e.next.title, 'teach', true);
    el.directive.classList.remove('complete');
    void el.directive.offsetWidth;
    el.directive.classList.add('complete');
  }

  /* ---------------------------------------------------------------- */
  /* Explanations when something new appears                          */
  /* ---------------------------------------------------------------- */

  function kindOf(entry) {
    if (entry.growth || entry.perCount) return 'New machine';
    if (entry.kind === 'research') return 'New research';
    return 'New upgrade';
  }

  function announceUnlock(entry) {
    pushLog('<b>' + kindOf(entry) + ' — ' + entry.name + '</b><br>' +
      E.introFor(entry), 'teach', true);
  }

  function announceBatch(list) {
    const tabs = {};
    list.forEach(e => {
      const id = e.tab || 'anomaly';
      tabs[id] = (tabs[id] || 0) + 1;
    });
    const where = Object.keys(tabs).map(id => {
      const t = C.TABS.find(x => x.id === id);
      return tabs[id] + ' in ' + (t ? tabLabel(t) : id.toUpperCase());
    }).join(', ');
    pushLog('<b>' + list.length + ' new things available</b><br>' + where +
      '. Anything marked NEW explains itself on its card.', 'teach', true);
  }

  function onDepthMark(mk) {
    pushLog(FMT.depth(mk.at) + ' — ' + mk.name + '. ' + mk.note,
      mk.gate ? 'story' : 'warn');
  }

  function showBriefing(b) {
    openModal({
      k: b.k, t: b.t,
      bodyHTML: `<div class="goal">${b.lead}</div>
        <ul class="teachlist">${b.items.map(([h, p]) =>
        `<li><h4>${h}</h4><p>${p}</p></li>`).join('')}</ul>`,
      buttons: [{ label: 'Got it', cls: 'btn btn--primary', action: closeModal }]
    });
  }

  function showPrologue(then) {
    const p = C.PROLOGUE;
    const boot = p.boot.map(([k, v], i) =>
      `<li style="animation-delay:${0.12 + i * 0.22}s"><span>${k}</span><i></i><b>${v}</b></li>`).join('');
    const paras = p.paras.map((t, i) =>
      `<p style="animation-delay:${0.5 + (p.boot.length * 0.22) + i * 0.25}s">${t}</p>`).join('');
    const tail = 0.5 + (p.boot.length * 0.22) + p.paras.length * 0.25;

    openModal({
      wide: true, staged: true,
      k: p.eyebrow, t: p.title,
      bodyHTML: `<ul class="bootlines">${boot}</ul>
        <div class="letter">${paras}</div>
        <div class="goal" style="animation-delay:${tail}s">${p.goal}</div>
        <p class="kicker" style="animation-delay:${tail + 0.3}s">${p.kicker}</p>`,
      buttons: [{
        label: p.cta, cls: 'btn btn--primary',
        action: () => { closeModal(); if (then) then(); }
      }]
    });
  }

  function showIntro() {
    const i = C.INTRO;
    openModal({
      k: i.k, t: i.t,
      bodyHTML: `<div class="goal">${i.goal}</div>
        <ul class="teachlist">${i.steps.map(([h, p]) =>
        `<li><h4>${h}</h4><p>${p}</p></li>`).join('')}</ul>
        <p class="note" style="margin-top:18px">${i.footer}</p>`,
      buttons: [{
        label: 'Start work', cls: 'btn btn--primary',
        action: () => { E.markIntroDone(); closeModal(); }
      }]
    });
  }

  function showOpening() { showPrologue(showIntro); }

  /* ---------------------------------------------------------------- */
  /* Menu screen                                                      */
  /* ---------------------------------------------------------------- */

  let menuOpen = false;
  let pendingReport = null;

  function menuButton(label, cls, action, sub) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'menubtn' + (cls ? ' ' + cls : '');
    b.innerHTML = '<span>' + label + '</span>' + (sub ? '<em>' + sub + '</em>' : '');
    b.addEventListener('click', action);
    return b;
  }

  function showMenu(opts) {
    if (opts && opts.report !== undefined) pendingReport = opts.report;
    const s = E.state();
    const done = !!s.flags.ended;
    const has = E.hasProgress();

    /* a line about the run waiting behind this screen */
    if (has) {
      el.menuSave.hidden = false;
      el.menuSave.innerHTML = done
        ? '<b>' + E.mode().name + ' complete</b> &middot; finished in ' + FMT.clock(s.stats.active) +
          ' &middot; ' + FMT.int(s.stats.purchases) + ' things built'
        : '<b>' + E.mode().name + '</b> &middot; ' + (C.STAGE_NAMES[s.stage] || '') +
          ' &middot; ' + FMT.clock(s.stats.active) + ' on the clock &middot; ' +
          FMT.depth(s.depth) + ' down';
    } else {
      el.menuSave.hidden = true;
    }

    el.menuBtns.innerHTML = '';
    if (has) {
      el.menuBtns.appendChild(menuButton(
        done ? 'Look around the finished facility' : 'Continue your shift',
        done ? '' : 'menubtn--primary', resume));
    }
    el.menuBtns.appendChild(menuButton(
      has ? 'Start a new run' : 'Start work',
      has && !done ? '' : 'menubtn--primary',
      () => { has ? confirmNewGame() : showModePicker(); },
      has ? 'Deletes the run above · choose a mode' : 'Choose a mode'));
    el.menuBtns.appendChild(menuButton('How to play', '', () => showIntro()));
    el.menuBtns.appendChild(menuButton('Read the opening', '', () => showPrologue(null)));

    el.menu.hidden = false;
    menuOpen = true;
    document.body.dataset.menu = '1';
    const first = el.menuBtns.querySelector('button');
    if (first) first.focus({ preventScroll: true });
  }

  function hideMenu() {
    el.menu.hidden = true;
    menuOpen = false;
    document.body.dataset.menu = '0';
  }

  /** Continue the run that is already loaded. */
  function resume() {
    hideMenu();
    render(true);
    if (pendingReport) {
      const r = pendingReport;
      pendingReport = null;
      pushLog('Standby period of ' + FMT.time(r.elapsed) + ' reconciled.', 'ok');
      showOfflineReport(r);
    }
  }

  /** Pick a mode, then run the opening. */
  function showModePicker() {
    const cards = C.MODES.map(m => `
      <li class="mode" data-mode="${m.id}">
        <button type="button" data-pick="${m.id}">
          <span class="mode__n">${m.name}</span>
          <span class="mode__t">${m.tagline}</span>
          <ul class="mode__b">${m.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
        </button>
      </li>`).join('');

    openModal({
      wide: true,
      k: 'Before you clock in',
      t: 'Choose how this run works',
      bodyHTML: `<p class="note" style="margin-bottom:16px">You cannot change this once the run
        starts, but you can begin a different run from the menu whenever you like.</p>
        <ul class="modelist">${cards}</ul>`,
      buttons: [{ label: 'Back to the menu', cls: 'btn', action: () => { closeModal(); showMenu(); } }]
    });

    modalOpen.querySelectorAll('[data-pick]').forEach(b => {
      b.addEventListener('click', () => { closeModal(); startNewGame(b.dataset.pick); });
    });
  }

  function confirmNewGame() {
    openModal({
      k: 'Are you sure?',
      t: 'Start a new run?',
      bodyHTML: `<p class="note">This deletes the run on the menu behind this box — every machine,
        upgrade, paper and all your progress — and starts again from the first button press.
        <b>It cannot be undone.</b></p>`,
      buttons: [
        { label: 'No, go back', cls: 'btn', action: closeModal },
        { label: 'Yes, choose a mode', cls: 'btn btn--danger', action: () => { closeModal(); showModePicker(); } }
      ]
    });
  }

  function startNewGame(modeId) {
    pendingReport = null;
    E.newGame(modeId);
    el.log.innerHTML = '';
    panelSig = ''; tickerSig = ''; el.tabbar.dataset.sig = '';
    C.BOOT_LOG.forEach(l => pushLog(l[0], l[1]));
    hideMenu();
    rebuildTabs();
    render(true);
    showPrologue(() => { showIntro(); });
  }

  /* ---------------------------------------------------------------- */
  /* Bug reports and suggestions                                      */
  /* ---------------------------------------------------------------- */

  function showReport() {
    const s = E.state();
    const where = [E.mode().name, C.STAGE_NAMES[s.stage] || '', FMT.clock(s.stats.active)]
      .filter(Boolean).join('  ·  ');

    openModal({
      k: 'Bug report or suggestion',
      t: 'Found a problem, or had an idea?',
      bodyHTML: `<p class="note">Send it to the address below. It helps a lot to say what you
          were doing, which mode you were in, and roughly how far through you were.</p>
        <div class="mailbox">
          <input class="mailbox__a" id="reportMail" readonly value="${C.CONTACT.email}"
            aria-label="Email address for bug reports" spellcheck="false">
          <button class="btn btn--primary" id="btnCopyMail" type="button">Copy address</button>
        </div>
        <p class="mailbox__note" id="copyNote">Worth mentioning: <b>${where}</b></p>`,
      buttons: [{ label: 'Close', cls: 'btn', action: closeModal }]
    });

    const input = document.getElementById('reportMail');
    const btn = document.getElementById('btnCopyMail');
    const note = document.getElementById('copyNote');
    const said = (msg, ok) => {
      btn.textContent = ok ? 'Copied' : 'Copy address';
      note.innerHTML = msg;
      if (ok) setTimeout(() => { btn.textContent = 'Copy address'; }, 2500);
    };

    btn.addEventListener('click', () => {
      const text = C.CONTACT.email;
      /* the clipboard API needs a secure context, which a file:// copy of
         the game is not — so always leave a way to copy by hand */
      const manual = () => {
        input.focus();
        input.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        said(ok ? 'Copied to your clipboard.'
          : 'The address is selected — press Ctrl+C (or Cmd+C) to copy it.', ok);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text)
          .then(() => said('Copied to your clipboard.', true), manual);
      } else {
        manual();
      }
    });

    input.addEventListener('focus', () => input.select());
  }

  /* ---------------------------------------------------------------- */
  /* Tabs                                                            */
  /* ---------------------------------------------------------------- */

  function visibleTabs() {
    const s = E.state();
    return C.TABS.filter(t => {
      if (t.id === 'archive') return s.docs.length > 0;
      if (t.id === 'system') return true;
      if (t.flag) return !!E.flag(t.flag);    // SPACE waits for the sky to be lit
      return s.stage >= t.stage;
    });
  }

  function tabLabel(t) { return t.label; }

  function rebuildTabs() {
    const s = E.state();
    const list = visibleTabs();
    if (!list.some(t => t.id === s.tab)) s.tab = list[0].id;
    const sig = list.map(t => tabLabel(t) + (s.seenTabs[t.id] ? '' : '*')).join('|') + '|' + s.tab;
    if (el.tabbar.dataset.sig === sig) return;
    el.tabbar.dataset.sig = sig;

    el.tabbar.innerHTML = list.map(t =>
      `<button class="tab${s.seenTabs[t.id] ? '' : ' new'}" type="button" role="tab"
         id="tab-${t.id}" data-tab="${t.id}" aria-controls="panel"
         aria-selected="${t.id === s.tab}" tabindex="${t.id === s.tab ? 0 : -1}"
        >${tabLabel(t)}</button>`).join('');

    el.tabbar.querySelectorAll('[data-tab]').forEach(b => {
      b.addEventListener('click', () => selectTab(b.dataset.tab));
      b.addEventListener('keydown', ev => {
        const dir = /Down|Right/.test(ev.key) ? 1 : /Up|Left/.test(ev.key) ? -1 : 0;
        if (!dir) return;
        ev.preventDefault();
        const ids = visibleTabs().map(t => t.id);
        const i = ids.indexOf(E.state().tab);
        selectTab(ids[(i + dir + ids.length) % ids.length]);
        const next = document.getElementById('tab-' + E.state().tab);
        if (next) next.focus();
      });
    });
    el.panel.setAttribute('aria-labelledby', 'tab-' + s.tab);
    measureTabs();
  }

  /** The log is sticky underneath the switcher, so it needs its height. */
  function measureTabs() {
    if (!el.tabbar) return;
    document.documentElement.style.setProperty('--tabs-h', el.tabbar.offsetHeight + 'px');
  }

  function selectTab(id) {
    const s = E.state();
    if (s.tab !== id) E.clearFresh(s.tab);
    s.tab = id;
    s.seenTabs[id] = true;
    panelSig = '';
    el.tabbar.dataset.sig = '';
    rebuildTabs();
    render();
  }

  /* ---------------------------------------------------------------- */
  /* Panel                                                           */
  /* ---------------------------------------------------------------- */

  function panelSignature() {
    const s = E.state();
    const parts = [s.tab, buyAmt, s.flags.cosmic ? 'c' : ''];
    if (s.tab === 'archive') parts.push(s.docs.length);
    else if (s.tab === 'system') parts.push('sys');
    else {
      const a = E.actionForTab(s.tab);
      parts.push('act:' + (a ? a.id + (E.pressCount(a) > 0 ? '+' : '') : '-'));
      parts.push('mark:' + s.depthMark);
      const mark = e => e.id + (E.owned(e.id) ? '!' : '') + (E.isFresh(e.id) ? '~' : '');
      C.PRODUCERS.forEach(p => { if (p.tab === s.tab && E.visible(p)) parts.push(mark(p)); });
      C.RESEARCH.forEach(r => { if (r.tab === s.tab && E.visible(r)) parts.push(mark(r)); });
      C.UPGRADES.forEach(u => { if (u.tab === s.tab && E.visible(u)) parts.push(mark(u)); });
    }
    return parts.join(',');
  }

  function buildPanel() {
    const s = E.state();
    const tab = C.TABS.find(t => t.id === s.tab);
    cards = new Map();
    pan = {};

    let html = '';
    if (s.tab === 'archive') html = `<p class="brief">${tab.brief}</p>` + archiveHTML();
    else if (s.tab === 'system') html = `<p class="brief">${tab.brief}</p>` + systemHTML();
    else {
      html = consoleHTML(s.tab) + depthHTML(s.tab) +
        `<p class="brief">${tab.brief}</p>` + stageHTML(s.tab);
    }

    el.panel.innerHTML = html;

    if (s.tab === 'system') { wireSystem(); return; }
    if (s.tab === 'archive') return;

    ['actStage', 'actBtn', 'actLabel', 'actGain', 'actDesc', 'autoLine'].forEach(id => {
      pan[id] = el.panel.querySelector('#' + id);
    });
    pan.depthNow = el.panel.querySelector('[data-depth-now]');
    pan.depthRate = el.panel.querySelector('[data-depth-rate]');
    pan.depthFill = el.panel.querySelector('[data-depth-fill]');
    pan.depthNext = el.panel.querySelector('[data-depth-next]');
    pan.depthEta = el.panel.querySelector('[data-depth-eta]');

    if (pan.actBtn) pan.actBtn.addEventListener('click', act);

    el.panel.querySelectorAll('[data-buy-p]').forEach(b => {
      b.addEventListener('click', () => { if (E.buyProducer(b.dataset.buyP, buyAmt)) render(); });
    });
    el.panel.querySelectorAll('[data-buy-u]').forEach(b => {
      b.addEventListener('click', () => { if (E.buyUpgrade(b.dataset.buyU)) { rebuildTabs(); render(); } });
    });
    el.panel.querySelectorAll('[data-toggle]').forEach(b => {
      b.addEventListener('click', () => { if (E.toggleProducer(b.dataset.toggle)) render(); });
    });
    el.panel.querySelectorAll('[data-amt]').forEach(b => {
      b.addEventListener('click', () => {
        buyAmt = b.dataset.amt === 'max' ? 'max' : parseInt(b.dataset.amt, 10);
        panelSig = '';
        render();
      });
    });
    const rb = el.panel.querySelector('#openResearch');
    if (rb) rb.addEventListener('click', showResearch);
    collectCards();
  }

  /* --- the tab's own button ---------------------------------------- */

  function consoleHTML(tabId) {
    const a = E.actionForTab(tabId);
    if (!a) return '';
    return `<section class="console">
      <div class="console__head"><span class="eyebrow">Main button for this section</span></div>
      <div class="console__stage" id="actStage">
        <button class="actbtn" id="actBtn" type="button">
          <span class="actbtn__label" id="actLabel">${a.label}</span>
          <span class="actbtn__gain" id="actGain"></span>
          <span class="actbtn__hint">Click it, or press Space</span>
        </button>
      </div>
      <p class="actdesc" id="actDesc">${a.desc}</p>
      <div class="autoline" id="autoLine" hidden></div>
    </section>`;
  }

  function syncConsole() {
    if (!pan.actBtn) return;
    const a = E.actionForTab(E.state().tab);
    if (!a) return;

    const bits = [resIcon(a.res, 13) + '+' + FMT.n(E.clickGain(a)) + ' ' + E.abbr(a.res)];
    if (a.depth) bits.push(icon(C.DEPTH_ICON, 13) + '+' +
      FMT.n(E.clickDepth(a) * E.mult().depth) + ' m deeper');
    const txt = bits.join('  <s>&middot;</s>  ');
    if (pan.actGain.innerHTML !== txt) pan.actGain.innerHTML = txt;
    pan.actBtn.setAttribute('aria-label', a.label + ': gives ' +
      FMT.n(E.clickGain(a)) + ' ' + E.abbr(a.res) + ' each press');

    /* Hands Off: once the allowance is gone, the button is done */
    const left = E.pressesLeft();
    const spent = left <= 0;
    pan.actBtn.disabled = spent;
    pan.actBtn.classList.toggle('spent', spent);
    if (spent) {
      pan.actGain.innerHTML = 'No presses left — the machines take it from here';
    } else if (isFinite(left)) {
      pan.actGain.innerHTML += '  <s>&middot;</s>  ' + left + ' presses left';
    }

    const presses = E.pressRate(a);
    pan.actBtn.dataset.auto = presses > 0 ? '1' : '0';
    if (presses > 0) {
      pan.autoLine.hidden = false;
      const html = 'Automatic: <b>machines are pressing this ' + FMT.n(presses) +
        '× per second</b> — you do not need to.';
      if (pan.autoLine.innerHTML !== html) pan.autoLine.innerHTML = html;
    } else if (pan.autoLine) {
      pan.autoLine.hidden = true;
    }
  }

  function currentAction() { return E.actionForTab(E.state().tab); }

  function act() {
    const a = currentAction();
    if (!a) return;
    if (E.doAction(a.id)) render();
  }

  function onAction(e) {
    const parts = [];
    for (const k in e.gains) parts.push(resIcon(k, 13) + '+' + FMT.n(e.gains[k]));
    if (e.depth) parts.push(icon(C.DEPTH_ICON, 13) + '+' + FMT.n(e.depth) + ' m');
    floater(parts.join(' '), false);
  }

  /* --- machines pressing the button for you ------------------------ */

  const AUTO_PULSE_MS = 600;

  function autoPulse() {
    if (!pan.actBtn || modalOpen || researchOpen || menuOpen) return;
    const a = currentAction();
    if (!a || E.pressCount(a) <= 0) return;
    if (document.visibilityState === 'hidden') return;

    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      pan.actBtn.classList.remove('autopress');
      void pan.actBtn.offsetWidth;
      pan.actBtn.classList.add('autopress');
      setTimeout(() => pan.actBtn && pan.actBtn.classList.remove('autopress'), 170);
    }

    const parts = [resIcon(a.res, 13) + '+' + FMT.n(E.clickGain(a))];
    if (a.depth) parts.push(icon(C.DEPTH_ICON, 13) + '+' + FMT.n(E.clickDepth(a) * E.mult().depth) + ' m');
    floater(parts.join(' '), true);
  }

  function floater(html, auto) {
    if (!pan.actStage) return;
    const f = document.createElement('span');
    f.className = 'floater' + (auto ? ' floater--auto' : '');
    f.innerHTML = html;
    f.style.left = (38 + Math.random() * 24) + '%';
    pan.actStage.appendChild(f);
    setTimeout(() => f.remove(), 950);
    while (pan.actStage.querySelectorAll('.floater').length > 14) {
      pan.actStage.querySelector('.floater').remove();
    }
  }

  /* --- depth bar ---------------------------------------------------- */

  function showsDepth(tabId) {
    return tabId === 'excavation' || tabId === 'anomaly' ||
      (tabId === 'expansion' && !E.state().flags.coreBreached);
  }

  function depthHTML(tabId) {
    if (!showsDepth(tabId)) return '';
    return `<section class="depthpanel">
      <div class="depthpanel__top">
        <div>
          <span class="eyebrow">${icon(C.DEPTH_ICON, 13)}How deep you are</span>
          <div class="depthpanel__v" data-depth-now>0 m</div>
        </div>
        <div class="depthpanel__rate" data-depth-rate>+0 m/s</div>
      </div>
      <div class="depthpanel__bar"><i data-depth-fill style="width:0%"></i></div>
      <div class="depthpanel__foot">
        <span data-depth-next></span>
        <span data-depth-eta></span>
      </div>
    </section>`;
  }

  function syncDepth() {
    if (!pan.depthFill) return;
    const s = E.state();
    const t = E.depthTarget();

    pan.depthNow.textContent = FMT.depth(s.depth);
    pan.depthRate.textContent = '+' + FMT.n(E.depthRate()) + ' m/s';

    if (!t) {
      pan.depthFill.style.width = '100%';
      pan.depthNext.textContent = 'Centre of the planet reached. Nothing deeper to find.';
      pan.depthEta.textContent = '';
      return;
    }
    pan.depthFill.style.width = (t.pct * 100).toFixed(1) + '%';
    pan.depthNext.innerHTML = 'Next: <b>' + t.mark.name + '</b> at ' + FMT.depth(t.mark.at) +
      (t.mark.gate ? ' — ' + t.mark.gate : '');
    pan.depthEta.textContent = FMT.depth(t.remaining) + ' to go' +
      (isFinite(t.eta) ? '  ·  about ' + FMT.time(t.eta) : '  ·  dig to make progress');
  }

  /* --- machines and upgrades ---------------------------------------- */

  function stageHTML(tabId) {
    const groups = [];
    const seen = {};
    C.PRODUCERS.forEach(p => {
      if (p.tab !== tabId || !E.visible(p)) return;
      if (!seen[p.group]) { seen[p.group] = []; groups.push(p.group); }
      seen[p.group].push(p);
    });

    let html = '';
    groups.forEach((g, i) => {
      html += `<div class="section">
        <div class="section__head"><h2>${g}</h2>${i === 0 ? buyModeHTML() : ''}</div>
        <div class="grid">${seen[g].map(producerCard).join('')}</div>
      </div>`;
    });

    /* research lives on its own screen rather than in this list */
    if (C.RESEARCH.some(r => r.tab === tabId && E.visible(r))) {
      const done = C.RESEARCH.filter(r => E.owned(r.id)).length;
      const ready = C.RESEARCH.filter(r => E.visible(r) && !E.owned(r.id) && E.canAfford(E.upgradeCost(r))).length;
      html += `<div class="section">
        <div class="section__head"><h2>RESEARCH</h2></div>
        <button class="researchbtn" id="openResearch" type="button">
          <span class="researchbtn__i">${icon(RES.frag, 26)}</span>
          <span class="researchbtn__t">Open the research tree
            <em>${done} of ${C.RESEARCH.length} done${ready ? ' · ' + ready + ' ready to buy now' : ''}</em>
          </span>
          <span class="researchbtn__c">${FMT.n(E.res('frag'))} fragments</span>
        </button>
      </div>`;
    }

    const ups = C.UPGRADES.filter(u => u.tab === tabId && E.visible(u));
    const open = ups.filter(u => !E.owned(u.id));
    const bought = ups.filter(u => E.owned(u.id));
    if (ups.length) {
      html += `<div class="section">
        <div class="section__head"><h2>UPGRADES &mdash; bought once, last forever</h2></div>
        ${open.length ? `<div class="grid">${open.map(u => upgradeCard(u, 'Upgrade')).join('')}</div>`
          : '<p class="empty">Nothing new to buy here right now.</p>'}
        ${bought.length ? boughtHTML(bought) : ''}
      </div>`;
    }
    if (!html) html = '<p class="empty">Nothing available here yet. Follow the goal box above.</p>';
    return html;
  }

  /** Purchased upgrades fold away so the list does not grow forever. */
  function boughtHTML(list) {
    return `<details class="boughtbox">
      <summary>${list.length} already bought <span>— click to show</span></summary>
      <div class="boughtpills">${list.map(u =>
      `<span class="boughtpill" title="${u.desc.replace(/"/g, '&quot;')}">
         <i aria-hidden="true">✓</i>${u.name}</span>`).join('')}</div>
    </details>`;
  }

  function buyModeHTML() {
    return `<div class="buymode" role="group" aria-label="How many to buy">
      ${[1, 10, 'max'].map(v =>
      `<button type="button" data-amt="${v}" aria-pressed="${String(buyAmt) === String(v)}"
          >${v === 'max' ? 'MAX' : '×' + v}</button>`).join('')}
    </div>`;
  }

  /** A picture of what goes in and what comes out. */
  function flowHTML(p) {
    const outs = [];
    if (p.prod) for (const k in p.prod) outs.push(resIcon(k, 17));
    if (p.depth) outs.push(icon(C.DEPTH_ICON, 17));
    if (p.autoAction) {
      const a = E.byAction[p.autoAction];
      outs.push(resIcon(a.res, 17));
    }
    const ins = [];
    if (p.use) for (const k in p.use) ins.push(resIcon(k, 17));

    if (!outs.length && !ins.length) {
      return `<span class="cardflow"><svg class="ico" width="17" height="17" viewBox="0 0 24 24"
        aria-hidden="true" style="color:var(--accent)"><use href="#i-spark"></use></svg></span>`;
    }
    if (ins.length) {
      return `<span class="cardflow">${ins.join('')}<i aria-hidden="true">→</i>${outs.join('')}</span>`;
    }
    return `<span class="cardflow">${outs.join('')}</span>`;
  }

  function producerCard(p) {
    const fresh = E.isFresh(p.id);
    return `<article class="card${fresh ? ' fresh' : ''}" data-card="${p.id}">
      <div class="card__head">
        ${flowHTML(p)}
        <h3 class="card__name">${p.name}</h3>
        ${fresh ? '<span class="pill">New</span>' : ''}
        <span class="card__count" data-count="${p.id}">0</span>
      </div>
      <div class="card__tagline">${p.tagline || ''}</div>
      <p class="card__desc">${p.desc}</p>
      ${fresh ? `<p class="card__intro">${E.introFor(p)}</p>` : ''}
      <ul class="card__stats">${producerLines(p).map((l, i) =>
      `<li class="${l.kind}" data-line="${p.id}:${i}"></li>`).join('')}</ul>
      <div class="cardfoot">
        <button class="buy" type="button" data-buy-p="${p.id}"></button>
        ${E.canToggle(p) ? `<button class="toggle" type="button" data-toggle="${p.id}"
          aria-pressed="true"><i aria-hidden="true"></i><span>ON</span></button>` : ''}
      </div>
    </article>`;
  }

  function producerLines(p) {
    const lines = [];
    if (p.autoAction) {
      const a = E.byAction[p.autoAction];
      lines.push({
        kind: 'out', get: () => {
          const n = E.count(p.id);
          return 'Presses ' + a.short + '  +' + FMT.n(p.pressRate || 1) + '/s each' +
            (n ? '  →  ' + FMT.n(E.pressRate(a)) + ' presses/s total' : '');
        }
      });
      lines.push({
        kind: 'total', get: () => {
          const n = E.count(p.id);
          if (!n) return '';
          return 'Worth ' + FMT.n(E.clickGain(a) * E.pressRate(a)) + ' ' + E.abbr(a.res) + '/s';
        }
      });
    }
    if (p.prod) for (const k in p.prod) {
      lines.push({
        kind: 'out', get: () => {
          const each = p.prod[k] * E.pMult(p) * E.effMult(p) * E.mult().all * (E.mult().res[k] || 1);
          const n = E.count(p.id);
          return E.abbr(k) + '  +' + FMT.n(each) + '/s each' +
            (n ? '  →  ' + FMT.n(each * n * (E.isConverter(p) ? E.ratioOf(p.id) : 1)) + '/s total' : '');
        }
      });
    }
    if (p.use) for (const k in p.use) {
      lines.push({
        kind: 'in', get: () => {
          const each = p.use[k] * E.pMult(p) * E.mult().all;
          const n = E.count(p.id);
          return 'uses ' + E.abbr(k) + '  −' + FMT.n(each) + '/s each' +
            (n ? '  →  −' + FMT.n(each * n * E.ratioOf(p.id)) + '/s total' : '');
        }
      });
    }
    if (p.depth) {
      lines.push({
        kind: 'out', get: () => {
          const each = p.depth * E.pMult(p) * E.mult().all * E.mult().depth;
          const n = E.count(p.id);
          return 'DEPTH  +' + FMT.n(each) + ' m/s each' +
            (n ? '  →  ' + FMT.n(each * n) + ' m/s total' : '');
        }
      });
    }
    if (p.perCount) {
      lines.push({
        kind: 'out', get: () => {
          const mod = p.perCount[0];
          const n = E.count(p.id);
          return FMT.x(mod.f) + ' each  →  ' + FMT.x(Math.pow(mod.f, n)) + ' right now';
        }
      });
    }
    if (p.use) {
      lines.push({
        kind: 'warnline', get: () => {
          const n = E.count(p.id);
          if (!n) return '';
          if (E.isOff(p.id)) return 'Switched off — using nothing, making nothing.';
          const rt = E.ratioOf(p.id);
          if (rt > 0.995) return '';
          const short = Object.keys(p.use).filter(k => E.res(k) < 1).map(k => E.abbr(k));
          return 'Slowed to ' + Math.round(rt * 100) + '%' +
            (short.length ? ' — out of ' + short.join(' and ') : ' — not enough input');
        }
      });
    }
    return lines;
  }

  function upgradeCard(u, verb) {
    const fresh = E.isFresh(u.id) && !E.owned(u.id);
    const extra = fresh && C.INTROS[u.id] ? `<p class="card__intro">${C.INTROS[u.id]}</p>` : '';
    return `<article class="card${E.owned(u.id) ? ' bought' : ''}${fresh ? ' fresh' : ''}" data-card="${u.id}">
      <div class="card__head">
        <h3 class="card__name">${u.name}</h3>
        ${fresh ? '<span class="pill">New</span>' : ''}
      </div>
      <div class="card__tagline">${u.milestone ? 'Unlocks a section' : verb}</div>
      <p class="card__desc">${u.desc}</p>
      ${extra}
      <ul class="card__stats">${upgradeLines(u).map((l, i) =>
      `<li class="${l.kind}" data-line="${u.id}:${i}"></li>`).join('')}</ul>
      <div class="cardfoot"><button class="buy" type="button" data-buy-u="${u.id}"></button></div>
    </article>`;
  }

  /* Stat lines are written with textContent, so they take the plain form —
     icons only go where we set innerHTML (the buy buttons). */
  function upgradeLines(u) {
    return [{ kind: 'total', get: () => E.owned(u.id) ? 'Bought.' : 'Costs ' + costPlain(E.upgradeCost(u)) }];
  }

  function collectCards() {
    const s = E.state();
    const register = (entry, lines) => {
      const node = el.panel.querySelector(`[data-card="${entry.id}"]`);
      if (!node) return;
      cards.set(entry.id, {
        entry: entry, node: node,
        count: node.querySelector('[data-count]'),
        buy: node.querySelector('.buy'),
        toggle: node.querySelector('[data-toggle]'),
        lines: lines.map((l, i) => ({
          get: l.get, node: node.querySelector(`[data-line="${entry.id}:${i}"]`)
        }))
      });
    };
    C.PRODUCERS.forEach(p => { if (p.tab === s.tab && E.visible(p)) register(p, producerLines(p)); });
    C.UPGRADES.forEach(u => {
      if (u.tab === s.tab && E.visible(u) && !E.owned(u.id)) register(u, upgradeLines(u));
    });
  }

  function costText(cost) {
    return Object.keys(cost).map(k => resIcon(k, 12) + FMT.n(cost[k]) + ' ' + E.abbr(k)).join('  ');
  }

  function costPlain(cost) {
    return Object.keys(cost).map(k => FMT.n(cost[k]) + ' ' + E.abbr(k)).join(', ');
  }

  function refreshCards() {
    cards.forEach((c, id) => {
      const entry = c.entry;
      const isUpgrade = !entry.growth;
      c.lines.forEach(l => {
        const text = l.get();
        if (l.node && l.node.textContent !== text) {
          l.node.textContent = text;
          l.node.hidden = !text;
        }
      });

      if (isUpgrade) {
        const have = E.owned(id);
        const ucost = E.upgradeCost(entry);
        const aff = !have && E.canAfford(ucost);
        c.buy.innerHTML = have ? 'BOUGHT'
          : (entry.milestone ? 'UNLOCK' : 'BUY') + '  ·  ' + costText(ucost);
        c.buy.disabled = have || !aff;
        c.buy.classList.toggle('owned', have);
        c.node.classList.toggle('affordable', aff);
        c.buy.setAttribute('aria-label',
          entry.name + ', costs ' + costPlain(ucost) + (aff ? '' : ', you cannot afford this yet'));
      } else {
        const n = E.count(id);
        if (c.count) c.count.textContent = FMT.int(n);
        const amt = buyAmt === 'max' ? Math.max(1, E.maxAffordable(entry)) : buyAmt;
        const cost = E.producerCost(entry, amt);
        const aff = E.canAfford(cost);
        c.buy.innerHTML = (buyAmt === 'max' ? 'BUY ' + FMT.int(amt) : 'BUY ' + amt) +
          '  ·  ' + costText(cost);
        c.buy.disabled = !aff;
        const off = E.isOff(id);
        if (c.toggle) {
          c.toggle.querySelector('span').textContent = off ? 'OFF' : 'ON';
          c.toggle.setAttribute('aria-pressed', String(!off));
          c.toggle.classList.toggle('isoff', off);
          c.toggle.setAttribute('aria-label', entry.name + ' is ' + (off ? 'off' : 'on') +
            ', press to switch ' + (off ? 'on' : 'off'));
        }
        c.node.classList.toggle('off', off);
        c.node.classList.toggle('affordable', aff);
        c.node.classList.toggle('idle', !off && E.isConverter(entry) && n > 0 && E.ratioOf(id) < 0.995);
        c.buy.setAttribute('aria-label',
          'Buy ' + amt + ' ' + entry.name + ', costs ' + costPlain(cost) + (aff ? '' : ', you cannot afford this yet'));
      }
    });
  }

  function flashCard(id) {
    const c = cards.get(id);
    if (!c) return;
    c.node.classList.remove('flash');
    void c.node.offsetWidth;
    c.node.classList.add('flash');
  }

  /* ---------------------------------------------------------------- */
  /* Research tree — its own screen                                   */
  /* ---------------------------------------------------------------- */

  function researchState(r, i) {
    if (E.owned(r.id)) return 'done';
    if (!E.visible(r)) return 'locked';
    return E.canAfford(E.upgradeCost(r)) ? 'ready' : 'waiting';
  }

  function researchHTML() {
    const held = E.res('frag');
    const rows = C.RESEARCH.map((r, i) => {
      const st = researchState(r, i);
      const prev = C.RESEARCH[i - 1];
      const lockWhy = st === 'locked'
        ? (prev && !E.owned(prev.id) ? 'Needs “' + prev.name + '” first' : 'Not available yet')
        : '';
      const rc = E.upgradeCost(r).frag;
      const label = st === 'done' ? 'Done'
        : st === 'locked' ? 'Locked'
          : st === 'ready' ? 'BUY · ' + FMT.n(rc) + ' FRAG'
            : 'Need ' + FMT.n(rc) + ' FRAG';
      return `<li class="rnode is-${st}">
        <div class="rnode__dot" aria-hidden="true">${st === 'done' ? '✓' : i + 1}</div>
        <div class="rnode__body">
          <h4>${r.name}</h4>
          <p>${st === 'locked' ? lockWhy : r.desc}</p>
          <button class="btn rnode__buy" type="button" data-research="${r.id}"
            ${st === 'ready' ? '' : 'disabled'}>${label}</button>
        </div>
      </li>`;
    }).join('');

    return `<div class="rhead">
        <span>${icon(RES.frag, 20)}<b>${FMT.n(held)}</b> Ruin Fragments</span>
        <span class="rhead__rate">${FMT.n(E.grossRate('frag'))}/s from Sifters</span>
      </div>
      <p class="note" style="margin-bottom:16px">Research unlocks in order, cheapest first.
        Fragments come only from Fragment Sifters — pressing the button never finds one.</p>
      <ol class="rtree">${rows}</ol>`;
  }

  function renderResearch() {
    if (!modalOpen) return;
    const body = modalOpen.querySelector('.modal__body');
    if (!body) return;
    body.innerHTML = researchHTML();
    body.querySelectorAll('[data-research]').forEach(b => {
      b.addEventListener('click', () => {
        if (E.buyUpgrade(b.dataset.research)) { renderResearch(); panelSig = ''; render(); }
      });
    });
  }

  function showResearch() {
    researchOpen = true;
    openModal({
      wide: true,
      k: 'Research', t: 'The research tree',
      bodyHTML: '<div class="modal__body"></div>',
      onClose: () => { researchOpen = false; },
      buttons: [{ label: 'Close', cls: 'btn btn--primary', action: closeModal }]
    });
    renderResearch();
  }

  /* ---------------------------------------------------------------- */
  /* Archive                                                         */
  /* ---------------------------------------------------------------- */

  function archiveHTML() {
    const docs = E.state().docs;
    if (!docs.length) return '<p class="empty">Nothing found yet.</p>';
    return '<div class="docs">' + docs.slice().reverse().map(id => {
      const d = C.DOCS[id];
      if (!d) return '';
      return `<article class="doc">
        <div class="doc__src">${d.src}</div>
        <h3 class="doc__title">${d.title}</h3>
        <p class="doc__body">${d.body}</p>
      </article>`;
    }).join('') + '</div>';
  }

  /* ---------------------------------------------------------------- */
  /* System tab                                                      */
  /* ---------------------------------------------------------------- */

  const SYS_STATS = [
    ['Mode', () => E.mode().name],
    ['Shift time', () => FMT.clock(E.state().stats.active)],
    ['Button presses', () => FMT.int(E.state().stats.clicks)],
    ['Things bought', () => FMT.int(E.state().stats.purchases)],
    ['Deepest point', () => FMT.depth(E.state().depth)],
    ['Everything multiplier', () => FMT.x(E.mult().all)],
    ['Papers found', () => E.state().docs.length + ' of ' + Object.keys(C.DOCS).length],
    ['While game is closed', () => Math.round(E.mult().offRate * 100) + '% for ' + FMT.time(E.mult().offCap)],
    ['Section', () => C.STAGE_NAMES[E.state().stage] || '—']
  ];

  function systemHTML() {
    return `
      <div class="section">
        <div class="section__head"><h2>YOUR RECORD</h2></div>
        <dl class="stats">${SYS_STATS.map(([k], i) =>
      `<div><dt>${k}</dt><dd data-stat="${i}">—</dd></div>`).join('')}</dl>
      </div>
      <div class="section">
        <div class="section__head"><h2>SAVING</h2></div>
        <p class="note">The game saves itself to this browser every ten seconds, and again when you
          close the tab. Your machines keep earning while the game is closed.</p>
        <div class="row" style="margin-top:12px">
          <button class="btn btn--primary" id="btnSave" type="button">Save now</button>
          <button class="btn" id="btnExport" type="button">Copy save code</button>
          <button class="btn" id="btnImport" type="button">Load save code</button>
          <span class="note" id="saveMsg" aria-live="polite"></span>
        </div>
        <textarea class="io" id="ioBox" spellcheck="false" hidden aria-label="Save code"></textarea>
      </div>
      <div class="section">
        <div class="section__head"><h2>START OVER</h2></div>
        <p class="note">This deletes everything — money, machines, upgrades, papers, progress — and
          starts you at the very beginning. <b>It cannot be undone.</b> Copy your save code first if you
          might want this run back.</p>
        <div class="row" style="margin-top:12px">
          <button class="btn btn--danger" id="btnReset" type="button">Delete save and start over</button>
        </div>
      </div>
      <div class="section">
        <div class="section__head"><h2>CONTROLS</h2></div>
        <p class="note">Space or Enter presses the current section's button once — holding it down does
          not repeat, so buy Button Pressers instead. Number keys 1–${visibleTabs().length} switch
          section. Escape closes a pop-up. The <b>GOAL</b> box always tells you what to do next.</p>
        <div class="row" style="margin-top:12px">
          <button class="btn" id="btnStory" type="button">Read the opening again</button>
          <button class="btn" id="btnIntro" type="button">Show the how-to-play again</button>
        </div>
      </div>`;
  }

  function refreshSystem() {
    sysRefs.forEach(r => {
      const v = r.get();
      if (r.node.textContent !== v) r.node.textContent = v;
    });
  }

  function wireSystem() {
    sysRefs = SYS_STATS.map(([, get], i) => ({
      get: get, node: el.panel.querySelector(`[data-stat="${i}"]`)
    })).filter(r => r.node);
    refreshSystem();

    const msg = document.getElementById('saveMsg');
    const io = document.getElementById('ioBox');
    const say = t => { if (msg) msg.textContent = t; };

    document.getElementById('btnSave').addEventListener('click', () => {
      say(E.save() ? 'Saved at ' + FMT.stamp() + '.' : 'This browser will not let the game save.');
    });
    document.getElementById('btnExport').addEventListener('click', () => {
      io.hidden = false;
      io.value = E.exportSave();
      io.select();
      say('Copy this text and keep it somewhere safe.');
    });
    document.getElementById('btnImport').addEventListener('click', () => {
      if (io.hidden) { io.hidden = false; io.value = ''; io.focus(); say('Paste a save code, then press this again.'); return; }
      const err = E.importSave(io.value);
      if (err) { say(err); return; }
      io.hidden = true;
      panelSig = ''; tickerSig = ''; el.tabbar.dataset.sig = '';
      rebuildTabs(); render(true);
      pushLog('Save code loaded.', 'ok');
      say('Loaded.');
    });
    document.getElementById('btnReset').addEventListener('click', confirmReset);
    document.getElementById('btnIntro').addEventListener('click', showIntro);
    document.getElementById('btnStory').addEventListener('click', () => showPrologue(null));
  }

  function confirmReset() {
    openModal({
      k: 'Are you sure?',
      t: 'Delete your save and start over?',
      bodyHTML: `<p class="note">Everything goes: your money, every machine, every upgrade, every paper
        you have found, and all your progress. You will start from the very first button press.
        <b>This cannot be undone.</b></p>`,
      buttons: [
        { label: 'No, keep playing', cls: 'btn', action: closeModal },
        {
          label: 'Yes, delete everything', cls: 'btn btn--danger', action: () => {
            const ok = E.wipe();
            closeModal();
            if (ok) location.reload();
            else pushLog('This browser would not let the save be deleted. Check that site data is not blocked.', 'warn');
          }
        }
      ]
    });
  }

  /* ---------------------------------------------------------------- */
  /* Log                                                             */
  /* ---------------------------------------------------------------- */

  function pushLog(text, kind, html) {
    if (!el.log) return;
    const li = document.createElement('li');
    li.className = (kind || 'sys') + ' enter';
    li.innerHTML = `<time>${FMT.stamp()}</time><span></span>`;
    const span = li.querySelector('span');
    if (html) span.innerHTML = text; else span.textContent = text;
    el.log.appendChild(li);
    while (el.log.children.length > 70) el.log.removeChild(el.log.firstChild);
    el.log.scrollTop = el.log.scrollHeight;
  }

  /* ---------------------------------------------------------------- */
  /* Banner / modals                                                 */
  /* ---------------------------------------------------------------- */

  function showBanner(b) {
    const node = document.createElement('div');
    node.className = 'banner';
    node.setAttribute('aria-hidden', 'true');
    node.innerHTML = `<div class="banner__inner">
      <div class="banner__k">${b.k}</div>
      <div class="banner__t">${b.t}</div>
      ${b.s ? `<div class="banner__s">${b.s}</div>` : ''}
    </div>`;
    document.body.appendChild(node);
    setTimeout(() => node.remove(), 3500);
  }

  let modalOnClose = null;

  function openModal(cfg) {
    closeModal();
    const node = document.createElement('div');
    node.className = 'modal';
    node.setAttribute('role', 'dialog');
    node.setAttribute('aria-modal', 'true');
    node.innerHTML = `<div class="modal__box${cfg.wide ? ' modal__box--wide' : ''}${cfg.staged ? ' staged' : ''}" tabindex="-1">
      <div class="modal__k">${cfg.k}</div>
      <h2 class="modal__t">${cfg.t}</h2>
      ${cfg.bodyHTML || ''}
      <div class="row"></div>
    </div>`;
    const row = node.querySelector('.row');
    (cfg.buttons || []).forEach(b => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = b.cls || 'btn';
      btn.textContent = b.label;
      btn.addEventListener('click', b.action);
      row.appendChild(btn);
    });
    document.body.appendChild(node);
    modalOpen = node;
    modalOnClose = cfg.onClose || null;
    const box = node.querySelector('.modal__box');
    if (box) box.focus({ preventScroll: true });
    node.scrollTop = 0;
  }

  function closeModal() {
    if (!modalOpen) return;
    modalOpen.remove();
    modalOpen = null;
    if (modalOnClose) { const f = modalOnClose; modalOnClose = null; f(); }
  }

  function showOfflineReport(r) {
    const name = k => (RES[k] ? RES[k].name : k);
    const rows = Object.keys(r.gains).map(k =>
      `<div><dt>${icon(RES[k], 13)}${name(k)}</dt><dd>+${FMT.n(r.gains[k])}</dd></div>`).join('');
    openModal({
      k: 'While you were away',
      t: 'Gone for ' + FMT.time(r.elapsed),
      bodyHTML: `<p class="note">Your machines kept working at ${Math.round(r.rate * 100)}% speed${r.capped ? `, up to the ${FMT.time(r.counted)} limit` : ''}.</p>
        <dl class="stats" style="margin-top:12px">
          ${rows || '<div><dt>Earned</dt><dd>Nothing yet</dd></div>'}
          ${r.depth > 1 ? `<div><dt>Dug deeper</dt><dd>+${FMT.depth(r.depth)}</dd></div>` : ''}
        </dl>`,
      buttons: [{ label: 'Back to work', cls: 'btn btn--primary', action: closeModal }]
    });
  }

  function showEnding() {
    const e = C.ENDING;
    const s = E.state();
    const tail = e.lines.length * 0.75;
    const md = E.mode();
    const stats = [
      ['Mode', md.name],
      ['Shift time', FMT.clock(s.stats.active)],
      ['Buttons pressed', FMT.int(s.stats.clicks)],
      ['Things built', FMT.int(s.stats.purchases)],
      ['Papers found', s.docs.length + ' of ' + Object.keys(C.DOCS).length]
    ];
    /* Minimalist is the one mode that scores you */
    let scoreHTML = '';
    if (md.scored) {
      const n = E.machinesOwned();
      const band = n <= 120 ? ['Exemplary', 'Almost nothing wasted.']
        : n <= 260 ? ['Efficient', 'A tight operation.']
          : n <= 500 ? ['Adequate', 'Head office will accept this.']
            : ['Wasteful', 'You built rather a lot of that.'];
      scoreHTML = `<div class="score"><span class="score__n">${FMT.int(n)}</span>
        <span class="score__l">machines built<b>${band[0]}</b><em>${band[1]}</em></span></div>`;
    }
    openModal({
      wide: true, staged: true,
      k: e.k, t: e.t,
      bodyHTML: `<ul class="endlines">${e.lines.map((l, i) =>
        `<li style="animation-delay:${i * 0.75}s">${l}</li>`).join('')}</ul>
        <div class="congrats" style="animation-delay:${tail}s">
          <h3>Congratulations — you finished the game.</h3>
          <p>You took a three-floor air-quality contract and ended up running a star.
             There is nothing left to unlock.</p>
          ${scoreHTML}
          <dl class="stats">${stats.map(([k, v]) =>
            `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
        </div>`,
      buttons: [{
        label: 'Return to the menu', cls: 'btn btn--primary',
        action: () => { closeModal(); showMenu(); }
      }]
    });
  }

  /* ---------------------------------------------------------------- */
  /* Keyboard                                                        */
  /* ---------------------------------------------------------------- */

  function bindKeys() {
    document.addEventListener('keydown', ev => {
      if (ev.key === 'Escape' && modalOpen) { closeModal(); return; }
      if (modalOpen || menuOpen) return;
      const t = ev.target;
      const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
      if (typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;

      if (ev.key === ' ' && (!t || t.tagName !== 'BUTTON')) {
        /* holding the key down must not auto-fire: automation is something
           you buy, not something you get by leaning on the space bar */
        if (ev.repeat) { ev.preventDefault(); return; }
        if (currentAction()) { ev.preventDefault(); act(); }
        return;
      }
      if (/^[1-9]$/.test(ev.key)) {
        const list = visibleTabs();
        const idx = parseInt(ev.key, 10) - 1;
        if (list[idx]) { ev.preventDefault(); selectTab(list[idx].id); }
      }
    });
  }

  /* ---------------------------------------------------------------- */
  /* Render                                                          */
  /* ---------------------------------------------------------------- */

  function render(force) {
    const s = E.state();
    document.body.dataset.tab = s.tab;
    document.body.dataset.stage = String(s.stage);
    document.body.dataset.cosmic = s.flags.cosmic ? '1' : '0';

    el.stageName.textContent = C.STAGE_NAMES[s.stage] || 'Maintenance';
    el.depthVal.textContent = depthReadout();
    el.shiftTime.textContent = FMT.clock(s.stats.active);

    syncTicker();
    syncModeBar();
    syncDirective();
    rebuildTabs();

    const sig = panelSignature();
    if (force || sig !== panelSig) { panelSig = sig; buildPanel(); }

    if (s.tab === 'system') refreshSystem();
    else if (s.tab !== 'archive') { syncConsole(); syncDepth(); refreshCards(); }
  }

  return {
    boot, render, pushLog, showOfflineReport, showIntro, showOpening,
    showMenu, closeModal
  };
})();
</script>
<script>
/* ========================================================================
   main.js — boot sequence, simulation loop and autosave.
   ===================================================================== */

(() => {
  'use strict';

  const E = ENGINE;

  const TICK_MS = 125;        // simulation / refresh cadence
  const AUTOSAVE_MS = 10000;

  let uiReady = false;
  const buffered = [];

  /* --- boot ------------------------------------------------------- */

  E.on('log', e => { if (!uiReady) buffered.push(e); });

  const report = E.start();

  const mount = document.getElementById('app');
  UI.boot(mount);
  uiReady = true;
  buffered.forEach(e => UI.pushLog(e.text, e.kind));

  E.checkMilestones();
  UI.render(true);

  /* Every load opens on the title screen. Continuing shows the standby
     report; starting fresh runs the opening instead. */
  UI.showMenu({ report: report });

  /* --- simulation loop -------------------------------------------- */

  let last = Date.now();

  setInterval(() => {
    const now = Date.now();
    let dt = (now - last) / 1000;
    last = now;
    if (!(dt > 0)) return;

    if (dt > 2) {
      /* the tab was throttled or asleep: catch up in slices so that
         recipes throttle on real input availability. Not counted as time
         spent on the shift, because you were not here for it. */
      E.simulate(Math.min(dt, E.mult().offCap), Math.min(120, Math.ceil(dt)));
    } else {
      E.tick(dt, true);
    }
    E.checkMilestones();
    UI.render();
  }, TICK_MS);

  /* --- autosave --------------------------------------------------- */

  setInterval(() => { E.save(); }, AUTOSAVE_MS);

  const flush = () => { E.save(); };
  window.addEventListener('pagehide', flush);
  window.addEventListener('beforeunload', flush);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flush();
  });

  /* The message panel only reports things that actually happened —
     purchases, unlocks, goals, depth landmarks and story beats. Nothing
     is posted on a timer. */
})();
</script>
</body>
</html>
