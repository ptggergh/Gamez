<!doctype html>
<!-- The Deep Earth Corporate Bunker - single file build.
     Built from index.html + css/ + js/ by build.ps1.
     Edit those, not this file, then re-run: powershell -File build.ps1 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An incremental game about a maintenance technician in a retro-futuristic corporate bunker that turns out to go much deeper than the contract says.">
<title>The Deep Earth Corporate Bunker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Spectral:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<style>
/* ========================================================================
   The Deep Earth Corporate Bunker — facility terminal styling
   Single committed visual world (CRT phosphor on bitumen). Every colour is
   painted explicitly so the page holds on any host ground.
   ===================================================================== */

:root {
  /* --- ground + structure ------------------------------------------- */
  --ground:      #0a0b09;
  --ground-deep: #050605;
  --panel:       #12140f;
  --panel-2:     #171a13;
  /* large surfaces let only a hint of the moving ground through: the
     scene is meant to show in the gutters, not behind the text */
  --panel-glass: rgb(18 20 15 / .96);
  --line:        #242820;
  --line-soft:   #1b1e17;
  --line-mid:    #39402f;

  /* --- text --------------------------------------------------------- */
  --text:        #dad3c1;
  --text-strong: #f6f0e2;
  --muted:       #9d9684;
  --faint:       #7d7768;

  /* --- phosphor accents --------------------------------------------- */
  --amber:       #ffb648;
  --amber-deep:  #8a5f24;
  --rust:        #d2693f;
  --viol:        #bf92ff;
  --ice:         #a8dcff;

  /* --- semantic ----------------------------------------------------- */
  --ok:          #5fe08f;
  --warn:        #e8c45a;
  --bad:         #e8674f;

  /* --- live accent (re-pointed per stage) --------------------------- */
  --accent:      var(--amber);
  --accent-deep: var(--amber-deep);
  --glow:        255 182 72;

  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --serif: "Spectral", Iowan Old Style, Georgia, serif;

  --r: 2px;
  --gap: 14px;
}

/* Each section has its own colour. This follows the tab you are looking
   at, not your progress, so advancing never re-skins the whole game. */
body[data-tab="excavation"] {
  --accent: #d2693f; --accent-deep: #7d3b21; --glow: 210 105 63;
}
body[data-tab="anomaly"] {
  --accent: #bf92ff; --accent-deep: #6a4a96; --glow: 191 146 255;
}
body[data-tab="expansion"] {
  --accent: #7fc8f0; --accent-deep: #40708c; --glow: 127 200 240;
}
body[data-tab="space"] {
  --accent: #7fe6c0; --accent-deep: #34806a; --glow: 127 230 192;
}
body[data-tab="archive"] {
  --accent: #d9c9a0; --accent-deep: #8a7a54; --glow: 217 201 160;
}
body[data-tab="system"] {
  --accent: #9fb4c4; --accent-deep: #556a78; --glow: 159 180 196;
}

/* ===================== base ============================================ */

html, body { height: 100%; }

/* `hidden` must beat any display rule we set on the same element — several
   hidden elements here are flex containers, which would otherwise show. */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 500;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* a faint wash of the section's colour over the scene */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(120% 90% at 50% -10%, rgb(var(--glow) / .06), transparent 60%);
  transition: background 1.6s ease;
}

body::after {
  /* scanlines */
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 60;
  background: repeating-linear-gradient(
    to bottom,
    rgb(0 0 0 / .18) 0 1px,
    transparent 1px 3px
  );
  opacity: .45;
  mix-blend-mode: multiply;
}

/* The animated ground you are cutting through. This must be z-index:-1,
   not 0: a positioned element at 0 paints above the backgrounds and text
   of ordinary non-positioned blocks, which hides whole panels. */
#scene {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
}

::selection { background: rgb(var(--glow) / .3); color: var(--text-strong); }

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ===================== app shell ======================================= */

#app {
  position: relative;
  z-index: 1;
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

.statusbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: linear-gradient(var(--ground) 72%, rgb(10 11 9 / .88));
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(6px);
}

.statusbar__id {
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-wrap: wrap;
  padding: 11px 16px 9px;
  border-bottom: 1px solid var(--line-soft);
}

.facility {
  font-size: 12.5px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--muted);
}
.facility b {
  font-weight: 700;
  color: var(--text-strong);
  font-weight: 600;
}

.stagebadge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--accent);
}
.led {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 7px rgb(var(--glow) / .9);
  animation: pulse 3.4s ease-in-out infinite;
  flex: 0 0 auto;
}
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

/* how long you have been on this shift, ticking at the very top */
.shift {
  margin-left: auto;
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 3px 13px 4px;
  background: var(--panel-glass);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--faint);
}
.shift b {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .06em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

/* bug report / suggestion, sitting next to the shift timer */
.report {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 4px 13px 5px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
  transition: border-color .15s, color .15s, background .15s;
}
.report:hover {
  border-color: var(--accent-deep);
  color: var(--accent);
  background: rgb(var(--glow) / .08);
}
.report .ico { color: currentColor; }

/* the address, with a copy button */
.mailbox {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 14px;
}
.mailbox__a {
  flex: 1 1 240px;
  min-width: 0;
  background: var(--ground-deep);
  border: 1px solid var(--accent-deep);
  border-radius: var(--r);
  color: var(--accent);
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .04em;
  padding: 11px 13px;
}
.mailbox__a:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.mailbox__note {
  margin: 11px 0 0;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
}
.mailbox__note b { color: var(--text); font-weight: 600; }

.depth {
  font-size: 12.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.depth b { color: var(--text-strong); font-weight: 500; }

/* resource ticker ------------------------------------------------------- */

.ticker {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 10px;
}
.ticker::-webkit-scrollbar { display: none; }

.chip {
  flex: 0 0 auto;
  padding: 8px 15px 9px;
  border-right: 1px solid var(--line-soft);
  min-width: 118px;
}
.chip:last-child { border-right: 0; }
.chip__k {
  font-weight: 600;
  display: block;
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--faint);
}
/* the figure is coloured by the section the resource comes from */
.chip__v {
  display: block;
  font-size: 20px;
  font-weight: 700;
  color: var(--sect, var(--text-strong));
  font-variant-numeric: tabular-nums;
  line-height: 1.25;
}

/* made / used / total breakdown */
.chip__flow {
  display: flex;
  gap: 12px;
  margin-top: 2px;
}
.flow {
  display: flex;
  flex-direction: column;
  line-height: 1.25;
}
.flow em {
  font-weight: 600;
  font-style: normal;
  font-size: 9px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--faint);
}
.flow b {
  font-size: 12.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.flow.made b { color: var(--ok); }
.flow.used b { color: var(--bad); }
.flow.net { padding-left: 12px; border-left: 1px solid var(--line); }
.flow.net b { color: var(--text-strong); }
.flow.net b.negative { color: var(--bad); }

/* ===================== layout ========================================== */

.shell {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "goal" "tabs" "main" "log";
  align-content: start;
  gap: var(--gap);
  padding: 16px;
  padding-block: 16px 40px;
  max-width: 1480px;
  width: 100%;
  margin: 0 auto;
  box-sizing: border-box;
}

/* On a wide screen the section switcher sits in the right column directly
   above the messages, so it is reachable without scrolling back up. */
@media (min-width: 1040px) {
  .shell {
    grid-template-columns: minmax(0, 1fr) 368px;
    grid-template-areas: "goal tabs" "main log";
    align-items: start;
  }
}

.directive { grid-area: goal; }
.tabbar    { grid-area: tabs; }
.panel     { grid-area: main; }
.logwrap   { grid-area: log; }

/* ===================== action console ================================== */

/* the console now lives inside a tab panel, so it carries no outer frame */
.console {
  background:
    linear-gradient(180deg, rgb(var(--glow) / .05), transparent 55%);
  border-bottom: 1px solid var(--line);
  padding: 0 0 18px;
  margin: -4px 0 18px;
  position: relative;
  overflow: hidden;
}

.console__head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.eyebrow {
  font-weight: 600;
  font-size: 11.5px;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--faint);
}

.actionchips { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }

.actionchip {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  padding: 6px 12px;
  cursor: pointer;
  border-radius: var(--r);
  transition: color .15s, border-color .15s, background .15s;
}
.actionchip:hover { color: var(--text); border-color: var(--accent-deep); }
.actionchip[aria-pressed="true"] {
  color: var(--accent);
  border-color: var(--accent-deep);
  background: rgb(var(--glow) / .08);
}

.console__stage { position: relative; }

.actbtn {
  width: 100%;
  display: block;
  position: relative;
  background:
    linear-gradient(180deg, rgb(var(--glow) / .16), rgb(var(--glow) / .05)),
    var(--panel-2);
  border: 1px solid var(--accent-deep);
  border-top-color: rgb(var(--glow) / .55);
  border-radius: var(--r);
  padding: 28px 18px;
  cursor: pointer;
  text-align: center;
  box-shadow:
    inset 0 1px 0 rgb(var(--glow) / .22),
    0 10px 26px -18px rgb(var(--glow) / .9);
  transition: transform .06s ease, box-shadow .15s ease, background .3s ease;
}
.actbtn:hover { background: linear-gradient(180deg, rgb(var(--glow) / .22), rgb(var(--glow) / .07)), var(--panel-2); }
.actbtn:active,
.actbtn.autopress {
  transform: translateY(2px);
  box-shadow: inset 0 2px 8px rgb(0 0 0 / .5);
}
/* the automatic press reads as the machine working, not as a click */
.actbtn.autopress {
  background: linear-gradient(180deg, rgb(var(--glow) / .3), rgb(var(--glow) / .1)), var(--panel-2);
}

/* badge confirming the computer has taken over this button */
.actbtn[data-auto="1"]::after {
  content: "AUTO";
  position: absolute;
  top: 9px; right: 11px;
  font-size: 10px;
  letter-spacing: .2em;
  color: var(--ground);
  background: var(--ok);
  padding: 2px 7px;
  border-radius: 10px;
  font-weight: 600;
}

.actbtn__label {
  display: block;
  font-size: clamp(20px, 5vw, 30px);
  font-weight: 800;
  letter-spacing: .16em;
  color: var(--text-strong);
  text-shadow: 0 0 18px rgb(var(--glow) / .5);
  text-wrap: balance;
}
.actbtn__gain {
  display: block;
  margin-top: 8px;
  font-size: 14px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.actbtn__hint {
  display: block;
  margin-top: 5px;
  font-size: 12px;
  letter-spacing: .1em;
  color: var(--faint);
}

.actdesc {
  margin: 13px 0 0;
  font-size: 14.5px;
  color: var(--muted);
  max-width: 64ch;
}

.autoline {
  margin-top: 13px;
  padding-top: 12px;
  border-top: 1px solid var(--line-soft);
  display: flex;
  gap: 8px;
  align-items: baseline;
  flex-wrap: wrap;
  font-size: 13px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}
.autoline b { color: var(--ok); font-weight: 500; }

/* click floaters -------------------------------------------------------- */

.floater {
  position: absolute;
  left: 50%;
  top: 8%;
  transform: translateX(-50%);
  pointer-events: none;
  font-size: 16px;
  font-weight: 600;
  color: var(--accent);
  text-shadow: 0 0 10px rgb(var(--glow) / .8);
  font-variant-numeric: tabular-nums;
  animation: rise 900ms ease-out forwards;
  z-index: 5;
  white-space: nowrap;
}
@keyframes rise {
  0%   { opacity: 0; transform: translate(-50%, 18px) scale(.9); }
  22%  { opacity: 1; transform: translate(-50%, 8px) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -22px) scale(1); }
}
/* automatic gains are quieter than your own presses */
.floater--auto { color: var(--ok); font-size: 14px; opacity: .85; }

/* ===================== depth bar ======================================= */

.depthpanel {
  border: 1px solid var(--line);
  background: var(--panel-2);
  padding: 14px 16px 15px;
  margin-bottom: 18px;
  border-radius: var(--r);
}
.depthpanel__top {
  display: flex;
  align-items: flex-end;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 11px;
}
.depthpanel__v {
  font-size: 26px;
  font-weight: 700;
  color: var(--text-strong);
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
  margin-top: 2px;
}
.depthpanel__rate {
  margin-left: auto;
  font-size: 15px;
  color: var(--ok);
  font-variant-numeric: tabular-nums;
}
.depthpanel__bar {
  height: 12px;
  background: var(--ground-deep);
  border: 1px solid var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.depthpanel__bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--accent-deep), var(--accent));
  box-shadow: 0 0 12px rgb(var(--glow) / .7);
  transition: width .4s ease;
}
.depthpanel__foot {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 9px;
  font-size: 13.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.depthpanel__foot b { color: var(--accent); font-weight: 500; }
.depthpanel__foot span:last-child { margin-left: auto; }

/* ===================== goal box ======================================== */

.directive {
  border: 1px solid var(--accent-deep);
  border-left-width: 3px;
  /* accent tint over an opaque base, so it stays legible on the scene */
  background:
    linear-gradient(rgb(var(--glow) / .07), rgb(var(--glow) / .07)),
    var(--panel-glass);
  padding: 13px 15px 14px;
  border-radius: var(--r);
}
.directive.complete { animation: flash 700ms ease-out; }

.directive__k {
  font-weight: 700;
  font-size: 11.5px;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 4px;
}
.directive__t {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-strong);
  letter-spacing: .02em;
  text-wrap: balance;
}
.directive__h {
  font-weight: 500;
  margin-top: 6px;
  font-size: 14px;
  color: var(--text);
  max-width: 68ch;
  line-height: 1.55;
}
.directive__bar {
  margin-top: 11px;
  height: 5px;
  background: var(--line);
  border-radius: 3px;
  overflow: hidden;
}
.directive__bar i {
  display: block;
  height: 100%;
  background: var(--accent);
  box-shadow: 0 0 10px rgb(var(--glow) / .8);
  transition: width .3s ease;
}
.directive__p {
  margin-top: 5px;
  font-size: 12.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* ===================== tabs ============================================ */

.tabbar {
  display: flex;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
  border: 1px solid var(--line);
  background: var(--panel-glass);
  border-radius: var(--r);
}
.tabbar::-webkit-scrollbar { display: none; }

/* every tab wears its own section's colour, dimmed until you are in it */
.tab[data-tab="maintenance"] { --tabc: #ffb648; --tabd: #8c6630; }
.tab[data-tab="excavation"]  { --tabc: #d2693f; --tabd: #7d4027; }
.tab[data-tab="anomaly"]     { --tabc: #bf92ff; --tabd: #6d5793; }
.tab[data-tab="expansion"]   { --tabc: #7fc8f0; --tabd: #4a728a; }
.tab[data-tab="space"]       { --tabc: #7fe6c0; --tabd: #47836f; }
.tab[data-tab="archive"]     { --tabc: #d9c9a0; --tabd: #807560; }
.tab[data-tab="system"]      { --tabc: #9fb4c4; --tabd: #5e6c77; }

.tab {
  flex: 0 0 auto;
  background: transparent;
  border: 0;
  border-right: 1px solid var(--line-soft);
  border-bottom: 2px solid transparent;
  color: var(--tabd, var(--muted));
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  padding: 13px 18px;
  cursor: pointer;
  position: relative;
  text-align: left;
  transition: color .15s, background .15s;
}
.tab:last-child { border-right: 0; }
.tab:hover { color: var(--tabc, var(--text)); background: rgb(255 255 255 / .03); }
.tab[aria-selected="true"] {
  color: var(--tabc, var(--accent));
  border-bottom-color: var(--tabc, var(--accent));
  background: rgb(255 255 255 / .05);
}
.tab.new::after {
  content: "";
  position: absolute;
  top: 9px; right: 8px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 6px var(--ok);
}

/* stacked in the right-hand column on wide screens */
@media (min-width: 1040px) {
  .tabbar {
    flex-direction: column;
    overflow: visible;
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 124px);
  }
  .tab {
    border-right: 0;
    border-bottom: 1px solid var(--line-soft);
    border-left: 2px solid transparent;
    padding: 12px 16px;
  }
  .tab:last-child { border-bottom: 0; }
  .tab[aria-selected="true"] {
    border-bottom-color: var(--line-soft);
    border-left-color: var(--tabc, var(--accent));
  }
  .tab.new::after { top: 50%; margin-top: -3px; right: 12px; }
}

.panel {
  border: 1px solid var(--line);
  background: var(--panel-glass);
  padding: 17px;
  min-height: 300px;
}

.brief {
  margin: 0 0 20px;
  font-family: var(--serif);
  font-size: 17px;
  font-style: italic;
  color: var(--muted);
  max-width: 66ch;
  border-left: 2px solid var(--accent-deep);
  padding-left: 13px;
}

.section { margin-bottom: 28px; }
.section:last-child { margin-bottom: 0; }

.section__head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 13px;
  flex-wrap: wrap;
}
.section__head h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--text-strong);
}
.section__head::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
  min-width: 20px;
}

.buymode { display: flex; gap: 4px; }
.buymode button {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 12.5px;
  letter-spacing: .1em;
  padding: 4px 11px;
  cursor: pointer;
  border-radius: var(--r);
}
.buymode button[aria-pressed="true"] {
  color: var(--accent);
  border-color: var(--accent-deep);
  background: rgb(var(--glow) / .08);
}

/* ===================== icons =========================================== */

.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

.ico {
  fill: currentColor;
  vertical-align: -2px;
  flex: 0 0 auto;
}
.chip__k .ico { margin-right: 5px; vertical-align: -1px; }
.buy .ico, .actbtn__gain .ico { margin-right: 3px; }
.actbtn__gain s { color: var(--faint); text-decoration: none; }

/* what a machine takes in and puts out, as pictures */
.cardflow {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 4px 7px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--ground-deep);
}
.cardflow i {
  font-style: normal;
  color: var(--faint);
  font-size: 12px;
  margin: 0 1px;
}

/* ===================== research screen ================================= */

.researchbtn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  background: linear-gradient(90deg, rgb(var(--glow) / .12), rgb(var(--glow) / .03));
  border: 1px solid var(--accent-deep);
  border-radius: var(--r);
  padding: 15px 17px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.researchbtn:hover { background: rgb(var(--glow) / .2); border-color: var(--accent); }
.researchbtn__i { display: flex; }
.researchbtn__t {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 16px;
  font-weight: 600;
  color: var(--text-strong);
  letter-spacing: .04em;
}
.researchbtn__t em {
  font-style: normal;
  font-size: 12.5px;
  font-weight: 400;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--accent);
}
.researchbtn__c {
  margin-left: auto;
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.rhead {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  border: 1px solid var(--line);
  background: var(--panel-2);
  border-radius: var(--r);
  padding: 12px 15px;
  margin-bottom: 14px;
  font-size: 15px;
}
.rhead b { color: var(--accent); font-size: 19px; margin: 0 5px 0 7px; font-variant-numeric: tabular-nums; }
.rhead__rate { margin-left: auto; font-size: 13px; color: var(--muted); }

.rtree { list-style: none; margin: 0; padding: 0; }

.rnode {
  display: flex;
  gap: 14px;
  padding-bottom: 16px;
  position: relative;
}
/* the line joining one research to the next */
.rnode:not(:last-child)::before {
  content: "";
  position: absolute;
  left: 15px;
  top: 34px;
  bottom: 0;
  width: 2px;
  background: var(--line);
}
.rnode.is-done:not(:last-child)::before { background: var(--accent-deep); }

.rnode__dot {
  flex: 0 0 auto;
  width: 32px; height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 2px solid var(--line);
  background: var(--panel);
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  z-index: 1;
}
.rnode.is-done .rnode__dot { border-color: var(--accent); color: var(--accent); }
.rnode.is-ready .rnode__dot { border-color: var(--ok); color: var(--ok); }

.rnode__body { flex: 1; min-width: 0; }
.rnode__body h4 {
  margin: 4px 0 4px;
  font-size: 15.5px;
  font-weight: 600;
  color: var(--text-strong);
}
.rnode__body p {
  margin: 0 0 9px;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--muted);
  max-width: 60ch;
}
.rnode__buy { padding: 7px 13px; font-size: 12.5px; }
.rnode.is-ready .rnode__buy { border-color: var(--ok); color: var(--ok); background: rgb(95 224 143 / .1); }
.rnode.is-done { opacity: .6; }
.rnode.is-done .rnode__buy { border-color: var(--line-soft); color: var(--ok); }
.rnode.is-locked { opacity: .5; }

/* ===================== cards =========================================== */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(286px, 1fr));
  gap: 11px;
}

.card {
  border: 1px solid var(--line);
  background: var(--panel-2);
  padding: 13px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  position: relative;
  transition: border-color .2s;
}
.card:hover { border-color: #2f352a; }
.card.affordable { border-left: 2px solid var(--accent); padding-left: 13px; }
.card.idle { border-left: 2px solid var(--warn); padding-left: 13px; }
.card.bought { opacity: .62; }
.card.fresh { border-color: var(--accent-deep); }

.card.flash { animation: flash 420ms ease-out; }
@keyframes flash {
  0% { background: rgb(var(--glow) / .3); }
  100% { background: var(--panel-2); }
}

.card__head { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.card__name {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: .02em;
  color: var(--text-strong);
}
.card__count {
  margin-left: auto;
  font-size: 20px;
  font-weight: 800;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.pill {
  font-size: 10.5px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ground);
  background: var(--accent);
  padding: 2px 7px;
  border-radius: 10px;
  font-weight: 600;
}
.card__tagline {
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--faint);
}

.card__desc {
  font-weight: 500;
  margin: 0;
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.5;
}

.card__intro {
  margin: 0;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--text);
  border-left: 2px solid var(--accent);
  padding: 2px 0 2px 11px;
}

.card__stats {
  font-weight: 500;
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.card__stats li { color: var(--text); }
.card__stats li.out { color: var(--ok); }
.card__stats li.in { color: var(--bad); }
.card__stats li.total { color: var(--muted); }
.card__stats li.warnline { color: var(--warn); }

.cardfoot {
  margin-top: auto;
  display: flex;
  gap: 8px;
  align-items: stretch;
}
.cardfoot .buy { margin-top: 0; }

/* on/off switch for buildings that consume a resource */
.toggle {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: rgb(95 224 143 / .1);
  border: 1px solid #2f6b47;
  color: var(--ok);
  font-size: 12.5px;
  letter-spacing: .12em;
  padding: 10px 12px;
  cursor: pointer;
  border-radius: var(--r);
  transition: background .15s, border-color .15s, color .15s;
}
.toggle i {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 7px rgb(95 224 143 / .9);
  flex: 0 0 auto;
}
.toggle:hover { background: rgb(95 224 143 / .2); }
.toggle.isoff {
  background: transparent;
  border-color: var(--line);
  color: var(--faint);
}
.toggle.isoff i { background: var(--faint); box-shadow: none; }
.toggle.isoff:hover { border-color: var(--muted); color: var(--muted); }

/* a switched-off building reads as dormant, not broken */
.card.off { border-left: 2px solid var(--faint); padding-left: 12px; }
.card.off .card__stats li.out,
.card.off .card__stats li.in { color: var(--faint); }
.card.off .card__stats li.warnline { color: var(--muted); }

.buy {
  margin-top: auto;
  width: 100%;
  background: rgb(var(--glow) / .09);
  border: 1px solid var(--accent-deep);
  color: var(--text-strong);
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 10px 10px;
  cursor: pointer;
  border-radius: var(--r);
  font-variant-numeric: tabular-nums;
  transition: background .15s, color .15s;
}
.buy:hover:not(:disabled) { background: rgb(var(--glow) / .2); }
.buy:disabled {
  background: transparent;
  border-color: var(--line);
  color: var(--faint);
  cursor: not-allowed;
}
.buy.owned {
  background: transparent;
  border-color: var(--line-soft);
  color: var(--ok);
}

/* ===================== bought upgrades, folded away ==================== */

.boughtbox {
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--ground-deep);
}
.boughtbox summary {
  font-weight: 600;
  cursor: pointer;
  padding: 10px 14px;
  font-size: 12.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  list-style: none;
}
.boughtbox summary::-webkit-details-marker { display: none; }
.boughtbox summary::before {
  content: "\25B8";
  display: inline-block;
  margin-right: 9px;
  color: var(--faint);
  transition: transform .15s;
}
.boughtbox[open] summary::before { transform: rotate(90deg); }
.boughtbox summary span { color: var(--faint); text-transform: none; letter-spacing: .04em; }
.boughtbox summary:hover { color: var(--text); }

.boughtpills {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  padding: 2px 14px 14px;
}
.boughtpill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12.5px;
  color: var(--muted);
  cursor: default;
}
.boughtpill i { color: var(--ok); font-style: normal; font-size: 12px; }

/* ===================== log ============================================= */

.logwrap {
  border: 1px solid var(--line);
  background: var(--panel-glass);
  display: flex;
  flex-direction: column;
  max-height: 340px;
}
/* The log sits under the sticky section switcher, so it is offset by that
   switcher's measured height (set as --tabs-h when the tabs are built). */
@media (min-width: 1040px) {
  .logwrap {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 124px + var(--tabs-h, 0px) + var(--gap));
    max-height: calc(100vh - 190px - var(--tabs-h, 0px));
  }
}

.logwrap__head {
  font-weight: 700;
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 11.5px;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--faint);
}

.log {
  font-weight: 500;
  margin: 0;
  padding: 11px 14px 15px;
  list-style: none;
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 9px;
  font-size: 13.5px;
  line-height: 1.5;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.log::-webkit-scrollbar { width: 7px; }
.log::-webkit-scrollbar-thumb { background: var(--line); }

.log li { display: grid; grid-template-columns: 58px 1fr; gap: 8px; }
.log time { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12px; }
.log span { color: var(--muted); }
.log li.ok span { color: var(--ok); }
.log li.warn span { color: var(--warn); }
.log li.sys span { color: var(--text); }
.log li.story span { color: var(--accent); }
.log li.teach span { color: var(--text-strong); }
.log li.teach b { color: var(--accent); font-weight: 600; }
.log li.enter { animation: slidein 420ms ease-out; }
@keyframes slidein {
  from { opacity: 0; transform: translateX(-6px); }
  to   { opacity: 1; transform: none; }
}

/* ===================== archive ========================================= */

.docs { display: flex; flex-direction: column; gap: 16px; max-width: 74ch; }

.doc {
  border: 1px solid var(--line);
  border-left: 2px solid var(--accent-deep);
  background: var(--panel-2);
  padding: 15px 17px 17px;
}
.doc__src {
  font-weight: 700;
  font-size: 11.5px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 4px;
}
.doc__title {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 400;
  color: var(--text-strong);
  text-wrap: balance;
}
.doc__body {
  margin: 0;
  font-family: var(--serif);
  font-size: 17.5px;
  line-height: 1.65;
  color: var(--text);
}

.empty {
  color: var(--faint);
  font-size: 14px;
  font-style: italic;
}

/* ===================== system tab ====================================== */

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(206px, 1fr));
  gap: 1px;
  background: var(--line-soft);
  border: 1px solid var(--line-soft);
  margin: 0;
}
.stats div { background: var(--panel-2); padding: 11px 13px; }
.stats dt {
  font-weight: 600;
  font-size: 11.5px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--faint);
}
.stats dd {
  font-weight: 600;
  margin: 3px 0 0;
  font-size: 19px;
  color: var(--text-strong);
  font-variant-numeric: tabular-nums;
}

.row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }

.btn {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--text);
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 10px 16px;
  cursor: pointer;
  border-radius: var(--r);
  transition: border-color .15s, color .15s, background .15s;
}
.btn:hover { border-color: var(--accent-deep); color: var(--accent); }
.btn--danger { border-color: #4e2a24; color: var(--bad); }
.btn--danger:hover { border-color: var(--bad); color: var(--bad); background: rgb(232 103 79 / .08); }
.btn--primary {
  border-color: var(--accent-deep);
  color: var(--accent);
  background: rgb(var(--glow) / .1);
}

textarea.io {
  width: 100%;
  box-sizing: border-box;
  min-height: 92px;
  background: var(--ground-deep);
  border: 1px solid var(--line);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 13px;
  padding: 10px;
  margin-top: 12px;
  resize: vertical;
  border-radius: var(--r);
}

.note {
  font-weight: 500; font-size: 14px; color: var(--muted); max-width: 66ch; margin: 0; line-height: 1.55; }
.note b { color: var(--warn); font-weight: 500; }

/* ===================== banner ========================================== */

.banner {
  position: fixed;
  inset: 0;
  z-index: 70;
  display: grid;
  place-items: center;
  pointer-events: none;
  background: rgb(5 6 5 / .72);
  animation: bfade 3400ms ease-in-out forwards;
}
.banner__inner {
  text-align: center;
  padding: 0 24px;
  border-top: 1px solid var(--accent);
  border-bottom: 1px solid var(--accent);
  padding-block: 24px;
  width: min(780px, 92vw);
  box-sizing: border-box;
  background: linear-gradient(90deg, transparent, rgb(var(--glow) / .11), transparent);
  animation: bsweep 900ms ease-out;
}
.banner__k {
  font-size: 12px;
  letter-spacing: .34em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 9px;
}
.banner__t {
  font-size: clamp(23px, 6vw, 42px);
  font-weight: 600;
  letter-spacing: .14em;
  color: var(--accent);
  text-shadow: 0 0 26px rgb(var(--glow) / .65);
  text-wrap: balance;
}
.banner__s {
  margin-top: 11px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 17px;
  color: var(--text);
}
@keyframes bfade {
  0% { opacity: 0 } 8% { opacity: 1 } 84% { opacity: 1 } 100% { opacity: 0 }
}
@keyframes bsweep {
  0% { clip-path: inset(0 100% 0 0); } 100% { clip-path: inset(0 0 0 0); }
}

/* ===================== menu screen ===================================== */

.menu {
  position: fixed;
  inset: 0;
  z-index: 75;                 /* under modals (80), over banners (70) */
  display: grid;
  place-items: center;
  padding: 28px 20px;
  box-sizing: border-box;
  overflow-y: auto;
  /* fully opaque: the title screen is its own place, not an overlay */
  background:
    radial-gradient(120% 90% at 50% 0%, rgb(var(--glow) / .1), transparent 62%),
    var(--ground);
  animation: menuIn 500ms ease-out;
}
@keyframes menuIn { from { opacity: 0 } to { opacity: 1 } }

.menu__inner {
  width: min(560px, 100%);
  text-align: center;
}

.menu__eyebrow {
  font-weight: 600;
  font-size: 11.5px;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 18px;
}

.menu__title {
  margin: 0;
  font-size: clamp(28px, 7vw, 46px);
  font-weight: 800;
  line-height: 1.12;
  letter-spacing: .1em;
  color: var(--text-strong);
  text-shadow: 0 0 34px rgb(var(--glow) / .45);
  text-wrap: balance;
}

.menu__tag {
  margin: 16px auto 0;
  max-width: 44ch;
  font-family: var(--serif);
  font-size: 17px;
  font-style: italic;
  line-height: 1.55;
  color: var(--text);
}

.menu__save {
  margin-top: 22px;
  border: 1px solid var(--line);
  background: var(--panel-glass);
  border-radius: var(--r);
  padding: 11px 14px;
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.menu__save b { color: var(--accent); font-weight: 600; }

.menu__btns {
  margin-top: 22px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.menubtn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  width: 100%;
  background: var(--panel-glass);
  border: 1px solid var(--line);
  color: var(--text);
  font-size: 14.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  padding: 14px 16px;
  cursor: pointer;
  border-radius: var(--r);
  transition: border-color .15s, color .15s, background .15s;
}
.menubtn:hover { border-color: var(--accent-deep); color: var(--accent); }
.menubtn em {
  font-style: normal;
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: none;
  color: var(--faint);
}
.menubtn--primary {
  border-color: var(--accent-deep);
  color: var(--accent);
  background: linear-gradient(rgb(var(--glow) / .14), rgb(var(--glow) / .05)), var(--panel-glass);
  box-shadow: 0 10px 30px -22px rgb(var(--glow) / .9);
}
.menubtn--primary:hover { background: linear-gradient(rgb(var(--glow) / .24), rgb(var(--glow) / .08)), var(--panel-glass); }

.menu__foot {
  margin: 20px 0 0;
  font-size: 11.5px;
  letter-spacing: .1em;
  color: var(--faint);
}

/* the finish-the-game card inside the ending box */
.congrats {
  margin-top: 22px;
  border: 1px solid var(--accent-deep);
  background: rgb(var(--glow) / .08);
  border-radius: var(--r);
  padding: 16px 18px;
  opacity: 0;
  animation: endin 900ms ease-out forwards;
}
.congrats h3 {
  margin: 0 0 7px;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: .06em;
  color: var(--accent);
}
.congrats p {
  margin: 0 0 14px;
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--text);
}

/* ===================== modes =========================================== */

/* the picker, shown before a run starts */
.modelist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }

.mode button {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-left: 3px solid var(--line);
  border-radius: var(--r);
  padding: 14px 16px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.mode button:hover {
  border-color: var(--accent-deep);
  border-left-color: var(--accent);
  background: rgb(var(--glow) / .07);
}
.mode__n {
  display: block;
  font-size: 16.5px;
  font-weight: 700;
  letter-spacing: .08em;
  color: var(--text-strong);
}
.mode__t {
  display: block;
  margin-top: 2px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 15px;
  color: var(--accent);
}
.mode__b {
  margin: 9px 0 0;
  padding-left: 17px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 13.5px;
  font-weight: 500;
  line-height: 1.5;
  color: var(--muted);
}
.mode__b li::marker { color: var(--faint); }
.mode__b b { color: var(--text); font-weight: 700; }

/* the name of the active mode, up in the status bar */
.modetag {
  border: 1px solid var(--accent-deep);
  background: rgb(var(--glow) / .1);
  color: var(--accent);
  border-radius: 20px;
  padding: 3px 11px 4px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
}

/* the strip of things a mode wants you to watch */
.modebar {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  border-top: 1px solid var(--line-soft);
  padding: 0 10px;
}
.modebar::-webkit-scrollbar { display: none; }

.mb {
  flex: 0 0 auto;
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 6px 14px 7px;
  border-right: 1px solid var(--line-soft);
}
.mb:last-child { border-right: 0; }
.mb em {
  font-style: normal;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--faint);
}
.mb b {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-strong);
  font-variant-numeric: tabular-nums;
}
.mb--ok b { color: var(--ok); }
.mb--bad b { color: var(--bad); }
.mb--bad { background: rgb(232 103 79 / .1); }

/* the main button once Hands Off has run out */
.actbtn.spent { opacity: .5; cursor: not-allowed; filter: grayscale(.6); }
.actbtn.spent:hover { background: linear-gradient(180deg, rgb(var(--glow) / .16), rgb(var(--glow) / .05)), var(--panel-2); }

/* Minimalist's end-of-run score */
.score {
  display: flex;
  align-items: center;
  gap: 16px;
  border: 1px solid var(--accent-deep);
  background: var(--ground-deep);
  border-radius: var(--r);
  padding: 14px 16px;
  margin-bottom: 14px;
}
.score__n {
  font-size: 40px;
  font-weight: 800;
  line-height: 1;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.score__l {
  display: flex;
  flex-direction: column;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--faint);
}
.score__l b {
  font-size: 17px;
  letter-spacing: .06em;
  color: var(--text-strong);
  margin-top: 3px;
}
.score__l em {
  font-style: normal;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  color: var(--muted);
  margin-top: 2px;
}

/* ===================== modal =========================================== */

.modal {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: grid;
  place-items: center;
  background: rgb(5 6 5 / .88);
  padding: 20px;
  box-sizing: border-box;
  overflow-y: auto;
}
.modal__box {
  width: min(660px, 100%);
  border: 1px solid var(--accent-deep);
  background: var(--panel);
  padding: 22px;
  box-shadow: 0 30px 80px -40px rgb(var(--glow) / .8);
}
.modal__k {
  font-size: 12px;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--accent);
}
.modal__t {
  margin: 7px 0 15px;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: .06em;
  color: var(--text-strong);
  text-wrap: balance;
}
.modal__box dl.stats { margin: 0 0 16px; }
.modal__box .row { margin-top: 18px; }

/* teaching list used by briefings and the opening tutorial */
.teachlist {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 13px;
}
.teachlist li {
  border-left: 2px solid var(--accent-deep);
  padding-left: 13px;
}
.teachlist h4 {
  margin: 0 0 3px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--accent);
}
.teachlist p {
  margin: 0;
  font-size: 15px;
  line-height: 1.55;
  color: var(--text);
}
.goal {
  border: 1px solid var(--accent-deep);
  background: rgb(var(--glow) / .07);
  padding: 14px 16px;
  margin: 0 0 18px;
  font-size: 16px;
  line-height: 1.6;
  color: var(--text-strong);
}
.goal b { color: var(--accent); font-weight: 600; }

/* ===================== prologue ======================================== */

.modal__box--wide { width: min(760px, 100%); }

/* staged pieces start hidden and fade in on their own delay */
.staged .modal__k,
.staged .modal__t,
.staged .letter p,
.staged .goal,
.staged .kicker { opacity: 0; animation: endin 700ms ease-out forwards; }

.bootlines {
  list-style: none;
  margin: 0 0 22px;
  padding: 0 0 18px;
  border-bottom: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 13.5px;
  letter-spacing: .06em;
}
.bootlines li {
  display: flex;
  align-items: baseline;
  gap: 8px;
  opacity: 0;
  animation: endin 420ms ease-out forwards;
}
.bootlines li span { color: var(--faint); text-transform: uppercase; }
.bootlines li i {
  flex: 1;
  border-bottom: 1px dotted var(--line-mid);
  min-width: 14px;
  transform: translateY(-3px);
}
.bootlines li b {
  color: var(--accent);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.bootlines li:first-child span { color: var(--text-strong); letter-spacing: .18em; }
.bootlines li:first-child b { color: var(--text-strong); }

.letter {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-bottom: 20px;
}
.letter p {
  margin: 0;
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.68;
  color: var(--text);
}

.kicker {
  margin: 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: 16.5px;
  line-height: 1.6;
  color: var(--accent);
  border-left: 2px solid var(--accent-deep);
  padding-left: 13px;
}

@media (max-width: 560px) {
  .bootlines { font-size: 12.5px; }
  .bootlines li span { letter-spacing: 0; }
  .letter p { font-size: 16px; }
}

.endlines { list-style: none; margin: 0 0 4px; padding: 0; display: flex; flex-direction: column; gap: 13px; }
.endlines li {
  font-family: var(--serif);
  font-size: 18px;
  line-height: 1.6;
  color: var(--text);
  opacity: 0;
  animation: endin 1100ms ease-out forwards;
}
.endlines li:last-child { color: var(--accent); }
@keyframes endin { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

/* ===================== motion / small screens ========================== */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-delay: 0s !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  /* staged reveals must not leave anything parked at opacity 0 */
  .endlines li,
  .bootlines li,
  .congrats,
  .staged .modal__k,
  .staged .modal__t,
  .staged .letter p,
  .staged .goal,
  .staged .kicker { opacity: 1; }
  .banner { animation: none; opacity: 1; }
}

@media (max-width: 560px) {
  body { font-size: 15px; }
  .shell { padding: 12px; padding-block: 12px 32px; }
  .console, .panel { padding: 14px; }
  .grid { grid-template-columns: 1fr; }
  .depth { margin-left: 0; }

  .actbtn { padding: 24px 14px; }
  .chip { min-width: 98px; padding: 7px 11px 8px; }
  .modal__box { padding: 17px; }
  .doc__body { font-size: 17px; }
  .log li { grid-template-columns: 54px 1fr; }
}

<script>
/* ========================================================================
   format.js — readable formatting for very large numbers, depths and time.
   ===================================================================== */

const FMT = (() => {
  'use strict';

  const SUFFIX = [
    '', 'K', 'M', 'B', 'T',
    'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No',
    'Dc', 'Ud', 'Dd', 'Td', 'Qad', 'Qid', 'Sxd', 'Spd', 'Ocd', 'Nod',
    'Vg'
  ];

  function trim(str) {
    return str.indexOf('.') === -1 ? str : str.replace(/\.?0+$/, '');
  }

  /** Compact number: 942 · 1.42K · 3.07M · 1.20e34 */
  function n(v) {
    if (v == null || !isFinite(v)) return v > 0 ? '∞' : '0';
    if (v < 0) return '-' + n(-v);
    if (v === 0) return '0';
    if (v < 0.01) return trim(v.toPrecision(2));
    if (v < 1) return trim(v.toFixed(2));
    if (v < 1000) {
      if (v < 10) return trim(v.toFixed(2));
      if (v < 100) return trim(v.toFixed(1));
      return String(Math.floor(v));
    }
    const tier = Math.floor(Math.log10(v) / 3);
    if (tier >= SUFFIX.length) {
      const exp = v.toExponential(2).split('e');
      return exp[0] + '×10' + sup(parseInt(exp[1], 10));
    }
    const scaled = v / Math.pow(1000, tier);
    const digits = scaled < 10 ? 2 : scaled < 100 ? 1 : 0;
    return scaled.toFixed(digits) + SUFFIX[tier];
  }

  const SUPS = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
  function sup(num) {
    return String(num).split('').map(ch => SUPS[ch] || ch).join('');
  }

  /** Whole-number count with thousands separators. */
  function int(v) {
    if (!isFinite(v)) return '∞';
    if (v >= 1e15) return n(v);
    return Math.floor(v).toLocaleString('en-US');
  }

  /** Per-second rate, signed. */
  function rate(v) {
    if (Math.abs(v) < 1e-9) return '0/s';
    return (v > 0 ? '+' : '−') + n(Math.abs(v)) + '/s';
  }

  /** Depth in metres, switching to kilometres past a kilometre. */
  function depth(metres) {
    if (metres < 1000) return Math.floor(metres) + ' m';
    const km = metres / 1000;
    if (km < 1e9) return int(km) + ' km';
    return n(km) + ' km';
  }

  /** Durations: 41s · 12m 04s · 3h 22m · 2d 06h */
  function time(seconds) {
    const t = Math.max(0, Math.floor(seconds));
    const d = Math.floor(t / 86400);
    const h = Math.floor(t % 86400 / 3600);
    const mn = Math.floor(t % 3600 / 60);
    const sc = t % 60;
    if (d) return d + 'd ' + pad(h) + 'h';
    if (h) return h + 'h ' + pad(mn) + 'm';
    if (mn) return mn + 'm ' + pad(sc) + 's';
    return sc + 's';
  }

  function pad(v) { return v < 10 ? '0' + v : String(v); }

  /** Running shift timer: HH:MM:SS, fixed width so it does not jitter. */
  function clock(seconds) {
    const t = Math.max(0, Math.floor(seconds));
    return pad(Math.floor(t / 3600)) + ':' + pad(Math.floor(t % 3600 / 60)) + ':' + pad(t % 60);
  }

  /** Terminal clock stamp for log entries. */
  function stamp(date) {
    const d = date || new Date();
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  /** Multiplier badge: ×2 · ×2.5 · ×10,000 */
  function x(v) {
    if (v >= 1000) return '×' + int(v);
    return '×' + trim(v.toFixed(2));
  }

  return { n, int, rate, depth, time, clock, stamp, x, sup };
})();
</script>
<script>
/* ========================================================================
   scene.js — the animated background.

   A single canvas behind the interface showing the ground you are cutting
   through. Rock layers scroll upward at a speed taken from your real
   digging rate, so the world visibly moves faster as the drills improve,
   and the whole palette crossfades as you reach each new section.

   It reads from ENGINE but never writes, and it is purely decorative:
   if anything here fails the game is unaffected.
   ===================================================================== */

const SCENE = (() => {
  'use strict';

  const FPS = 30;
  const FRAME = 1000 / FPS;
  const VH = 2000;              // virtual height of one band cycle, px

  /* Each section gets its own ground. `glow` drives the pulsing veins. */
  const PALETTES = {
    bunker: { a: '#15160f', b: '#1f2118', vein: '#2e3225', mote: '#b0a98e', glow: 0.00 },
    rock:   { a: '#231a11', b: '#30241a', vein: '#4d3722', mote: '#c08a52', glow: 0.00 },
    ruin:   { a: '#1a1526', b: '#251d35', vein: '#6b45a8', mote: '#bf92ff', glow: 0.55 },
    mantle: { a: '#2a1410', b: '#3b1b12', vein: '#b33c1c', mote: '#ff8a52', glow: 0.75 },
    space:  { a: '#05070d', b: '#080b14', vein: '#2a3a56', mote: '#a8dcff', glow: 0.30 }
  };

  let cv = null, ctx = null, w = 0, h = 0, dpr = 1;
  let raf = null, lastFrame = 0, lastTime = 0;
  let scroll = 0, clock = 0;
  let bands = [], motes = [], stars = [];
  let reduced = false;

  /* deterministic pseudo-random so the ground looks the same each visit */
  function rnd(seed) {
    let x = Math.sin(seed * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  }

  /* Colours are kept as [r,g,b] numbers, never as strings: the live
     palette is blended every frame, and re-parsing our own output was
     the bug that made the whole canvas go blank. */
  function hex(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mix(c1, c2, t) {
    return [c1[0] + (c2[0] - c1[0]) * t,
            c1[1] + (c2[1] - c1[1]) * t,
            c1[2] + (c2[2] - c1[2]) * t];
  }
  function css(c, alpha) {
    const s = 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0);
    return alpha == null ? s + ')' : s.replace('rgb(', 'rgba(') + ',' + alpha + ')';
  }
  function toPal(p) {
    return { a: hex(p.a), b: hex(p.b), vein: hex(p.vein), mote: hex(p.mote), glow: p.glow };
  }

  let pal = toPal(PALETTES.bunker);

  /* ---------------------------------------------------------------- */

  function build() {
    bands = [];
    let y = 0;
    let i = 0;
    while (y < VH) {
      const thickness = 14 + rnd(i + 1) * 70;
      bands.push({
        y: y,
        h: thickness,
        tone: rnd(i + 90),
        tilt: (rnd(i + 180) - 0.5) * 26,
        seam: rnd(i + 270) > 0.72
      });
      y += thickness;
      i++;
    }

    const area = Math.max(1, w * h);
    const moteCount = Math.min(90, Math.round(area / 26000));
    motes = [];
    for (let k = 0; k < moteCount; k++) {
      motes.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: 0.5 + Math.random() * 1.7,
        v: 0.25 + Math.random() * 0.9,
        a: 0.15 + Math.random() * 0.5
      });
    }

    const starCount = Math.min(220, Math.round(area / 9000));
    stars = [];
    for (let k = 0; k < starCount; k++) {
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() < 0.9 ? Math.random() * 0.9 + 0.2 : Math.random() * 1.7 + 0.9,
        a: 0.25 + Math.random() * 0.7,
        tw: Math.random() * 6.3
      });
    }
  }

  function resize() {
    if (!cv) return;
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    w = window.innerWidth;
    h = window.innerHeight;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  /* ---------------------------------------------------------------- */

  /** Which ground are we in, and how fast is it going past? */
  function look() {
    let key = 'bunker';
    let speed = 0;
    try {
      const s = ENGINE.state();
      if (s.flags.cosmic || s.flags.ended) key = 'space';
      else if (s.flags.coreBreached || s.stage >= 4) key = 'mantle';
      else if (s.stage >= 3) key = 'ruin';
      else if (s.stage >= 2) key = 'rock';
      /* compress a rate that spans many orders of magnitude into a speed
         the eye can actually read */
      const rate = ENGINE.depthRate();
      if (rate > 0) speed = Math.min(70, Math.log10(1 + rate) * 17);
      if (key === 'bunker') speed = 0;
    } catch (e) { /* engine not ready yet */ }
    return { key: key, speed: speed };
  }

  function drawBands(off) {
    const first = Math.floor((scroll - h) / VH);
    const last = Math.ceil((scroll + h) / VH);
    for (let k = first; k <= last; k++) {
      const base = k * VH - scroll;
      for (const b of bands) {
        const y = base + b.y;
        if (y > h + 90 || y + b.h < -90) continue;
        ctx.fillStyle = css(mix(pal.a, pal.b, b.tone));
        ctx.beginPath();
        ctx.moveTo(-20, y + b.tilt);
        ctx.lineTo(w + 20, y - b.tilt);
        ctx.lineTo(w + 20, y - b.tilt + b.h);
        ctx.lineTo(-20, y + b.tilt + b.h);
        ctx.closePath();
        ctx.fill();
        if (b.seam) {
          ctx.strokeStyle = css(pal.vein);
          ctx.globalAlpha = 0.5;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(-20, y + b.tilt);
          ctx.lineTo(w + 20, y - b.tilt);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  /** Veins that breathe at 0.31 Hz — the same figure the story keeps
      returning to. */
  function drawVeins() {
    if (pal.glow <= 0.01) return;
    const pulse = 0.45 + 0.55 * Math.sin(clock * 2 * Math.PI * 0.31);
    ctx.save();
    ctx.globalAlpha = pal.glow * pulse * 0.5;
    ctx.strokeStyle = css(pal.vein);
    ctx.lineWidth = 2;
    ctx.shadowBlur = 16;
    ctx.shadowColor = css(pal.mote);
    for (let i = 0; i < 4; i++) {
      const x = w * (0.12 + i * 0.25) + Math.sin(clock * 0.25 + i) * 30;
      ctx.beginPath();
      ctx.moveTo(x, -20);
      for (let y = -20; y < h + 20; y += 46) {
        ctx.lineTo(x + Math.sin((y + scroll) * 0.013 + i * 2) * 26, y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawMotes(dt, speed) {
    ctx.fillStyle = css(pal.mote);
    for (const m of motes) {
      /* grit rises past you because you are going down */
      m.y -= (m.v + speed * 0.35) * dt * 30;
      if (m.y < -6) { m.y = h + 6; m.x = Math.random() * w; }
      ctx.globalAlpha = m.a * 0.55;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawStars() {
    for (const s of stars) {
      ctx.globalAlpha = s.a * (0.6 + 0.4 * Math.sin(clock * 1.2 + s.tw));
      ctx.fillStyle = s.r > 1 ? '#a8dcff' : '#cfe6f5';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawVignette() {
    /* a flat dim first: the scene is scenery, not the subject */
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    ctx.fillRect(0, 0, w, h);
    const g = ctx.createRadialGradient(w / 2, h * 0.42, Math.min(w, h) * 0.2,
      w / 2, h * 0.5, Math.max(w, h) * 0.8);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.8)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (now - lastFrame < FRAME) return;
    const dt = Math.min(0.12, (now - lastTime) / 1000) || 0;
    lastFrame = now;
    lastTime = now;
    if (document.visibilityState === 'hidden') return;
    render(dt);
  }

  function render(dt) {
    const l = look();
    const want = PALETTES[l.key] || PALETTES.bunker;

    /* ease the palette over so a new section arrives as a wash of colour
       rather than a hard cut */
    const target = toPal(want);
    const k = Math.min(1, dt * 0.7);
    pal.a = mix(pal.a, target.a, k);
    pal.b = mix(pal.b, target.b, k);
    pal.vein = mix(pal.vein, target.vein, k);
    pal.mote = mix(pal.mote, target.mote, k);
    pal.glow += (target.glow - pal.glow) * k;

    clock += dt;
    scroll += l.speed * dt * 30;
    if (scroll > 1e7) scroll = scroll % VH;

    ctx.fillStyle = css(pal.a);
    ctx.fillRect(0, 0, w, h);

    if (l.key === 'space') {
      drawStars();
      drawVeins();
    } else {
      drawBands();
      drawVeins();
      drawMotes(dt, l.speed);
    }
    drawVignette();
  }

  /* ---------------------------------------------------------------- */

  function start(canvas) {
    cv = canvas;
    if (!cv || !cv.getContext) return;
    ctx = cv.getContext('2d');
    if (!ctx) return;

    reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    resize();
    window.addEventListener('resize', resize);

    if (reduced) { render(0); return; }   // one still frame, no loop
    lastTime = performance.now();
    raf = requestAnimationFrame(frame);
    document.addEventListener('visibilitychange', () => {
      lastTime = performance.now();       // do not jump after a hidden spell
    });
  }

  return {
    RESOURCES, SECTION_COLORS, DEPTH_ICON, CONTACT,

    MODES, PROLOGUE, INTRO, DIRECTIVES, INTROS, BRIEFINGS,

    START_DOCS: ['arc_induction']

<script>
/* ========================================================================
   engine.js — state, simulation, purchasing and persistence.
   Knows nothing about the DOM. Emits events the UI subscribes to.
   ===================================================================== */

const ENGINE = (() => {
  'use strict';

  const C = CONTENT;
  const SAVE_KEY = 'deepEarthBunker.save.v1';
  const SAVE_VERSION = 1;
  const BASE_OFFLINE = { rate: 0.5, cap: 4 * 3600 };

  const byId = list => list.reduce((m, x) => (m[x.id] = x, m), {});
  const P = byId(C.PRODUCERS);
  const A = byId(C.ACTIONS);
  const U = byId(C.UPGRADES.concat(C.RESEARCH));
  const CONVERTERS = C.PRODUCERS.filter(p => p.use);

  /* ---------------------------------------------------------------- */
  /* Event bus                                                        */
  /* ---------------------------------------------------------------- */

  const handlers = {};
  function on(ev, fn) { (handlers[ev] || (handlers[ev] = [])).push(fn); }
  function emit(ev, payload) { (handlers[ev] || []).forEach(fn => fn(payload)); }

  /* ---------------------------------------------------------------- */
  /* State                                                            */
  /* ---------------------------------------------------------------- */

  let s = null;                 // live state
  let m = null;                 // derived multipliers
  let rates = {};               // gross per-second production, non-converter
  let uses = {};                // per-second consumption at full operation
  let convOut = {};             // converter output at full operation
  let ratio = {};               // last tick's throughput ratio per converter
  let depthRate = 0;
  let structureDirty = true;

  function freshState(modeId) {
    return {
      v: SAVE_VERSION,
      mode: MODE_BY_ID[modeId] ? modeId : 'standard',
      power: 0, powerT: 0, powerNext: 0, market: 1, marketT: 0,
      res: {}, earned: {}, prod: {}, upg: {}, flags: {},
      depth: 0,
      stage: 1,
      action: 'vent',
      tab: 'maintenance',
      docs: C.START_DOCS.slice(),
      milestones: {},
      seenTabs: { maintenance: true, system: true },
      seen: {},            // entries already announced
      fresh: {},           // entries unlocked but not yet acted on
      off: {},             // recipe buildings the player has switched off
      directive: 0,        // index into CONTENT.DIRECTIVES
      depthMark: 0,        // index into CONTENT.DEPTH_MARKS
      introDone: false,    // opening tutorial dismissed
      /* `time` counts everything the facility has run, banked offline hours
         included. `active` counts only time you were actually here, which
         is what the shift timer shows. */
      stats: { clicks: 0, time: 0, active: 0, started: Date.now(), purchases: 0 },
      lastSeen: Date.now()
    };
  }

  /* ---------------------------------------------------------------- */
  /* Game modes                                                       */
  /* ---------------------------------------------------------------- */

  const MODE_BY_ID = {};
  C.MODES.forEach(m => { MODE_BY_ID[m.id] = m; });
  const STANDARD = MODE_BY_ID.standard;

  function mode() { return (s && MODE_BY_ID[s.mode]) || STANDARD; }

  /** Resource targets scale with the mode; depth targets never do. */
  function goal(n) { return n * (mode().goalScale || 1); }

  /** A machine's price list, after the mode's cost scaling. */
  function scaledCost(cost) {
    const k = mode().costScale || 1;
    if (k === 1) return cost;
    const out = {};
    for (const r in cost) out[r] = cost[r] * k;
    return out;
  }

  /** An upgrade's price: research scales separately, and the two
      section-unlock purchases scale separately again. */
  function upgradeCost(u) {
    if (!u) return {};
    const md = mode();
    let k = 1;
    if (u.kind === 'research') k = md.fragCostScale || 1;
    else k = (md.costScale || 1) * (u.milestone ? (md.finalScale || 1) : 1);
    if (k === 1) return u.cost;
    const out = {};
    for (const r in u.cost) out[r] = u.cost[r] * k;
    return out;
  }

  function pressesLeft() {
    const cap = mode().pressCap;
    if (!cap) return Infinity;
    return Math.max(0, cap - (s.stats.clicks || 0));
  }

  const state = () => s;
  const mult = () => m;
  const flag = id => !!(s.flags[id] || (m && m.flags[id]));

  function res(id) { return s.res[id] || 0; }
  function earned(id) { return s.earned[id] || 0; }
  function count(id) { return s.prod[id] || 0; }
  function owned(id) { return !!s.upg[id]; }

  /* ---------------------------------------------------------------- */
  /* Requirements                                                     */
  /* ---------------------------------------------------------------- */

  function meets(req) {
    if (!req) return true;
    if (req.stage != null && s.stage < req.stage) return false;
    if (req.depth != null && s.depth < req.depth) return false;
    if (req.flag && !flag(req.flag)) return false;
    if (req.upgrade && !owned(req.upgrade)) return false;
    if (req.producer) for (const k in req.producer) if (count(k) < req.producer[k]) return false;
    if (req.res) for (const k in req.res) if (earned(k) < req.res[k]) return false;
    return true;
  }

  /** A producer, upgrade or research node is visible once the section it
      belongs to is open and its own requirement is met. */
  function visible(entry) {
    const tab = C.TABS.find(t => t.id === entry.tab);
    if (tab && tab.stage && s.stage < tab.stage) return false;
    return meets(entry.req);
  }

  /** The manual action belonging to a tab, if that tab has one yet. */
  function actionForTab(tabId) {
    return C.ACTIONS.find(a => a.tab === tabId && s.stage >= a.stage) || null;
  }

  /** The newest action the player has access to. */
  function latestAction() {
    const list = C.ACTIONS.filter(a => s.stage >= a.stage);
    return list[list.length - 1] || C.ACTIONS[0];
  }

  function resourceVisible(r) {
    return r.always || earned(r.id) > 0 || (rates[r.id] || 0) > 0;
  }

  /* ---------------------------------------------------------------- */
  /* Multipliers                                                      */
  /* ---------------------------------------------------------------- */

  function recompute() {
    const n = {
      all: 1, res: {}, prod: {}, tag: {}, eff: {}, click: {}, clickAll: 1,
      depth: 1, autoRate: 1, flags: {},
      offRate: BASE_OFFLINE.rate, offCap: BASE_OFFLINE.cap
    };

    const apply = (mods, times) => {
      for (const mod of mods) {
        const f = times == null ? (mod.f || 1) : Math.pow(mod.f || 1, times);
        switch (mod.t) {
          case 'all': n.all *= f; break;
          case 'res': n.res[mod.id] = (n.res[mod.id] || 1) * f; break;
          case 'prod': n.prod[mod.id] = (n.prod[mod.id] || 1) * f; break;
          case 'tag': n.tag[mod.id] = (n.tag[mod.id] || 1) * f; break;
          case 'eff': n.eff[mod.id] = (n.eff[mod.id] || 1) * f; break;
          case 'click': n.click[mod.id] = (n.click[mod.id] || 1) * f; break;
          case 'clickAll': n.clickAll *= f; break;
          case 'depth': n.depth *= f; break;
          case 'autoRate': n.autoRate *= f; break;
          case 'flag': n.flags[mod.id] = true; break;
          case 'offline': n.offRate = mod.rate; n.offCap = mod.cap; break;
        }
      }
    };

    if (mode().mods) apply(mode().mods);
    for (const id in s.upg) if (s.upg[id] && U[id] && U[id].mods) apply(U[id].mods);
    for (const p of C.PRODUCERS) {
      const c = count(p.id);
      if (c > 0 && p.perCount) apply(p.perCount, c);
    }

    m = n;
    /* Capability flags granted by upgrades are mirrored into persistent
       state so milestone tests and saves only ever read one place. */
    Object.assign(s.flags, n.flags);
    computeRates();
  }

  /** Throughput multiplier: scales what a machine takes in AND puts out. */
  function pMult(p) {
    let f = m.prod[p.id] || 1;
    if (p.tags) for (const t of p.tags) f *= (m.tag[t] || 1);
    return f;
  }

  /** Efficiency multiplier: scales only what comes out, so a recipe yields
      more from exactly the same inputs. */
  function effMult(p) {
    let f = 1;
    if (p.tags) for (const t of p.tags) f *= (m.eff[t] || 1);
    return f;
  }

  function computeRates() {
    const r = {}, u = {}, co = {};

    for (const p of C.PRODUCERS) {
      const c = count(p.id);
      if (!c) continue;
      if (p.use && s.off[p.id]) continue;   // switched off: consumes nothing, makes nothing
      const f = c * pMult(p) * m.all;
      if (p.use) {
        const eff = effMult(p);
        for (const k in p.use) u[k] = (u[k] || 0) + p.use[k] * f;
        const mk = p.market ? marketFactor() : 1;
        if (p.prod) for (const k in p.prod) {
          co[p.id] = co[p.id] || {};
          co[p.id][k] = p.prod[k] * f * eff * (m.res[k] || 1) * mk;
        }
      } else if (p.prod) {
        for (const k in p.prod) r[k] = (r[k] || 0) + p.prod[k] * f * (m.res[k] || 1);
      }
    }

    /* machines that press a button for you contribute as a smooth rate */
    for (const a of C.ACTIONS) {
      const presses = pressRate(a);
      if (presses > 0) r[a.res] = (r[a.res] || 0) + clickGain(a) * presses;
    }

    /* depth */
    let d = 0;
    for (const p of C.PRODUCERS) {
      const c = count(p.id);
      if (c && p.depth) d += c * p.depth * pMult(p) * m.all;
    }
    for (const a of C.ACTIONS) {
      if (a.depth) d += clickDepth(a) * pressRate(a);
    }
    depthRate = d * m.depth;

    if (flag('legacyUplink')) {
      const creditFlow = (r.credits || 0) + Object.keys(co).reduce(
        (t, id) => t + (co[id].credits || 0), 0);
      r.flux = (r.flux || 0) + creditFlow * 0.05;
    }

    rates = r; uses = u; convOut = co;
  }

  /** Everything being made per second: ordinary machines, automated button
      presses, and any recipe output at its measured throughput. */
  function grossRate(id) {
    let v = rates[id] || 0;
    for (const p of CONVERTERS) {
      if (s.off[p.id]) continue;
      const rt = ratio[p.id] == null ? 1 : ratio[p.id];
      if (convOut[p.id] && convOut[p.id][id]) v += convOut[p.id][id] * rt;
    }
    return v;
  }

  /** Everything being consumed per second by recipes, as a positive number. */
  function drainRate(id) {
    let v = 0;
    for (const p of CONVERTERS) {
      if (s.off[p.id] || !p.use[id]) continue;
      const rt = ratio[p.id] == null ? 1 : ratio[p.id];
      v += p.use[id] * count(p.id) * pMult(p) * m.all * rt;
    }
    return v;
  }

  /** What actually lands in the bank each second. */
  function netRate(id) { return grossRate(id) - drainRate(id); }

  function fullRate(id) {
    let v = rates[id] || 0;
    for (const pid in convOut) if (convOut[pid][id]) v += convOut[pid][id];
    return v;
  }

  /* ---------------------------------------------------------------- */
  /* Manual actions                                                   */
  /* ---------------------------------------------------------------- */

  /* Machines that press a button on your behalf. Each one is worth
     `pressRate` presses a second, and research multiplies all of them. */
  const PRESSERS = C.PRODUCERS.filter(p => p.autoAction);

  function pressCount(a) {
    let n = 0;
    for (const p of PRESSERS) if (p.autoAction === a.id) n += count(p.id) * (p.pressRate || 1);
    return n;
  }

  function pressRate(a) {
    const n = pressCount(a);
    return n > 0 ? n * m.autoRate : 0;
  }

  function clickGain(a) {
    return a.base * (m.click[a.id] || 1) * m.clickAll * (m.res[a.res] || 1) * m.all;
  }
  function clickDepth(a) {
    return (a.depth || 0) * (m.click[a.id] || 1) * m.clickAll;
  }

  function doAction(id) {
    const a = A[id];
    if (!a || s.stage < a.stage) return null;
    if (pressesLeft() <= 0) return null;        // Hands Off: out of presses
    const gains = {};
    const g = clickGain(a);
    add(a.res, g);
    gains[a.res] = g;
    if (a.depth) s.depth += clickDepth(a) * m.depth;
    if (a.manual) for (const k in a.manual) {
      add(k, a.manual[k]);
      gains[k] = (gains[k] || 0) + a.manual[k];
    }
    s.stats.clicks++;
    emit('action', { action: a, gains: gains, depth: a.depth ? clickDepth(a) * m.depth : 0 });
    checkDirectives();
    return gains;
  }

  function add(id, v) {
    if (!(v > 0)) return;
    s.res[id] = (s.res[id] || 0) + v;
    s.earned[id] = (s.earned[id] || 0) + v;
  }

  /* ---------------------------------------------------------------- */
  /* Costs and purchasing                                             */
  /* ---------------------------------------------------------------- */

  /** Total cost of buying `n` more of a producer, given what is already owned. */
  function producerCost(p, n) {
    const have = count(p.id);
    const g = p.growth + (mode().growthBoost || 0);
    const base = scaledCost(p.cost);
    const out = {};
    const factor = g === 1 ? n : Math.pow(g, have) * (Math.pow(g, n) - 1) / (g - 1);
    for (const k in base) out[k] = base[k] * factor;
    return out;
  }

  function canAfford(cost) {
    for (const k in cost) if (res(k) < cost[k] - 1e-9) return false;
    return true;
  }

  function maxAffordable(p) {
    if (!canAfford(producerCost(p, 1))) return 0;
    let lo = 1, hi = 2;
    while (hi < 1e6 && canAfford(producerCost(p, hi))) { lo = hi; hi *= 2; }
    while (lo < hi - 1) {
      const mid = Math.floor((lo + hi) / 2);
      if (canAfford(producerCost(p, mid))) lo = mid; else hi = mid;
    }
    return lo;
  }

  function buyProducer(id, amount) {
    const p = P[id];
    if (!p || !visible(p)) return 0;
    let n = amount === 'max' ? maxAffordable(p) : amount;
    while (n > 0 && !canAfford(producerCost(p, n))) n--;
    if (n <= 0) return 0;
    const cost = producerCost(p, n);
    for (const k in cost) s.res[k] -= cost[k];
    const first = count(p.id) === 0;
    s.prod[id] = count(id) + n;
    s.stats.purchases += n;
    delete s.fresh[id];
    structureDirty = true;
    recompute();
    emit('buy', { entry: p, amount: n, first: first });
    if (first) emit('log', { text: p.name + ' online. ' + describeOutput(p) + '.', kind: 'ok' });
    checkMilestones();
    return n;
  }

  function buyUpgrade(id) {
    const u = U[id];
    if (!u || s.upg[id]) return false;
    const cost = upgradeCost(u);
    if (!canAfford(cost)) return false;
    for (const k in cost) s.res[k] -= cost[k];
    s.upg[id] = true;
    s.stats.purchases++;
    delete s.fresh[id];
    structureDirty = true;
    recompute();
    if (u.doc) unlockDoc(u.doc);
    emit('buy', { entry: u, amount: 1, upgrade: true });
    emit('log', {
      text: (u.milestone ? u.name : 'Installed: ' + u.name) + '.',
      kind: u.milestone ? 'story' : 'ok'
    });
    checkMilestones();
    return true;
  }

  /* ---------------------------------------------------------------- */
  /* Switching recipe buildings on and off                            */
  /* ---------------------------------------------------------------- */

  function isOff(id) { return !!s.off[id]; }

  /** Only buildings that consume a resource can be switched off; the rest
      cost nothing to run, so a switch would be noise. */
  function canToggle(p) { return !!(p && p.use); }

  function toggleProducer(id) {
    const p = P[id];
    if (!canToggle(p)) return false;
    if (s.off[id]) delete s.off[id]; else s.off[id] = true;
    /* the throttle ratio is measured during tick; set it now so the card
       and the resource bar read correctly before the next one runs */
    ratio[id] = s.off[id] ? 0 : 1;
    recompute();
    emit('toggle', { entry: p, off: !!s.off[id] });
    return true;
  }

  function describeOutput(p) {
    const bits = [];
    if (p.prod) for (const k in p.prod) bits.push('+' + FMT.n(p.prod[k] * pMult(p) * m.all) + ' ' + abbr(k) + '/s');
    if (p.depth) bits.push('+' + FMT.n(p.depth * pMult(p) * m.all * m.depth) + ' m/s');
    if (p.perCount) bits.push('compounding multiplier');
    return bits.join(', ') || 'running';
  }

  function abbr(id) {
    const r = C.RESOURCES.find(x => x.id === id);
    return r ? r.abbr : id;
  }

  /* ---------------------------------------------------------------- */
  /* Simulation                                                       */
  /* ---------------------------------------------------------------- */

  /** `live` marks a tick you were present for, as opposed to offline
      catch-up, which the shift timer must not count. */
  function tick(dt, live) {
    if (live) s.stats.active += dt;

    /* Hard Contract: the power cuts out periodically and nothing runs.
       Time still passes, and stocks still spoil. */
    const out = updatePower(dt);
    if (out) { decayStocks(dt); s.depth += 0; s.stats.time += dt; return; }

    for (const k in rates) add(k, rates[k] * dt);

    for (const p of CONVERTERS) {
      const c = count(p.id);
      if (!c) { ratio[p.id] = 1; continue; }
      if (s.off[p.id]) { ratio[p.id] = 0; continue; }
      const f = c * pMult(p) * m.all;
      let rt = 1;
      for (const k in p.use) {
        const need = p.use[k] * f * dt;
        if (need > 0) rt = Math.min(rt, (s.res[k] || 0) / need);
      }
      rt = Math.max(0, Math.min(1, rt));
      if (rt > 0) {
        for (const k in p.use) s.res[k] = Math.max(0, (s.res[k] || 0) - p.use[k] * f * dt * rt);
        const out = convOut[p.id] || {};
        for (const k in out) add(k, out[k] * dt * rt);
      }
      ratio[p.id] = rt;
    }

    s.depth += depthRate * dt;
    s.stats.time += dt;
    decayStocks(dt);
    updateMarket(dt);
  }

  /* ---------------------------------------------------------------- */
  /* Mode mechanics: spoilage, brownouts, a swinging market           */
  /* ---------------------------------------------------------------- */

  /** Hard Contract: everything you are holding slowly goes off. */
  function decayStocks(dt) {
    const rate = mode().decay;
    if (!rate) return;
    const keep = Math.max(0, 1 - rate * dt);
    for (const k in s.res) if (s.res[k] > 0) s.res[k] *= keep;
  }

  /** Returns true while the power is out. */
  function updatePower(dt) {
    const b = mode().brownout;
    if (!b) { s.power = 0; return false; }
    s.powerT = (s.powerT || 0) + dt;
    if (!s.powerNext) s.powerNext = b.every[0] + Math.random() * (b.every[1] - b.every[0]);

    if (s.power > 0) {                       // currently out
      s.power -= dt;
      if (s.power <= 0) {
        s.power = 0;
        s.powerT = 0;
        s.powerNext = b.every[0] + Math.random() * (b.every[1] - b.every[0]);
        emit('power', { out: false });
      }
      return s.power > 0;
    }
    if (s.powerT >= s.powerNext) {
      s.power = b.len;
      emit('power', { out: true, len: b.len });
      return true;
    }
    return false;
  }

  /** Hard Contract: the Scrap Seller's rate rides a slow wave. The rate
      table is only rebuilt when the factor has moved enough to matter. */
  function updateMarket(dt) {
    const v = mode().volatile;
    if (!v) { if (s.market !== 1) { s.market = 1; } return; }
    s.marketT = (s.marketT || 0) + dt;
    const f = 1 + Math.sin(s.marketT * 2 * Math.PI / v.period) * v.swing;
    if (Math.abs(f - (s.market == null ? 1 : s.market)) > 0.03) {
      s.market = f;
      recompute();
    }
  }

  function marketFactor() {
    return mode().volatile ? (s.market == null ? 1 : s.market) : 1;
  }

  /** Offline / background catch-up, sliced so recipes throttle realistically. */
  function simulate(seconds, slices) {
    const n = Math.max(1, Math.min(slices || 60, 240));
    const step = seconds / n;
    for (let i = 0; i < n; i++) tick(step);
  }

  /* ---------------------------------------------------------------- */
  /* Milestones                                                       */
  /* ---------------------------------------------------------------- */

  function unlockDoc(ids) {
    const list = Array.isArray(ids) ? ids : [ids];
    let any = false;
    for (const id of list) {
      if (!C.DOCS[id] || s.docs.indexOf(id) !== -1) continue;
      s.docs.push(id);
      any = true;
      emit('log', { text: 'Archive: ' + C.DOCS[id].src + ' — ' + C.DOCS[id].title + '.', kind: 'story' });
    }
    if (any) { structureDirty = true; emit('docs'); }
  }

  function checkMilestones(quiet) {
